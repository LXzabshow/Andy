<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Andy的冒险背包</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #76b5fe; font-family: 'VT323', monospace; text-align: center; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; transition: background-color 2s ease; }
        .ground { position: absolute; bottom: 0; width: 100%; height: 60px; background: #5D4037; border-top: 10px solid #4CAF50; z-index: 20; }
        .ui-container { margin-top: 5vh; width: 92%; max-width: 420px; z-index: 100; position: relative; }
        .card { background-color: #c6c6c6; border: 4px solid #000; box-shadow: inset 4px 4px #fff, inset -4px -4px #555; padding: 15px; }
        
        .total { font-size: 60px; color: #fff; text-shadow: 4px 4px 0px #333; margin: 0; line-height: 1; }
        
        /* 血条样式 */
        .health-bar-bg { width: 100%; height: 16px; background-color: #333; border: 2px solid #000; margin: 10px 0; position: relative; }
        .health-bar-fill { height: 100%; background-color: #e70000; width: 0%; transition: width 0.5s ease; box-shadow: inset 0px 3px 0px rgba(255,255,255,0.3); }

        /* ------------------- 💎 赚取资源区 (Minecraft 风格按钮) ------------------- */
        .reward-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .mc-item-btn { 
            position: relative; background: #8b8b8b; border: 3px solid #000; border-right-color: #fff; border-bottom-color: #fff;
            padding: 10px; cursor: pointer; overflow: hidden; height: 80px; display: flex; flex-direction: column; justify-content: center;
        }
        .mc-item-btn:active:not(.in-cd) { transform: scale(0.95); }
        .mc-item-title { font-size: 16px; color: #000; margin-bottom: 2px; }
        .mc-item-reward { color: #004400; font-weight: bold; font-size: 18px;}
        
        /* 🔄 冷却转圈特效 (核心) */
        .cd-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.6); display: none; pointer-events: none;
            /* 圆锥渐变扇形 */
            background: conic-gradient(rgba(0,0,0,0.7) var(--progress), transparent 0deg);
        }
        .cd-timer { position: absolute; bottom: 2px; right: 5px; color: #fff; font-size: 14px; font-weight: bold; text-shadow: 1px 1px #000; display: none; }
        .in-cd { cursor: not-allowed; opacity: 0.8; }
        .in-cd .cd-overlay, .in-cd .cd-timer { display: block; }

        /* 其他UI组件 (保持之前版本) */
        #treasure-chest { position: fixed; top: 10%; left: 50%; font-size: 50px; z-index: 200; cursor: pointer; transition: 4s; }
        #challengeModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 300; display: none; justify-content: center; align-items: center; }
        .challenge-card { background: #c6c6c6; border: 4px solid #000; padding: 20px; width: 85%; text-align: center; }
        .challenge-q { font-size: 14px; background: #fff; padding: 10px; margin: 10px 0; white-space: pre-wrap; text-align: left; }
        .status-bar { background: #000; color: #fff; padding: 5px; font-size: 12px; margin-top: 10px; display: inline-block;}
        .message { color: #004400; height: 20px; font-weight: bold; margin-top: 5px;}

        .stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 15;}
        .actor { position: absolute; bottom: 55px; }
        .skin-steve { width: 40px; height: 90px; } /* 缩小主角防止遮挡 */
    </style>
</head>
<body>
    <div class="ui-container">
        <div class="card">
            <p style="margin:0; color:#555;">Andy的冒险口袋</p>
            <div id="totalDisplay" class="total">0</div>
            <div class="health-bar-bg">
                <div id="healthBarFill" class="health-bar-fill"></div>
            </div>
            
            <div class="reward-grid">
                <div class="mc-item-btn" id="btn-sport" onclick="claimReward('sport', '疾跑附魔 (运动)', 10)">
                    <div class="cd-overlay"></div>
                    <span class="mc-item-title">疾跑附魔</span>
                    <span class="mc-item-reward">+10 🪙</span>
                    <span class="cd-timer">--:--</span>
                </div>
                <div class="mc-item-btn" id="btn-focus" onclick="claimReward('focus', '凝神药水 (专注)', 10)">
                    <div class="cd-overlay"></div>
                    <span class="mc-item-title">凝神药水</span>
                    <span class="mc-item-reward">+10 🪙</span>
                    <span class="cd-timer">--:--</span>
                </div>
                <div class="mc-item-btn" id="btn-writing" onclick="claimReward('writing', '成书与笔 (书写)', 10)">
                    <div class="cd-overlay"></div>
                    <span class="mc-item-title">成书与笔</span>
                    <span class="mc-item-reward">+10 🪙</span>
                    <span class="cd-timer">--:--</span>
                </div>
                <div class="mc-item-btn" id="btn-extra" onclick="claimReward('extra', '探索下界 (课外)', 10)">
                    <div class="cd-overlay"></div>
                    <span class="mc-item-title">探索下界</span>
                    <span class="mc-item-reward">+10 🪙</span>
                    <span class="cd-timer">--:--</span>
                </div>
            </div>

            <div class="status-bar" id="connStatus">正在初始化...</div>
            <div id="statusMsg" class="message"></div>
        </div>
    </div>

    <div id="treasure-chest">🎁</div>
    <div class="stage" id="stage"></div>
    <div class="ground"></div>

    <script>
        const BIN_ID = '695f1cbed0ea881f405c1aab'; 
        const API_KEY = '$2a$10$pSEOl/63AtvEMUqQopzGeuhVgcRcfXSz5L8lyQdZZHZM66zdYKI0O'; 
        const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        
        let currentData = null;
        let isAnimating = false;
        const CD_HOURS = 3;

        async function syncData() {
            if(isAnimating) return;
            try {
                let res = await fetch(BASE_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                let data = await res.json();
                let record = data.record;
                
                // 处理自动消耗逻辑 (省略之前代码的部分细节，实际应保留)
                // ... (原有跨日扣减逻辑)
                
                currentData = record;
                updateUI();
            } catch (e) { document.getElementById('connStatus').innerText = "信号中断..."; }
        }

        function updateUI() {
            document.getElementById('totalDisplay').innerText = currentData.coins;
            // 更新血条
            const max = currentData.historicalMaxCoins || currentData.coins;
            const percent = max === 0 ? 0 : (currentData.coins / max) * 100;
            document.getElementById('healthBarFill').style.width = percent + '%';
            document.getElementById('connStatus').innerText = "正在同步云端数据";
        }

        // 核心：处理奖励申领
        async function claimReward(type, actionName, amount) {
            const now = Date.now();
            if(currentData.cooldowns && currentData.cooldowns[type] > now) return; // 还在冷却

            isAnimating = true;
            document.getElementById('connStatus').innerText = "正在向云端申报资源...";
            
            try {
                // 1. 获取最新数据，防止CD绕过
                let res = await fetch(BASE_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                let record = (await res.json()).record;
                
                if(record.cooldowns && record.cooldowns[type] > now) {
                    alert("⚠️ 规则校验失败：该项目正在恢复中！");
                    location.reload();
                    return;
                }

                // 2. 准备新数据
                const newCoins = record.coins + amount;
                const newTime = new Date().toLocaleTimeString('zh-CN', {hour12:false, hour:'2-digit', minute:'2-digit'});
                
                // 更新日志 (只保留最近5条)
                let logs = record.childLogs || [];
                logs.unshift({ time: newTime, action: actionName, amount: amount });
                logs = logs.slice(0, 5);

                // 更新CD
                let cds = record.cooldowns || {};
                cds[type] = now + (CD_HOURS * 60 * 60 * 1000);

                const payload = {
                    ...record,
                    coins: newCoins,
                    historicalMaxCoins: Math.max(newCoins, record.historicalMaxCoins || 0),
                    childLogs: logs,
                    cooldowns: cds
                };

                // 3. 提交
                await fetch(BASE_URL, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(payload)
                });

                currentData = payload;
                updateUI();
                
                // 4. 成功动效
                document.getElementById('statusMsg').innerText = `✅ 已获得 ${actionName} 资源！`;
                setTimeout(() => document.getElementById('statusMsg').innerText = "", 3000);

            } catch (e) { alert("申报失败，请检查网络"); }
            isAnimating = false;
        }

        // 核心：驱动转圈CD特效
        function processCooldowns() {
            if(!currentData || !currentData.cooldowns) return;
            const now = Date.now();
            const types = ['sport', 'focus', 'writing', 'extra'];

            types.forEach(type => {
                const btn = document.getElementById(`btn-${type}`);
                const expire = currentData.cooldowns[type] || 0;
                const remain = expire - now;

                if(remain > 0) {
                    btn.classList.add('in-cd');
                    const totalMs = CD_HOURS * 60 * 60 * 1000;
                    const deg = (remain / totalMs) * 360;
                    btn.style.setProperty('--progress', deg + 'deg');
                    
                    const h = Math.floor(remain / 3600000);
                    const m = Math.floor((remain % 3600000) / 60000);
                    const s = Math.floor((remain % 60000) / 1000);
                    btn.querySelector('.cd-timer').innerText = `${h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
                } else {
                    btn.classList.remove('in-cd');
                }
            });
        }

        window.onload = () => {
            syncData();
            setInterval(syncData, 60000); // 1分钟同步一次余额
            setInterval(processCooldowns, 1000); // 1秒更新一次CD动画
        };
    </script>
</body>
</html>
