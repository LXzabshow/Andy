<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Andy的冒险背包</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #76b5fe; font-family: 'VT323', monospace; text-align: center; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; transition: background 1.5s ease; }
        
        .ground { position: absolute; bottom: 0; width: 100%; height: 20px; background: #5D4037; border-top: 6px solid #4CAF50; z-index: 20; }
        .stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 15;}
        .actor { position: absolute; bottom: 20px; transition: transform 0.1s; z-index: 30; }
        
        .ui-container { margin-top: 5vh; width: 90%; max-width: 400px; z-index: 100; position: relative; transition: opacity 0.5s ease, transform 0.2s ease;}
        
        .card { background-color: var(--card-bg, #c6c6c6); border: 5px solid var(--card-border, #000); box-shadow: inset 4px 4px rgba(255,255,255,0.4), inset -4px -4px rgba(0,0,0,0.4); padding: 20px; position: relative; transition: all 0.5s ease; }
        
        h2 { color: #404040; margin: 0 0 5px 0; font-size: 32px; text-shadow: 2px 2px #fff; letter-spacing: 2px; }
        .rank-badge { background: #333; color: var(--card-border, #f1c40f); padding: 4px 12px; border: 2px solid #fff; display: inline-block; margin-bottom: 10px; font-size: 20px; border-radius: 4px; box-shadow: 2px 2px #000; cursor: pointer; transition: transform 0.1s;}
        .rank-badge:active { transform: scale(0.95); }
        .rank-badge::after { content: ' 🔍'; font-size: 14px; opacity: 0.8; }

        .slot { background: #8b8b8b; width: 100px; height: 100px; margin: 0 auto; border: 4px solid #373737; border-right-color: #fff; border-bottom-color: #fff; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .slot:active .coin-icon { transform: scale(0.8); }
        .coin-icon { font-size: 60px; filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.5)); z-index: 2; transition: transform 0.1s;}
        .label { color: #404040; font-size: 20px; margin-top: 10px; font-weight: bold; text-shadow: 1px 1px #fff;}
        .total { font-size: 70px; color: #fff; font-weight: bold; text-shadow: 4px 4px 0px #333; margin: 5px 0; line-height: 1; }

        #activeBuffsContainer { width: 100%; display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
        .buff-pill { background: rgba(0,0,0,0.7); border: 2px solid #ffb700; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-family: -apple-system, sans-serif; font-weight: bold; text-shadow: 1px 1px #000; box-shadow: 0 2px 8px rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; animation: glow 2s infinite alternate;}
        @keyframes glow { from { box-shadow: 0 0 5px #ffb700; } to { box-shadow: 0 0 15px #ffb700, 0 0 5px #ffb700 inset; } }

        .health-bar-container { width: 100%; margin-top: 10px; padding: 0 10px; box-sizing: border-box; }
        .health-bar-label { font-size: 16px; color: #404040; font-weight: bold; margin-bottom: 5px; text-shadow: 1px 1px #fff; text-align: left; display:flex; justify-content: space-between;}
        .health-bar-bg { width: 100%; height: 24px; background-color: #333; border: 3px solid #000; position: relative; box-shadow: inset 2px 2px #111, inset -2px -2px #555; overflow: hidden;}
        .health-bar-fill { height: 100%; background-color: #e70000; width: 0%; transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: inset 0px 4px 0px rgba(255,255,255,0.3), inset 0px -4px 0px rgba(0,0,0,0.2); }
        .health-bar-fill.safe { background-color: #2ecc71; }
        .health-bar-fill.warn { background-color: #f1c40f; }

        .btn-upgrade { width: 100%; margin-top: 15px; padding: 12px; font-family: 'VT323', monospace; font-size: 20px; font-weight: bold; color: white; background: #d35400; border: 4px solid #000; cursor: pointer; box-shadow: inset 4px 4px rgba(255,255,255,0.3), inset -4px -4px rgba(0,0,0,0.3); animation: pulse 2s infinite;}
        .btn-upgrade:disabled { background: #7f8c8d; cursor: not-allowed; animation: none; filter: grayscale(1); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        
        .main-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-main-action { width: 100%; padding: 10px; font-family: inherit; font-size: 20px; font-weight: bold; color: white; background: #27ae60; border: 4px solid #000; cursor: pointer; box-shadow: inset 4px 4px rgba(255,255,255,0.3), inset -4px -4px rgba(0,0,0,0.3); }
        .btn-main-action:active:not(:disabled) { transform: scale(0.95); }
        .btn-shop { background: #e67e22; }
        .btn-game { background: #8e44ad; }
        .btn-log { background: #7f8c8d; }

        .status-bar { background: #000; color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 14px; display: inline-flex; align-items: center; margin-top: 10px; border: 2px solid #555; }
        .light { width: 8px; height: 8px; background: #e74c3c; margin-right: 8px; }
        .light.online { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .message { color: #004400; margin-top: 10px; font-size: 16px; height: 24px; text-shadow: 1px 1px #fff; font-weight: bold; line-height: 1.2;}
        .mute-btn { position: absolute; top: 10px; right: 10px; font-size: 24px; cursor: pointer; color: #555; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 400; display: none; justify-content: center; align-items: center; padding: 10px;}
        .challenge-card { background: #c6c6c6; border: 4px solid #000; box-shadow: inset 4px 4px #fff, inset -4px -4px #555; padding: 15px; width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; max-height: 90vh;}
        .challenge-title { font-size: 28px; color: #333; margin-bottom: 10px; text-shadow: 1px 1px #fff; flex-shrink: 0;}
        .btn-close-modal { background: #c0392b; color: white; padding: 10px 20px; border: 2px solid #000; font-family: inherit; font-size: 20px; cursor: pointer; box-shadow: inset 2px 2px #fff, inset -2px -2px #555; margin-top: 10px; width: 100%; flex-shrink: 0;}

        .reward-grid { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; overflow-y: auto; padding-right: 5px;}
        .mc-item-btn { position: relative; background: #8b8b8b; border: 3px solid #000; border-right-color: #fff; border-bottom-color: #fff; padding: 12px; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; text-align: left; min-height: 90px; height: auto; }
        .mc-item-btn:active:not(.in-cd) { transform: scale(0.98); }
        .mc-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; width: 100%; }
        .mc-item-title { font-size: 18px; color: #000; font-weight: bold; text-shadow: 1px 1px #fff; }
        .mc-item-reward { color: #004400; font-weight: bold; font-size: 22px; text-shadow: 1px 1px #fff;}
        .mc-item-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; color: #222; line-height: 1.4; text-shadow: 1px 1px rgba(255,255,255,0.4); word-break: break-all; margin-top: 2px; padding-bottom: 5px;}
        
        .cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; pointer-events: none; background: conic-gradient(rgba(0,0,0,0.7) var(--progress), transparent 0deg); }
        .cd-timer { position: absolute; bottom: 6px; right: 8px; color: #fff; font-size: 18px; font-weight: bold; text-shadow: 1px 1px #000, -1px -1px #000, 1px -1px #000, -1px 1px #000; display: none; }
        .in-cd { cursor: not-allowed; opacity: 0.8; }
        .in-cd .cd-overlay, .in-cd .cd-timer { display: block; }

        /* 舒尔特游戏方格特调样式 - 移除背景和文字颜色的 important 以支持纯 JS 内联阻断重绘 */
        #schulteGrid { display: grid; width: 100%; aspect-ratio: 1; gap: 5px; background: #373737; padding: 6px; border: 4px solid #000; box-shadow: inset -3px -3px #fff, inset 3px 3px #111; }
        .schulte-cell { background: #c6c6c6; border: 3px solid #000; box-shadow: inset 2px 2px #fff, inset -2px -2px #555; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; cursor: pointer; aspect-ratio: 1; transition: transform 0.05s; }
        .schulte-cell:active { transform: scale(0.92); }
        .schulte-cell.correct { background: #2ecc71 !important; color: #fff !important; box-shadow: inset 3px 3px rgba(255,255,255,0.4), inset -3px -3px rgba(0,0,0,0.4) !important; cursor: not-allowed !important; }

        .rank-list-item { background: #fff; border: 2px solid #555; padding: 12px; margin-bottom: 10px; text-align: left; font-family: -apple-system, sans-serif; }
        .rank-list-item.unlocked { border-left-width: 6px; background: #f0f8ff; }
        .rank-list-item.next-target { border: 3px dashed #e67e22; background: #fffdf5; box-shadow: inset 0 0 15px rgba(230,126,34,0.2); }
        .rank-list-item.locked { background: #d5d5d5; opacity: 0.6; filter: grayscale(1); border: 2px solid #888; }
        .r-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; color: #000; }
        .r-desc { font-size: 13px; color: #333; line-height: 1.4; }
        .r-cost { font-size: 14px; font-weight: bold; color: #c0392b; margin-top: 5px; }

        .log-container { max-height: 250px; overflow-y: auto; text-align: left; background: #fff; border: 2px solid #555; padding: 10px; font-family: -apple-system, sans-serif; font-size: 14px; }
        .log-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #ccc; }
        .log-row:last-child { border-bottom: none; }
        .log-t { color: #888; font-size: 11px; min-width: 80px;}
        .log-a { font-weight: bold; color: #333; flex: 1; margin: 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        .log-v { font-weight: bold; color: #27ae60; text-align: right; min-width: 30px;}
        .log-v.sub { color: #e74c3c; }

        #treasure-chest { position: fixed; top: 10%; left: 50%; font-size: 60px; z-index: 200; cursor: pointer; display: none; }
        .chest-float-anim { animation: bobbing 1s infinite alternate; }
        @keyframes bobbing { from { transform: translateY(0); } to { transform: translateY(-5px); } }

        .challenge-q { font-size: 14px; color: #000; margin: 15px 0; font-weight: bold; background: #fff; padding: 8px; border: 2px solid #555; white-space: pre-wrap; text-align: left; max-height: 250px; overflow-y: auto;}
        .challenge-input { font-family: 'VT323', monospace; font-size: 24px; padding: 5px; width: 80%; text-align: center; border: 2px solid #000; margin-bottom: 15px;}
        .btn-submit { background: #27ae60; color: white; padding: 10px 20px; border: 2px solid #000; font-family: inherit; font-size: 20px; cursor: pointer; }

        /* 模型动画 */
        .skin-steve { width: 60px; height: 135px; }
        .skin-steve .head { width: 60px; height: 60px; background: #F8B090; position: absolute; top: 0; z-index: 2; }
        .skin-steve .hair { width: 60px; height: 15px; background: #452613; position: absolute; top: 0; z-index: 3; }
        .skin-steve .body { width: 60px; height: 45px; background: #00AAAA; position: absolute; top: 60px; z-index: 1; }
        .skin-steve .pants { width: 60px; height: 30px; background: #303090; position: absolute; top: 105px; }
        .skin-steve .sword { position: absolute; top: 35px; right: -40px; font-size: 60px; transform: scaleX(-1) rotate(45deg); transform-origin: 20% 80%; z-index: 4; display: none; filter: drop-shadow(2px 2px 0 #000); }
        .skin-creeper { width: 45px; height: 120px; }
        .skin-creeper .head { width: 45px; height: 45px; background: #00AA00; position: absolute; top: 0; border: 3px solid #005500; }
        .skin-creeper .face { position: absolute; top: 10px; left: 8px; width: 29px; height: 25px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8"><path d="M1 1h2v2h2v-2h2v3h-2v1h1v2h-2v-1h-2v1h-2v-2h1v-1h-2z"/></svg>'); opacity: 0.8; }
        .skin-creeper .body { width: 45px; height: 45px; background: #00AA00; position: absolute; top: 45px; }
        .skin-creeper .legs { width: 45px; height: 30px; position: absolute; top: 90px; }
        .skin-creeper .leg { width: 15px; height: 30px; background: #00AA00; position: absolute; bottom:0; }
        .skin-villager { width: 50px; height: 140px; }
        .skin-villager .head { width: 50px; height: 60px; background: #d09b7c; position: absolute; top: 0; }
        .skin-villager .nose { width: 10px; height: 18px; background: #d09b7c; position: absolute; top: 30px; left: 20px; border: 1px solid #a3755b; z-index: 5;}
        .skin-villager .body { width: 50px; height: 80px; background: #684831; position: absolute; top: 60px; }
        .skin-villager .arms { width: 50px; height: 15px; background: #684831; position: absolute; top: 75px; left: 0; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }

        .breathe { animation: breathe 2s ease-in-out infinite; }
        @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02); } }
        .anim-attack { animation: swordSwing 0.35s ease-out forwards; }
        @keyframes swordSwing { 0% { transform: scaleX(-1) rotate(45deg); } 50% { transform: scaleX(-1) rotate(-60deg); } 100% { transform: scaleX(-1) rotate(45deg); } }
        .anim-hurt { animation: hurtFlash 0.3s steps(2) infinite; }
        @keyframes hurtFlash { 0% { filter: sepia(1) hue-rotate(-50deg) saturate(5); } 100% { filter: none; } }
        .anim-swell { animation: swell 2.5s ease-in forwards; }
        @keyframes swell { 0% { transform: scale(1); filter: brightness(1); } 95% { transform: scale(2.5); filter: brightness(100); opacity: 1;} 100% { transform: scale(3); opacity: 0; } }
        .shake { animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 20% { transform: translate(-4px, 0px); } 40% { transform: translate(2px, -2px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -4px); } }
        .run-l-to-r { animation: runLeftToRight 8s linear forwards; }
        @keyframes runLeftToRight { 0% { left: -150px; } 100% { left: 120vw; } }
        .run-r-to-l { animation: runRightToLeft 8s linear forwards; }
        @keyframes runRightToLeft { 0% { right: -150px; } 100% { right: 120vw; } }
        
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .mc-btn { background: #727272; border: 4px solid #fff; padding: 15px 30px; font-size: 24px; color: white; font-family: 'VT323', monospace; cursor: pointer; }
        .confetti { position: fixed; top: 50%; left: 50%; z-index: 999; animation: explode-particle 1s ease-out forwards; pointer-events: none; font-size: 30px;}
        @keyframes explode-particle { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(720deg); opacity: 0; } }

        .flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 9998; opacity: 0; pointer-events: none; animation: flashAnim 1.2s ease-out forwards; }
        @keyframes flashAnim { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
        .level-up-banner { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0); z-index: 9999; color: #ffb700; font-family: 'VT323', monospace; text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; text-align: center; white-space: nowrap; pointer-events: none; animation: bannerAnim 3.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes bannerAnim { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 25% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; filter: blur(5px);} }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div id="start-overlay">
        <h1 style="font-size: 40px; margin-bottom:10px;">Andy的探险世界</h1>
        <button class="mc-btn" onclick="startGame()">开始冒险</button>
    </div>

    <audio id="bgm" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-levelup"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/levelup.ogg" type="audio/ogg"></audio>
    <audio id="sfx-explode"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/explode.ogg" type="audio/ogg"></audio>
    <audio id="sfx-hit"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/damage/hit1.ogg" type="audio/ogg"></audio>
    <audio id="sfx-fuse"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/fuse.ogg" type="audio/ogg"></audio>
    <audio id="sfx-click"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/click.ogg" type="audio/ogg"></audio>

    <div id="treasure-chest" class="chest-float-anim" onclick="openChallengeModal()">🎁</div>

    <div id="challengeModal" class="modal-overlay">
        <div class="challenge-card">
            <div class="challenge-title">📜 未知悬赏令</div>
            <div style="color:#00aa00; font-size:20px; font-weight:bold;">赏金: <span id="c_reward">50</span> 币</div>
            <div id="c_timer" style="color:red; font-size:18px; margin: 10px 0;">宝箱消散倒计时...</div>
            <div class="challenge-q" id="c_question">题目加载中...</div>
            <input type="text" id="c_input" class="challenge-input" placeholder="输入密码">
            <br>
            <button class="btn-submit" onclick="submitAnswer()">解开封印</button>
            <button class="btn-close-modal" style="width: auto; margin-left: 10px; display:inline-block;" onclick="closeChallengeModal()">放弃</button>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay" style="z-index: 500;">
        <div class="challenge-card" style="max-width: 300px;">
            <div class="challenge-title" style="font-size: 24px;">📋 确认告示</div>
            <div id="confirmText" style="color:#000; font-size:16px; margin: 15px 0; font-weight:bold; line-height:1.5;">...</div>
            <button class="btn-main-action" onclick="executeConfirmedAction()" style="margin-top: 5px;">✅ 确定</button>
            <button class="btn-close-modal" onclick="closeConfirmModal()" style="margin-top: 5px;">❌ 取消</button>
        </div>
    </div>

    <div id="rankModal" class="modal-overlay" style="z-index: 600;">
        <div class="challenge-card" style="max-width: 360px; max-height: 85vh;">
            <div class="challenge-title" style="color: #d35400;">👑 境界图鉴</div>
            <div id="rankListContainer" style="width: 100%; overflow-y: auto; margin-top: 10px; padding-right: 5px;"></div>
            <button class="btn-close-modal" onclick="closeRankModal()" style="margin-top: 15px;">关闭图鉴</button>
        </div>
    </div>

    <div id="rewardModal" class="modal-overlay">
        <div class="challenge-card">
            <div class="challenge-title">⚔️ 任务告示牌</div>
            <div class="reward-grid" id="rewardListContainer">
                <div style="padding:20px; color:#555;">正在同步悬赏任务...</div>
            </div>
            <button class="btn-close-modal" onclick="closeRewardModal()">返回营地</button>
        </div>
    </div>

    <div id="shopModal" class="modal-overlay">
        <div class="challenge-card">
            <div class="challenge-title" style="color: #8e44ad;">🛒 神秘商店</div>
            <div class="reward-grid" id="shopListContainer">
                <div style="padding:20px; color:#555;">货架同步中...</div>
            </div>
            <button class="btn-close-modal" onclick="closeShopModal()">离开商店</button>
        </div>
    </div>

    <div id="gameModal" class="modal-overlay" style="z-index: 600;">
        <div class="challenge-card" style="max-width: 380px; width: 95%;">
            <div class="challenge-title" style="color: #8e44ad;">👁️ 舒尔特专注训练</div>
            <div id="gameMenu">
                <div id="gameRemainingCount" style="color: #004400; font-weight: bold; margin-bottom: 20px; font-size: 18px; text-shadow: 1px 1px #fff;">今日已领奖次数: -- / 5</div>
                <button class="btn-main-action" onclick="startGameSession(6)" style="background: #27ae60; margin-bottom: 12px; font-size:22px;">🟢 普通难度 (6x6)</button>
                <button class="btn-main-action" onclick="startGameSession(7)" style="background: #c0392b; margin-bottom: 20px; font-size:22px;">🔴 困难难度 (7x7)</button>
                <button class="btn-close-modal" onclick="closeGameModal()">关闭秘境</button>
            </div>
            <div id="gamePlay" style="display: none; flex-direction: column; align-items: center; width: 100%;">
                <div style="display: flex; justify-content: space-between; width: 100%; font-size: 22px; font-weight: bold; margin-bottom: 12px; color: #111; text-shadow:1px 1px #fff;">
                    <span>锁定目标: <span id="gameTargetNum" style="color: #e67e22; font-size: 26px;">1</span></span>
                    <span>⏳ 倒计时: <span id="gameTimerText" style="color: #c0392b;">30</span>s</span>
                </div>
                <div id="schulteGrid"></div>
                <button class="btn-close-modal" onclick="quitGameSession()" style="margin-top: 15px; background:#7f8c8d;">🏳️ 放弃训练</button>
            </div>

        function getFormattedTime() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            return `${month}-${day} ${hours}:${mins}`;
        }
        
        function getTodayStr() { 
            const parts = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
            let y, m, d; parts.forEach(p => { if(p.type==='year') y=p.value; if(p.type==='month') m=p.value; if(p.type==='day') d=p.value; });
            return `${y}-${m}-${d}`;
        }

        async function checkAndApplyDailyDeduction(record) {
            if (!record.dailyConfig || !record.dailyConfig.enabled) return record;
            let today = getTodayStr();
            if(record.dailyConfig.lastDeductDate === today) return record;
            
            let totalDeduct = record.dailyConfig.amount;
            let deductedAmount = Math.min(record.coins, totalDeduct); 
            if(deductedAmount === 0) {
                await dbClient.from('gamedata').update({ dailyConfig: { ...record.dailyConfig, lastDeductDate: today } }).eq('id', ROW_ID);
                return record;
            }

            record.coins = Math.max(0, record.coins - totalDeduct);
            record.dailyConfig.lastDeductDate = today;
            let logs = record.childLogs || [];
            logs.unshift({ time: getFormattedTime(), action: "系统自动饥饿消耗", amount: -deductedAmount });
            
            try {
                await dbClient.from('gamedata').update({ coins: record.coins, dailyConfig: record.dailyConfig, childLogs: logs.slice(0, 10) }).eq('id', ROW_ID);
                record._justAutoDeducted = deductedAmount;
            } catch (e) {}
            return record;
        }

        async function startGame() {
            document.getElementById('start-overlay').style.display='none';
            await syncData();
            syncInterval = setInterval(syncData, 5000); 
            setInterval(processCooldowns, 1000); 
            setInterval(renderBuffs, 1000); 
            playAmbientScenario();
            ambientInterval = setInterval(playAmbientScenario, 12000);
        }

        async function syncData() {
            if(isAnimating || isGameRunning) return;
            try {
                const { data } = await dbClient.from('gamedata').select('*').eq('id', ROW_ID);
                if (!data || data.length === 0) return;
                
                let record = data[0];
                record.currentRank = record.currentRank || 1; 
                record.shopItems = record.shopItems || [];
                record.activeBuffs = record.activeBuffs || {};
                record.schulteDaily = record.schulteDaily || { lastDate: "", count: 0 };
                record.taskItems = record.taskItems || [];
                
                record = await checkAndApplyDailyDeduction(record);
                currentData = record;
                let cloudCoins = record.coins || 0;
                
                renderLogs(record.childLogs);
                updateRankUI(cloudCoins, record.currentRank);

                if (record._justAutoDeducted > 0) {
                    playExplodeSequence(record._justAutoDeducted, cloudCoins, `饥饿值消耗！扣除 ${record._justAutoDeducted} 币`);
                    localStorage.setItem('andy_last_seen_coins', cloudCoins);
                    return; 
                }

                if(record.activeEvent && record.activeEvent.expireTime > Date.now()) {
                    activeEventData = record.activeEvent;
                    if(chest && chest.style.display !== 'block') { chest.style.display = 'block'; startFloatingChest(); }
                } else {
                    if(chest) chest.style.display = 'none'; stopFloatingChest();
                }

                let localStr = localStorage.getItem('andy_last_seen_coins');
                if (localStr === null) {
                    if(totalDisplay) totalDisplay.innerText = cloudCoins; 
                    localStorage.setItem('andy_last_seen_coins', cloudCoins);
                    return;
                }
                lastCoins = parseInt(localStr);

                if (cloudCoins > lastCoins) {
                    playAttackSequence(cloudCoins - lastCoins, cloudCoins);
                } else if (cloudCoins < lastCoins) {
                    playExplodeSequence(lastCoins - cloudCoins, cloudCoins, `遭遇劫掠！扣减 ${lastCoins - cloudCoins}`);
                } else {
                    if(totalDisplay) totalDisplay.innerText = cloudCoins;
                }
                localStorage.setItem('andy_last_seen_coins', cloudCoins);
                if(connStatus) connStatus.innerText = "信号良好";
                
            } catch (error) { 
                if(connStatus) connStatus.innerText = "失去连接..."; 
            }
        }

        function updateRankUI(coins, rank) {
            const rData = RANK_DATA[rank - 1] || RANK_DATA[0];
            if (uiCard) {
                uiCard.style.setProperty('--card-border', rData.color);
                uiCard.style.setProperty('--card-bg', rData.bg);
            }
            if (rankBadge) rankBadge.innerText = rData.title;

            const hour = new Date().getHours();
            const isNight = (hour >= 18 || hour < 6);
            document.body.style.background = (rank >= 9) ? rData.pageBg : (isNight ? rData.nightBg : rData.pageBg);

            let maxCap = rData.cap;
            let ratio = maxCap === Infinity ? 0 : (coins / maxCap) * 100;
            const capText = document.getElementById('capacityText');
            if (capText) capText.innerText = `${coins} / ${maxCap === Infinity ? '∞' : maxCap}`;
            
            const fill = document.getElementById('healthBarFill');
            if (fill) {
                fill.style.width = ratio + '%';
                if(ratio > 85) { fill.className = 'health-bar-fill warn'; }
                else if (ratio < 40) { fill.className = 'health-bar-fill safe'; }
                else { fill.className = 'health-bar-fill'; }
            }

            if (btnUpgrade) {
                if (rank >= RANK_DATA.length) {
                    btnUpgrade.innerText = "已达最高境界 👑";
                    btnUpgrade.disabled = true;
                } else {
                    btnUpgrade.innerText = `🆙 突破界限 (需花费 ${rData.cost} 币)`;
                    btnUpgrade.disabled = coins < rData.cost;
                }
            }
        }

        function openRankModal() {
            if(!rankModal || !currentData) return;
            clickCoin();
            rankModal.style.display = 'flex';
            const container = document.getElementById('rankListContainer');
            if(!container) return;

            let currentLevel = currentData.currentRank || 1;
            let html = '';

            RANK_DATA.forEach((r, index) => {
                let rankLevel = index + 1;
                if (rankLevel <= currentLevel) {
                    let isCurrent = (rankLevel === currentLevel);
                    html += `
                        <div class="rank-list-item unlocked" style="border-left-color: ${r.color};">
                            <div class="r-title">${r.title} <span style="font-size:12px;color:#27ae60;">(${isCurrent ? '👉 当前所在' : '✅ 已解锁'})</span></div>
                            <div class="r-desc">背包容量上限: ${r.cap === Infinity ? '无限 ∞' : r.cap + ' 币'}</div>
                        </div>`;
                } else if (rankLevel === currentLevel + 1) {
                    html += `
                        <div class="rank-list-item next-target">
                            <div class="r-title" style="color:#e67e22;">🎯 突破目标: ${r.title}</div>
                            <div class="r-desc">升级后背包容量上限: ${r.cap === Infinity ? '无限 ∞' : r.cap + ' 币'}</div>
                            <div class="r-cost">突破消耗: -${RANK_DATA[currentLevel - 1].cost} 🪙</div>
                        </div>`;
                } else {
                    html += `
                        <div class="rank-list-item locked">
                            <div class="r-title" style="color:#555;">第 ${rankLevel} 阶: ??? (未知的境界)</div>
                            <div class="r-desc" style="color:#666;">背包容量上限: ???</div>
                            <div class="r-cost" style="color:#666;">突破消耗: ???</div>
                        </div>`;
                }
            });
            container.innerHTML = html;
        }
        function closeRankModal() { if(rankModal) rankModal.style.display = 'none'; }

        function renderBuffs() {
            if (!currentData || !currentData.activeBuffs) return;
            const container = document.getElementById('activeBuffsContainer');
            if (!container) return; 
            let html = '';
            const now = Date.now();
            
            for (const [id, buff] of Object.entries(currentData.activeBuffs)) {
                const remain = buff.endTime - now;
                if (remain > 0) {
                    let days = Math.floor(remain / (24 * 3600000));
                    let hours = Math.floor((remain % (24 * 3600000)) / 3600000);
                    let mins = Math.floor((remain % 3600000) / 60000);
                    let timeStr = days >= 1 ? `${days}天 ${hours}小时` : `${hours}小时 ${mins}分`;
                    html += `<div class="buff-pill"><span>${buff.icon} ${buff.name}</span><span>${timeStr}</span></div>`;
                }
            }
            container.innerHTML = html;
        }

        function openRewardModal() { 
            if(rModal) { rModal.style.display = 'flex'; renderDynamicTasks(); processCooldowns(); } 
        }
        function closeRewardModal() { if(rModal) rModal.style.display = 'none'; }

        function renderDynamicTasks() {
            const container = document.getElementById('rewardListContainer');
            if(!container) return;
            if(!currentData || !currentData.taskItems || currentData.taskItems.length === 0) {
                container.innerHTML = '<div style="padding:20px; color:#555; text-align:center;">告示牌空空如也，暂无悬赏挑战</div>';

            }
            container.innerHTML = currentData.taskItems.map(task => `
                <div class="mc-item-btn" id="btn-${task.id}" onclick='triggerTaskClick("${task.id}")'>
                    <div class="cd-overlay"></div>

                        <span class="mc-item-title">${task.icon || '⚔️'} ${task.name}</span>

                    <div class="mc-item-desc">${task.desc}</div>
                    <span class="cd-timer">--:--</span>
                </div>
            `).join('');
        }
        function triggerTaskClick(taskId) {
            const task = currentData.taskItems.find(t => t.id === taskId);
            if(task) requestAction('reward', task);
        }

        function openShopModal() { 
            if(!sModal) return; sModal.style.display = 'flex'; 
            const container = document.getElementById('shopListContainer');
            if(!container) return;

            if(!currentData || !currentData.shopItems || currentData.shopItems.length === 0) {
                container.innerHTML = '<div style="padding:20px; color:#555;">货架空空如也，暂无商品</div>'; return;
            }
            container.innerHTML = currentData.shopItems.map(item => `
                <div class="mc-item-btn" onclick="triggerBuy('${item.id}')" style="border-color:#8e44ad;">
                    <div class="mc-item-header"><span class="mc-item-title">${item.icon} ${item.name}</span><span class="mc-item-reward" style="color:#c0392b;">-${item.price} 🪙</span></div>
                    <div class="mc-item-desc">${item.desc} <br><span style="color:#555;">(持续 ${item.hours >= 24 ? (item.hours/24 + ' 天') : (item.hours + ' 小时')})</span></div>
                </div>
            `).join('');
        }
        function closeShopModal() { if(sModal) sModal.style.display = 'none'; }
        function triggerBuy(itemId) { const item = currentData.shopItems.find(i => i.id === itemId); if(item) requestAction('buy', item); }

        function requestAction(actionType, data) {
            clickCoin();
            if (actionType === 'reward') {
                const now = Date.now();
                if(currentData.cooldowns && currentData.cooldowns[data.id] > now) return; 
                const maxCap = RANK_DATA[(currentData.currentRank || 1) - 1].cap;
                if (currentData.coins + data.price > maxCap) { playSound('fuse'); return alert("🎒 背包容量上限不足！\n新奖励无法装下，请先突破界限腾出空间。"); }
                document.getElementById('confirmText').innerHTML = `确认已达标并领取<br><span style="color:#27ae60; font-size:20px;">【${data.name}】</span><br>的悬赏奖励吗？`;
            } 
            else if (actionType === 'buy') {
                if (currentData.coins < data.price) { playSound('fuse'); return alert("❌ 行囊硬币不足，无法兑换该法宝！"); }
                document.getElementById('confirmText').innerHTML = `确认花费 <span style="color:#c0392b;">${data.price}币</span> 兑换<br><span style="color:#8e44ad; font-size:20px;">【${data.name}】</span> 吗？<br><span style="font-size:12px; color:#555;">(若已有该法宝，时间将叠加延长)</span>`;
            }
            pendingAction = { actionType, data };
            if(cfModal) cfModal.style.display = 'flex';
        }

        function closeConfirmModal() { if(cfModal) cfModal.style.display = 'none'; pendingAction = null; }

        async function executeConfirmedAction() {
            if (!pendingAction) return;
            const action = pendingAction; closeConfirmModal();
            if (action.actionType === 'reward') await proceedWithReward(action.data);
            else if (action.actionType === 'buy') await proceedWithBuy(action.data);
        }

        async function proceedWithBuy(item) {
            try {
                const { data } = await dbClient.from('gamedata').select('*').eq('id', ROW_ID); let record = data[0];
                const newCoins = record.coins - item.price;
                let logs = record.childLogs || []; logs.unshift({ time: getFormattedTime(), action: `兑换法宝: ${item.name}`, amount: -item.price });
                let buffs = record.activeBuffs || {}; let currentEndTime = buffs[item.id] ? buffs[item.id].endTime : 0;
                if (currentEndTime < Date.now()) currentEndTime = Date.now();
                buffs[item.id] = { name: item.name, icon: item.icon, endTime: currentEndTime + (item.hours * 3600000) };

                await dbClient.from('gamedata').update({ coins: newCoins, childLogs: logs.slice(0, 10), activeBuffs: buffs }).eq('id', ROW_ID);
                currentData = { ...record, coins: newCoins, childLogs: logs, activeBuffs: buffs };
                localStorage.setItem('andy_last_seen_coins', newCoins); closeShopModal(); playSound('levelup');
                createParticles(50, ['✨', item.icon, '🔮']); updateValue(newCoins); renderBuffs();
            } catch (e) { alert("兑换受阻，请重试！"); }
        }

        async function proceedWithReward(taskData) {
            try {
                const { data } = await dbClient.from('gamedata').select('*').eq('id', ROW_ID); let record = data[0];
                const newCoins = record.coins + taskData.price;
                let logs = record.childLogs || []; logs.unshift({ time: getFormattedTime(), action: `挑战: ${taskData.name}`, amount: taskData.price });
                let cds = record.cooldowns || {}; cds[taskData.id] = Date.now() + (taskData.hours * 3600000); 

                await dbClient.from('gamedata').update({ coins: newCoins, childLogs: logs.slice(0, 10), cooldowns: cds }).eq('id', ROW_ID);
                currentData = { ...record, coins: newCoins, childLogs: logs, cooldowns: cds };
                localStorage.setItem('andy_last_seen_coins', newCoins); closeRewardModal(); playAttackSequence(taskData.price, newCoins);
            } catch (e) { alert("申报异常，请重试"); }
        }

        // 舒尔特专注训练逻辑
        function openGameModal() {
            if (!currentData) return;
            [sModal, rModal, lModal, cfModal, rankModal].forEach(m => { if(m) m.style.display = 'none'; });
            gModal.style.display = 'flex'; backToGameMenu();

        function closeGameModal() { quitGameSession(); gModal.style.display = 'none'; }
        
        function backToGameMenu() {
            clearInterval(gameClockTimer); isGameRunning = false;
            document.getElementById('gameMenu').style.display = 'block'; document.getElementById('gamePlay').style.display = 'none'; document.getElementById('gameResult').style.display = 'none';
            let schulte = currentData.schulteDaily || { lastDate: "", count: 0 };
            let displayCount = (schulte.lastDate === getTodayStr()) ? schulte.count : 0;
            document.getElementById('gameRemainingCount').innerText = `今日已领奖次数: ${displayCount} / 5`;
        }

        function startGameSession(size) {
            currentGameSize = size; nextTargetNum = 1; gameTimeRemaining = (size === 6) ? 40 : 75; isGameRunning = true;
            document.getElementById('gameMenu').style.display = 'none'; document.getElementById('gameResult').style.display = 'none'; document.getElementById('gamePlay').style.display = 'flex';
            document.getElementById('gameTargetNum').innerText = nextTargetNum; document.getElementById('gameTimerText').innerText = gameTimeRemaining;

            let totalCells = size * size; let numberPool = [];
            for(let i = 1; i <= totalCells; i++) numberPool.push(i);
            for(let i = numberPool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [numberPool[i], numberPool[j]] = [numberPool[j], numberPool[i]]; }

            const gridContainer = document.getElementById('schulteGrid'); gridContainer.style.gridTemplateColumns = `repeat(${size}, 1fr)`; gridContainer.innerHTML = '';
            numberPool.forEach(num => { 
                const cell = document.createElement('div'); 
                cell.className = 'schulte-cell'; 
                cell.innerText = num; 
                // 动态字号缩放，防高密度矩阵误触
                cell.style.fontSize = size === 7 ? '20px' : '24px';
                cell.onclick = () => handleCellClick(cell, num); 
                gridContainer.appendChild(cell); 
            });

            clearInterval(gameClockTimer); gameStartTime = Date.now();
            gameClockTimer = setInterval(() => { gameTimeRemaining--; document.getElementById('gameTimerText').innerText = gameTimeRemaining; if(gameTimeRemaining <= 0) endGameSession(false); }, 1000);
        }

        function handleCellClick(cell, num) {
            if(!isGameRunning || cell.classList.contains('correct')) return;
            if(num === nextTargetNum) {
                cell.classList.add('correct'); clickCoin(); nextTargetNum++;
                if(nextTargetNum > currentGameSize * currentGameSize) endGameSession(true);
                else document.getElementById('gameTargetNum').innerText = nextTargetNum;
            } else { 
                playSound('fuse'); 
                // JS 绝对内联干预，无视 CSS 动画重绘失效问题
                cell.style.backgroundColor = '#c0392b';
                cell.style.color = '#fff';
                if(cell.wrongTimeout) clearTimeout(cell.wrongTimeout);
                cell.wrongTimeout = setTimeout(() => {
                    cell.style.backgroundColor = '';
                    cell.style.color = '';
                }, 200);
            }
        }

        function quitGameSession() { clearInterval(gameClockTimer); isGameRunning = false; backToGameMenu(); }

        async function endGameSession(isWin) {
            clearInterval(gameClockTimer); isGameRunning = false;
            document.getElementById('gamePlay').style.display = 'none';
            const resultBox = document.getElementById('gameResult'); const rTitle = document.getElementById('gameResultTitle'); const rDesc = document.getElementById('gameResultDesc'); const rBtn = document.getElementById('btnGameRetry');
            resultBox.style.display = 'block'; rBtn.onclick = () => startGameSession(currentGameSize);

            if(!isWin) {
                playSound('explode'); rTitle.innerText = "⏳ 训练超时 (失败)"; rTitle.style.color = "#c0392b";
                rDesc.innerHTML = "沙漏空了！你的眼睛搜寻速度慢了一步，潜能未能完全激发。是否重新开启高能核心，再次向极限发起挑战？"; rBtn.innerText = "重新接受挑战"; return;
            }

            let elapsed = ((Date.now() - gameStartTime) / 1000).toFixed(1);
            rTitle.innerText = "🎉 挑战成功！"; rTitle.style.color = "#27ae60"; playSound('levelup');

            let schulte = currentData.schulteDaily || { lastDate: "", count: 0 }; let today = getTodayStr();
            if(schulte.lastDate !== today) { schulte.lastDate = today; schulte.count = 0; }

            if(schulte.count < 5) {
                let rewardAmt = (currentGameSize === 6) ? 3 : 5;
                rDesc.innerHTML = `卓越的视界与专注！你用时 <span style="color:#e67e22;font-weight:bold;">${elapsed}秒</span> 彻底攻克了 ${currentGameSize}x${currentGameSize} 矩阵！<br><br>🎁 奖励加成：<span style="color:#27ae60;font-weight:bold;">+${rewardAmt} 硬币</span> 已注入背包。<br>(今日已领奖收益数: ${schulte.count + 1} / 5 次)`;
                rBtn.innerText = "再来一局"; await uploadSchulteWin(rewardAmt);
            } else {
                rDesc.innerHTML = `卓越的视界与专注！你用时 <span style="color:#e67e22;font-weight:bold;">${elapsed}秒</span> 顺利通过训练！<br><br>⚠️ 提示：今日 5 次悬赏冒险奖励已被装满。本次通关不再产出硬币，继续保持专注度，锤炼你的视界引擎！`;
                rBtn.innerText = "纯粹训练模式";
            }
        }

        async function uploadSchulteWin(rewardAmt) {
            try {
                const { data } = await dbClient.from('gamedata').select('*').eq('id', ROW_ID); let record = data[0]; let today = getTodayStr();
                let schulte = record.schulteDaily || { lastDate: "", count: 0 }; if (schulte.lastDate !== today) { schulte.lastDate = today; schulte.count = 0; }
                schulte.count += 1; let newCoins = record.coins + rewardAmt;
                const maxCap = RANK_DATA[(record.currentRank || 1) - 1].cap; if(newCoins > maxCap) newCoins = maxCap;
                let logs = record.childLogs || []; logs.unshift({ time: getFormattedTime(), action: `专注挑战成功 (${currentGameSize}x${currentGameSize})`, amount: rewardAmt });

                await dbClient.from('gamedata').update({ coins: newCoins, childLogs: logs.slice(0, 10), schulteDaily: schulte }).eq('id', ROW_ID);
                currentData = { ...record, coins: newCoins, childLogs: logs.slice(0, 10), schulteDaily: schulte };
                localStorage.setItem('andy_last_seen_coins', newCoins); updateValue(newCoins);
            } catch (e) { console.error(e); }
        }

        async function upgradeRank() {
            if (!currentData || isAnimating) return;
            const rank = currentData.currentRank || 1; const rData = RANK_DATA[rank - 1];
            if (currentData.coins < rData.cost) return; 
            
            const nextRank = rank + 1; const nextRData = RANK_DATA[nextRank - 1]; const newCoins = currentData.coins - rData.cost;
            let logs = currentData.childLogs || []; logs.unshift({ time: getFormattedTime(), action: `突破境界: ${nextRData.title}`, amount: -rData.cost });
            
            try {
                isAnimating = true; playSound('fuse'); document.body.classList.add('shake'); if(uiLayer) uiLayer.style.transform = 'scale(0.95)';
                const dbUpdatePromise = dbClient.from('gamedata').update({ coins: newCoins, currentRank: nextRank, childLogs: logs.slice(0, 10) }).eq('id', ROW_ID);

                setTimeout(async () => {
                    document.body.classList.remove('shake'); playSound('explode'); setTimeout(() => playSound('levelup'), 400); 
                    let flash = document.createElement('div'); flash.className = 'flash-overlay'; document.body.appendChild(flash); setTimeout(() => flash.remove(), 1200);
                    createParticles(80, ['✨', '💎', '💠', '🔥', '⚡', '❇️']); if(uiLayer) { uiLayer.style.opacity = '0'; uiLayer.style.transform = 'scale(1)'; }

                    await dbUpdatePromise; 
                    setTimeout(() => {
                        localStorage.setItem('andy_last_seen_coins', newCoins); currentData.coins = newCoins; currentData.currentRank = nextRank; updateValue(newCoins);
                        let banner = document.createElement('div'); banner.className = 'level-up-banner'; banner.innerHTML = `<div style="font-size:40px; color:#fff;">境界突破</div><div style="font-size:75px; color:${nextRData.color};">${nextRData.title}</div>`; document.body.appendChild(banner); setTimeout(() => banner.remove(), 3500);
                        if(uiLayer) uiLayer.style.opacity = '1'; isAnimating = false;
                    }, 500); 
                }, 1000); 
            } catch (e) { alert("突破受阻！"); isAnimating = false; if(uiLayer) { uiLayer.style.opacity = '1'; uiLayer.style.transform = 'scale(1)'; } document.body.classList.remove('shake'); }
        }

        function openLogModal() { if(lModal) lModal.style.display = 'flex'; }
        function closeLogModal() { if(lModal) lModal.style.display = 'none'; }

        function renderLogs(logs) {
            const container = document.getElementById('logListContent'); if(!container) return;
            if(logs && logs.length > 0) {
                container.innerHTML = logs.map(log => {
                    const amountClass = log.amount > 0 ? "log-v" : "log-v sub"; const amountText = log.amount > 0 ? '+' + log.amount : log.amount;
                    return `<div class="log-row"><span class="log-t">[${log.time}]</span><span class="log-a">${log.action}</span><span class="${amountClass}">${amountText}</span></div>`;
                }).join('');
            } else container.innerHTML = '<div style="text-align:center; color:#888; padding: 20px 0;">行囊里还没有记录哦~</div>';
        }

        function processCooldowns() {
            if(!currentData || !currentData.cooldowns || !currentData.taskItems) return;
            const now = Date.now();
            currentData.taskItems.forEach(task => {
                const btn = document.getElementById(`btn-${task.id}`);
                if (!btn) return;
                const remain = (currentData.cooldowns[task.id] || 0) - now;
                if(remain > 0) {
                    btn.classList.add('in-cd'); 
                    const totalMs = (task.hours || 3) * 3600000; 
                    btn.style.setProperty('--progress', (remain / totalMs) * 360 + 'deg');
                    const h = Math.floor(remain / 3600000), m = Math.floor((remain % 3600000) / 60000), s = Math.floor((remain % 60000) / 1000);
                    let timerEl = btn.querySelector('.cd-timer'); if(timerEl) timerEl.innerText = `${h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
                } else btn.classList.remove('in-cd');
            });
        }

        function playAttackSequence(amount, finalCoins) {
            isAnimating = true; clearAmbientActors(); if(uiLayer) uiLayer.style.opacity = '0'; 
            if(heroSteve) { heroSteve.style.display = 'block'; heroSteve.style.left = "35%"; }
            if(heroCreeper) { heroCreeper.style.display = 'block'; heroCreeper.style.right = "35%"; }
            let sword = document.querySelector('.skin-steve .sword'); if(sword) sword.style.display = 'block'; 
            setTimeout(() => { if(sword) sword.classList.add('anim-attack'); playSound('hit'); setTimeout(() => { if(heroCreeper) heroCreeper.classList.add('anim-hurt'); }, 150); }, 500);
            setTimeout(() => { if(heroCreeper) heroCreeper.style.display = 'none'; createParticles(60, '💰'); playSound('levelup'); if(statusMsg) { statusMsg.innerText = `战利品入账！+${amount}`; statusMsg.style.color="#004400"; } }, 1200);
            setTimeout(() => { updateValue(finalCoins); resetStage(); }, 3000);
        }

        function playExplodeSequence(amount, finalCoins, customMsg) {
            isAnimating = true; clearAmbientActors(); if(uiLayer) uiLayer.style.opacity = '0';
            if(heroCreeper) { heroCreeper.style.display = 'block'; heroCreeper.style.right = "45%"; }
            setTimeout(() => { playSound('fuse'); if(heroCreeper) heroCreeper.classList.add('anim-swell'); }, 500);
            setTimeout(() => { if(heroCreeper) heroCreeper.style.opacity = '0'; document.body.classList.add('shake'); createParticles(40, '🟥'); playSound('explode'); if(statusMsg) { statusMsg.innerText = customMsg; statusMsg.style.color = "#8b0000"; } }, 2500);
            setTimeout(() => { document.body.classList.remove('shake'); updateValue(finalCoins); resetStage(); }, 4000);
        }

        function resetStage() { 
            if(uiLayer) uiLayer.style.opacity = '1'; if(heroSteve) heroSteve.style.display = 'none'; 
            if(heroCreeper) { heroCreeper.style.display = 'none'; heroCreeper.style.opacity = '1'; heroCreeper.className='actor skin-creeper'; }
            isAnimating = false; 
        }
        function updateValue(coins) { if(totalDisplay) totalDisplay.innerText = coins; updateRankUI(coins, currentData ? (currentData.currentRank || 1) : 1); }
        
        function playAmbientScenario() { 
            if (isAnimating || isGameRunning) return; 
            let scenario; do { scenario = Math.floor(Math.random() * 2); } while (scenario === lastScenario); 
            lastScenario = scenario; 
            if (scenario === 0) { spawnActor('skin-villager', 'left', 12); } else { spawnActor('skin-creeper', 'right', 12); } 
        }
        function spawnActor(skinClass, direction, duration) { 
            if (isAnimating || isGameRunning || !stage) return; 
            const el = document.createElement('div'); el.className = `actor ambient-actor ${skinClass}`; el.style.bottom = (22 + Math.floor(Math.random() * 8)) + 'px'; 
            let inner = '';
            if(skinClass.includes('creeper')) inner = '<div class="head"><div class="face"></div></div><div class="body"></div><div class="legs"><div class="leg" style="left:0"></div><div class="leg" style="right:0"></div></div>';
            else if(skinClass.includes('villager')) inner = '<div class="head"><div class="nose"></div></div><div class="body"></div><div class="arms"></div>';
            el.innerHTML = inner;
            if (direction === 'left') { el.style.left = '-100px'; el.style.animation = `runLeftToRight ${duration}s linear forwards`; } else { el.style.right = '-100px'; el.style.transform = 'scaleX(-1)'; el.style.animation = `runRightToLeft ${duration}s linear forwards`; } 
            stage.appendChild(el); setTimeout(() => el.remove(), duration * 1000); 
        }
        function clearAmbientActors() { document.querySelectorAll('.ambient-actor').forEach(el => el.remove()); }

        function startFloatingChest() { if(!chestFloatInterval) { moveChest(); chestFloatInterval = setInterval(moveChest, 3500); } }
        function stopFloatingChest() { clearInterval(chestFloatInterval); chestFloatInterval = null; }
        function moveChest() { if(!chest) return; const randomX = Math.floor(Math.random() * 70) + 10, randomY = Math.floor(Math.random() * 20) + 5; chest.style.left = randomX + '%'; chest.style.top = randomY + '%'; }
        
        function createParticles(c, chars) { 
            const isArray = Array.isArray(chars);
            for (let i = 0; i < c; i++) { 
                const el = document.createElement('div'); el.classList.add('confetti'); el.innerText = isArray ? chars[Math.floor(Math.random() * chars.length)] : chars; 
                const angle = Math.random() * 360, dist = 50 + Math.random() * 100; el.style.setProperty('--tx', (Math.cos(angle * Math.PI / 180) * dist) + 'vw'); el.style.setProperty('--ty', (Math.sin(angle * Math.PI / 180) * dist) + 'vh'); 
                document.body.appendChild(el); setTimeout(() => el.remove(), 1000); 
            } 
        }
        function clickCoin() { if(!isMuted) { sfxClick.currentTime = 0; sfxClick.play().catch(e=>{}); } }
        function toggleMute() { isMuted = !isMuted; bgm[isMuted ? 'pause' : 'play'](); document.querySelector('.mute-btn').innerText = isMuted ? '🔇' : '🔊'; }
        function playSound(type) { if(isMuted) return; try { if(type === 'levelup') sfxLevelUp.play(); if(type === 'explode') sfxExplode.play(); if(type === 'hit') sfxHit.play(); if(type === 'fuse') sfxFuse.play(); } catch(e){} }
        
        function openChallengeModal() { if(!activeEventData || !cModal) return; cModal.style.display = 'flex'; document.getElementById('c_question').innerText = activeEventData.question; document.getElementById('c_reward').innerText = activeEventData.reward; document.getElementById('c_input').value = ""; clearInterval(timerInterval); updateTimer(); timerInterval = setInterval(updateTimer, 1000); }
        function closeChallengeModal() { if(cModal) cModal.style.display = 'none'; clearInterval(timerInterval); }
        function updateTimer() { let diff = activeEventData.expireTime - Date.now(); if(diff <= 0) { closeChallengeModal(); if(chest) chest.style.display = 'none'; return; } let h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000); let cTimer = document.getElementById('c_timer'); if(cTimer) cTimer.innerText = `消散倒计时: ${h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`; }
        
        async function submitAnswer() { 
            let inputEl = document.getElementById('c_input'); if(!inputEl) return;
            if(inputEl.value.trim() === activeEventData.answer.trim()) { 
                const maxCap = RANK_DATA[(currentData.currentRank || 1) - 1].cap;
                if (currentData.coins + activeEventData.reward > maxCap) { playSound('fuse'); alert("🎒 背包容量上限不足！"); closeChallengeModal(); return; }
                closeChallengeModal(); if(chest) chest.style.display = 'none'; 
                try { 
                    const { data } = await dbClient.from('gamedata').select('*').eq('id', ROW_ID); let record = data[0], newCoins = record.coins + activeEventData.reward; 
                    let logs = record.childLogs || []; logs.unshift({ time: getFormattedTime(), action: "破解悬赏令宝箱", amount: activeEventData.reward });
                    await dbClient.from('gamedata').update({ coins: newCoins, activeEvent: null, childLogs: logs.slice(0, 10) }).eq('id', ROW_ID); 
                    localStorage.setItem('andy_last_seen_coins', newCoins); playAttackSequence(activeEventData.reward, newCoins); 
                } catch(e){} 
            } else { playSound('fuse'); alert("❌ 密码破解失败！"); } 
        }
    </script>
</body>
