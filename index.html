<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Andy的冒险背包</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #76b5fe; font-family: 'VT323', monospace; 
            text-align: center; margin: 0; padding: 0; overflow: hidden; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; 
            transition: background-color 2s ease; 
        }
        
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(white 1px, transparent 1px); background-size: 50px 50px; opacity: 0; transition: opacity 2s; z-index: 0; pointer-events: none; }
        body.night .stars { opacity: 0.5; } 
        body.night { background-color: #1a0b2e; }
        .ground { position: absolute; bottom: 0; width: 100%; height: 60px; background: #5D4037; border-top: 10px solid #4CAF50; z-index: 20; }

        .ui-container { margin-top: 8vh; width: 90%; max-width: 400px; z-index: 100; position: relative; transition: opacity 0.3s;}
        .card { background-color: #c6c6c6; border: 4px solid #000; box-shadow: inset 4px 4px #fff, inset -4px -4px #555; padding: 20px; position: relative; }
        h2 { color: #404040; margin: 0 0 5px 0; font-size: 32px; text-shadow: 2px 2px #fff; letter-spacing: 2px; }
        .rank-badge { background: #333; color: #f1c40f; padding: 2px 10px; border: 2px solid #fff; display: inline-block; margin-bottom: 10px; font-size: 18px; border-radius: 4px; }
        .slot { background: #8b8b8b; width: 100px; height: 100px; margin: 0 auto; border: 4px solid #373737; border-right-color: #fff; border-bottom-color: #fff; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .slot:active .coin-icon { transform: scale(0.8); }
        .coin-icon { font-size: 60px; filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.5)); z-index: 2; transition: transform 0.1s;}
        .label { color: #404040; font-size: 20px; margin-top: 10px; font-weight: bold; text-shadow: 1px 1px #fff;}
        .total { font-size: 70px; color: #fff; font-weight: bold; text-shadow: 4px 4px 0px #333; margin: 5px 0; line-height: 1; }

        /* 🩸 极限突破血条 */
        .health-bar-container { width: 100%; margin-top: 10px; padding: 0 10px; box-sizing: border-box; }
        .health-bar-label { font-size: 16px; color: #404040; font-weight: bold; margin-bottom: 5px; text-shadow: 1px 1px #fff; text-align: left;}
        .health-bar-bg { width: 100%; height: 24px; background-color: #333; border: 3px solid #000; position: relative; box-shadow: inset 2px 2px #111, inset -2px -2px #555; }
        .health-bar-fill { height: 100%; background-color: #e70000; width: 0%; transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: inset 0px 4px 0px rgba(255,255,255,0.3), inset 0px -4px 0px rgba(0,0,0,0.2); }

        .status-bar { background: #000; color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 14px; display: inline-flex; align-items: center; margin-top: 10px; border: 2px solid #555; }
        .light { width: 8px; height: 8px; background: #e74c3c; margin-right: 8px; }
        .light.online { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .message { color: #004400; margin-top: 10px; font-size: 16px; height: 24px; text-shadow: 1px 1px #fff; font-weight: bold; line-height: 1.2;}
        .mute-btn { position: absolute; top: 10px; right: 10px; font-size: 24px; cursor: pointer; color: #555; }

        /* ⚔️ 主入口按钮 */
        .btn-main-action { 
            width: 100%; margin-top: 15px; padding: 12px; font-family: 'VT323', monospace; 
            font-size: 24px; font-weight: bold; color: white; background: #27ae60; 
            border: 4px solid #000; cursor: pointer; box-shadow: inset 4px 4px rgba(255,255,255,0.3), inset -4px -4px rgba(0,0,0,0.3); 
        }
        .btn-main-action:active { transform: scale(0.98); }

        /* 💎 赚取资源区弹窗 */
        #rewardModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 400; display: none; justify-content: center; align-items: center; }
        .reward-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; width: 100%; }
        .mc-item-btn { position: relative; background: #8b8b8b; border: 3px solid #000; border-right-color: #fff; border-bottom-color: #fff; padding: 10px; cursor: pointer; overflow: hidden; height: 90px; display: flex; flex-direction: column; justify-content: center; }
        .mc-item-btn:active:not(.in-cd) { transform: scale(0.95); }
        .mc-item-title { font-size: 18px; color: #000; margin-bottom: 5px; font-weight: bold; text-shadow: 1px 1px #fff;}
        .mc-item-reward { color: #004400; font-weight: bold; font-size: 22px; text-shadow: 1px 1px #fff;}
        
        .cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: none; pointer-events: none; background: conic-gradient(rgba(0,0,0,0.7) var(--progress), transparent 0deg); }
        .cd-timer { position: absolute; bottom: 4px; right: 6px; color: #fff; font-size: 16px; font-weight: bold; text-shadow: 1px 1px #000; display: none; }
        .in-cd { cursor: not-allowed; opacity: 0.8; }
        .in-cd .cd-overlay, .in-cd .cd-timer { display: block; }
        .btn-close-modal { background: #c0392b; color: white; padding: 10px 20px; border: 2px solid #000; font-family: inherit; font-size: 20px; cursor: pointer; box-shadow: inset 2px 2px #fff, inset -2px -2px #555; margin-top: 20px; width: 100%;}

        /* 🎁 飞行宝箱与挑战弹窗 */
        #treasure-chest { position: fixed; top: 10%; left: 50%; font-size: 60px; z-index: 200; cursor: pointer; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3)); display: none; transition: top 4s ease-in-out, left 4s ease-in-out; }
        .chest-float-anim { animation: bobbing 1s infinite alternate; }
        @keyframes bobbing { from { transform: translateY(0); } to { transform: translateY(-5px); } }

        #challengeModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 300; display: none; justify-content: center; align-items: center; }
        .challenge-card { background: #c6c6c6; border: 4px solid #000; box-shadow: inset 4px 4px #fff, inset -4px -4px #555; padding: 20px; width: 85%; max-width: 350px; text-align: center; }
        .challenge-title { font-size: 28px; color: #333; margin-bottom: 10px; text-shadow: 1px 1px #fff; }
        .challenge-q { font-size: 14px; color: #000; margin: 15px 0; font-weight: bold; background: #fff; padding: 8px; border: 2px solid #555; white-space: pre-wrap; text-align: left; max-height: 250px; overflow-y: auto; line-height: 1.4; }
        .challenge-reward { color: #00aa00; font-size: 20px; margin-bottom: 10px; }
        .challenge-timer { color: #c0392b; font-size: 20px; margin-bottom: 20px; font-weight: bold; letter-spacing: 1px; font-family: monospace;}
        .challenge-input { font-family: 'VT323', monospace; font-size: 24px; padding: 5px; width: 80%; text-align: center; border: 2px solid #000; margin-bottom: 15px;}
        .btn-submit { background: #27ae60; color: white; padding: 10px 20px; border: 2px solid #000; font-family: inherit; font-size: 20px; cursor: pointer; box-shadow: inset 2px 2px #fff, inset -2px -2px #555; }
        .btn-cancel-modal { background: #c0392b; margin-left: 10px; }

        /* ------------------- 角色系统 ------------------- */
        .stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 15;}
        .actor { position: absolute; bottom: 55px; transition: transform 0.1s; z-index: 30; }
        
        .skin-steve { width: 60px; height: 135px; }
        .skin-steve .head { width: 60px; height: 60px; background: #F8B090; position: absolute; top: 0; z-index: 2; }
        .skin-steve .hair { width: 60px; height: 15px; background: #452613; position: absolute; top: 0; z-index: 3; }
        .skin-steve .body { width: 60px; height: 45px; background: #00AAAA; position: absolute; top: 60px; z-index: 1; }
        .skin-steve .pants { width: 60px; height: 30px; background: #303090; position: absolute; top: 105px; }
        .skin-steve .sword { position: absolute; top: 35px; right: -40px; font-size: 60px; transform: scaleX(-1) rotate(45deg); transform-origin: 20% 80%; z-index: 4; display: none; filter: drop-shadow(2px 2px 0 #000); }

        .skin-creeper { width: 45px; height: 120px; }
        .skin-creeper .head { width: 45px; height: 45px; background: #00AA00; position: absolute; top: 0; border: 3px solid #005500; }
        .skin-creeper .face { position: absolute; top: 10px; left: 8px; width: 29px; height: 25px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8"><path d="M1 1h2v2h2v-2h2v3h-2v1h1v2h-2v-1h-2v1h-2v-2h1v-1h-2z"/></svg>'); opacity: 0.8; }
        .skin-creeper .body { width: 45px; height: 45px; background: #00AA00; position: absolute; top: 45px; }
        .skin-creeper .legs { width: 45px; height: 30px; position: absolute; top: 90px; }
        .skin-creeper .leg { width: 15px; height: 30px; background: #00AA00; position: absolute; bottom:0; }

        .skin-villager { width: 50px; height: 140px; }
        .skin-villager .head { width: 50px; height: 60px; background: #d09b7c; position: absolute; top: 0; }
        .skin-villager .nose { width: 10px; height: 18px; background: #d09b7c; position: absolute; top: 30px; left: 20px; border: 1px solid #a3755b; z-index: 5;}
        .skin-villager .body { width: 50px; height: 80px; background: #684831; position: absolute; top: 60px; }
        .skin-villager .arms { width: 50px; height: 15px; background: #684831; position: absolute; top: 75px; left: 0; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }
        .skin-villager .sword { position: absolute; top: 70px; right: -30px; font-size: 40px; transform: scaleX(-1) rotate(45deg); z-index: 10; display: block;}

        .skin-skeleton { width: 40px; height: 135px; }
        .skin-skeleton .head { width: 40px; height: 40px; background: #e0e0e0; position: absolute; top: 0; }
        .skin-skeleton .face { position: absolute; top: 10px; left: 6px; width: 28px; height: 24px; opacity: 0.6; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8"><path d="M1 1h2v2h2v-2h2v3h-2v1h1v2h-2v-1h-2v1h-2v-2h1v-1h-2z"/></svg>'); }
        .skin-skeleton .body { width: 40px; height: 45px; background: #e0e0e0; position: absolute; top: 40px; opacity: 0.8; }
        .skin-skeleton .legs { width: 40px; height: 50px; position: absolute; top: 85px; }
        .skin-skeleton .leg { width: 10px; height: 50px; background: #e0e0e0; position: absolute; bottom:0; }

        .skin-zombie { width: 50px; height: 135px; }
        .skin-zombie .head { width: 50px; height: 50px; background: #00A080; position: absolute; top: 0; }
        .skin-zombie .body { width: 50px; height: 45px; background: #008080; position: absolute; top: 50px; }
        .skin-zombie .arms { width: 50px; height: 12px; background: #00A080; position: absolute; top: 55px; left: -10px; box-shadow: 10px 0 #00A080; }
        .skin-zombie .legs { width: 50px; height: 40px; position: absolute; top: 95px; }
        .skin-zombie .leg { width: 20px; height: 40px; background: #303090; position: absolute; bottom:0; }

        .skin-pig { width: 50px; height: 30px; }
        .skin-pig .head { width: 20px; height: 20px; background: #F0A5A5; position: absolute; left: 0; top: 0; }
        .skin-pig .nose { width: 8px; height: 6px; background: #D16D6D; position: absolute; left: -4px; top: 8px; }
        .skin-pig .body { width: 35px; height: 20px; background: #F0A5A5; position: absolute; left: 15px; top: 5px; }
        .skin-pig .leg { width: 8px; height: 10px; background: #D16D6D; position: absolute; top: 20px; }

        .breathe { animation: breathe 2s ease-in-out infinite; }
        @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02); } }
        .anim-attack { animation: swordSwing 0.35s ease-out forwards; }
        @keyframes swordSwing { 0% { transform: scaleX(-1) rotate(45deg); } 50% { transform: scaleX(-1) rotate(-60deg); } 100% { transform: scaleX(-1) rotate(45deg); } }
        .anim-hurt { animation: hurtFlash 0.3s steps(2) infinite; }
        @keyframes hurtFlash { 0% { filter: sepia(1) hue-rotate(-50deg) saturate(5); } 100% { filter: none; } }
        .anim-swell { animation: swell 2.5s ease-in forwards; }
        @keyframes swell { 0% { transform: scale(1); filter: brightness(1); } 95% { transform: scale(2.5); filter: brightness(100); opacity: 1;} 100% { transform: scale(3); opacity: 0; } }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 20% { transform: translate(-3px, 0px); } 40% { transform: translate(1px, -1px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -2px); } }

        .run-l-to-r { animation: runLeftToRight 8s linear forwards; }
        @keyframes runLeftToRight { 0% { left: -150px; } 100% { left: 120vw; } }
        .run-r-to-l { animation: runRightToLeft 8s linear forwards; }
        @keyframes runRightToLeft { 0% { right: -150px; } 100% { right: 120vw; } }

        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .mc-btn { background: #727272; border: 4px solid #fff; padding: 15px 30px; font-size: 24px; color: white; font-family: 'VT323', monospace; cursor: pointer; box-shadow: inset 4px 4px #aaa, inset -4px -4px #444; text-transform: uppercase; margin-top: 20px; }
        .confetti { position: fixed; top: 50%; left: 50%; z-index: 999; animation: explode-particle 1s ease-out forwards; pointer-events: none; font-size: 30px;}
        @keyframes explode-particle { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div id="start-overlay">
        <h1 style="text-shadow: 4px 4px #000; font-size: 40px; margin-bottom:10px;">Andy的世界</h1>
        <p style="opacity: 0.8; font-size: 16px;">点击按钮激活声音</p>
        <button class="mc-btn" onclick="startGame()">开始冒险</button>
    </div>

    <audio id="bgm" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-levelup"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/levelup.ogg" type="audio/ogg"></audio>
    <audio id="sfx-explode"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/explode.ogg" type="audio/ogg"></audio>
    <audio id="sfx-hit"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/damage/hit1.ogg" type="audio/ogg"></audio>
    <audio id="sfx-fuse"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/fuse.ogg" type="audio/ogg"></audio>
    <audio id="sfx-click"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/click.ogg" type="audio/ogg"></audio>

    <div id="treasure-chest" class="chest-float-anim" onclick="openChallengeModal()">🎁</div>

    <div id="challengeModal">
        <div class="challenge-card">
            <div class="challenge-title">📜 冒险家挑战</div>
            <div class="challenge-reward">奖励: <span id="c_reward">50</span> 币</div>
            <div class="challenge-timer" id="c_timer">剩余时间: ...</div>
            <div class="challenge-q" id="c_question">题目加载中...</div>
            <input type="text" id="c_input" class="challenge-input" placeholder="输入答案">
            <br>
            <button class="btn-submit" onclick="submitAnswer()">确定</button>
            <button class="btn-submit btn-cancel-modal" onclick="closeChallengeModal()">关闭</button>
        </div>
    </div>

    <div id="rewardModal">
        <div class="challenge-card">
            <div class="challenge-title">⚔️ 任务大厅</div>
            <p style="margin:0; font-size:16px; color:#555; font-weight:bold;">完成以下任务赚取金币</p>
            <div class="reward-grid">
                <div class="mc-item-btn" id="btn-sport" onclick="claimReward('sport', '疾跑附魔 (运动)', 10)">
                    <div class="cd-overlay"></div>
                    <span class="mc-item-title">疾跑附魔</span>
                    <span class="mc-item-reward">+10 🪙</span>
                    <span class="cd-timer">--:--</span>
                </div>
                <div class="mc-item-btn" id="btn-focus" onclick="claimReward('focus', '凝神药水 (专注)', 10)">
                    <div class="cd-overlay"></div>
                    <span class="mc-item-title">凝神药水</span>
                    <span class="mc-item-reward">+10 🪙</span>
                    <span class="cd-timer">--:--</span>
                </div>
                <div class="mc-item-btn" id="btn-writing" onclick="claimReward('writing', '成书与笔 (书写)', 10)">
                    <div class="cd-overlay"></div>
                    <span class="mc-item-title">成书与笔</span>
                    <span class="mc-item-reward">+10 🪙</span>
                    <span class="cd-timer">--:--</span>
                </div>
                <div class="mc-item-btn" id="btn-extra" onclick="claimReward('extra', '探索下界 (课外)', 10)">
                    <div class="cd-overlay"></div>
                    <span class="mc-item-title">探索下界</span>
                    <span class="mc-item-reward">+10 🪙</span>
                    <span class="cd-timer">--:--</span>
                </div>
            </div>
            <button class="btn-close-modal" onclick="closeRewardModal()">返回主界面</button>
        </div>
    </div>

    <div class="ui-container" id="uiLayer">
        <div class="card">
            <div class="mute-btn" onclick="toggleMute()">🔊</div>
            <h2>Andy的背包</h2>
            <div id="rankBadge" class="rank-badge">加载中...</div>
            <div class="slot" onclick="clickCoin()"><div class="coin-icon" id="icon">🪙</div></div>
            
            <div class="label">当前拥有币</div>
            <div id="totalDisplay" class="total">...</div>

            <div class="health-bar-container">
                <div class="health-bar-label">金库容量: <span id="maxCoinsText">0</span></div>
                <div class="health-bar-bg">
                    <div id="healthBarFill" class="health-bar-fill"></div>
                </div>
            </div>

            <button class="btn-main-action" onclick="openRewardModal()">⚔️ 任务大厅</button>

            <div class="status-bar"><div id="light" class="light online"></div><span id="connStatus">等待同步...</span></div>
            <div id="statusMsg" class="message"></div>
        </div>
    </div>

    <div class="stage" id="stage">
        <div id="hero-steve" class="actor skin-steve breathe" style="left: -200px; display: none; z-index: 100;">
            <div class="head"></div><div class="hair"></div><div class="body"></div><div class="pants"></div><div class="sword">🗡️</div>
        </div>
        <div id="hero-creeper" class="actor skin-creeper" style="right: -200px; display: none; z-index: 99;">
            <div class="head"><div class="face"></div></div><div class="body"></div><div class="legs"><div class="leg" style="left:0"></div><div class="leg" style="right:0"></div></div>
        </div>
    </div>

    <div class="ground"></div>

    <script>
        const BIN_ID = '695f1cbed0ea881f405c1aab'; 
        const API_KEY = '$2a$10$pSEOl/63AtvEMUqQopzGeuhVgcRcfXSz5L8lyQdZZHZM66zdYKI0O'; 
        const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        
        const uiLayer = document.getElementById('uiLayer');
        const totalDisplay = document.getElementById('totalDisplay');
        const statusMsg = document.getElementById('statusMsg');
        const connStatus = document.getElementById('connStatus');
        const rankBadge = document.getElementById('rankBadge');
        const stage = document.getElementById('stage');
        const heroSteve = document.getElementById('hero-steve');
        const heroCreeper = document.getElementById('hero-creeper');
        
        const chest = document.getElementById('treasure-chest');
        const cModal = document.getElementById('challengeModal');
        const rModal = document.getElementById('rewardModal'); // 新增任务大厅
        
        const bgm = document.getElementById('bgm');
        const sfxLevelUp = document.getElementById('sfx-levelup');
        const sfxExplode = document.getElementById('sfx-explode'); 
        const sfxHit = document.getElementById('sfx-hit'); 
        const sfxFuse = document.getElementById('sfx-fuse'); 
        const sfxClick = document.getElementById('sfx-click');
        
        let isMuted = false;
        let lastCoins = null;
        let isAnimating = false; 
        let isFirstRun = true;   
        
        let ambientInterval = null; 
        let syncInterval = null;
        let lastScenario = -1; 
        
        let activeEventData = null; 
        let timerInterval = null;
        let chestFloatInterval = null; 
        
        let currentData = null;
        let currentMaxCoins = 0; 
        const CD_HOURS = 3;

        const RANKS = [
            { limit: 0, title: "🪵 新手伐木工" }, { limit: 21, title: "⛏️ 熟练采石匠" }, { limit: 51, title: "🛡️ 铁甲卫士" },
            { limit: 101, title: "⚡ 红石工程师" }, { limit: 201, title: "🏆 黄金领主" }, { limit: 301, title: "💎 钻石大神" }, 
            { limit: 601, title: "🔥 下界合金战神" }, { limit: 1001, title: "🐲 末影屠龙者" }, { limit: 2001, title: "🌌 虚空行者" },
            { limit: 5001, title: "💻 指令方块主宰" }
        ];

        function getTodayStr() {
            const parts = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
            let y, m, d; parts.forEach(p => { if(p.type==='year') y=p.value; if(p.type==='month') m=p.value; if(p.type==='day') d=p.value; });
            return `${y}-${m}-${d}`;
        }

        function getDaysDiff(d1Str, d2Str) {
            if(!d1Str || !d2Str) return 0;
            const [y1,m1,da1] = d1Str.split('-').map(Number);
            const [y2,m2,da2] = d2Str.split('-').map(Number);
            return Math.floor((Date.UTC(y2, m2-1, da2) - Date.UTC(y1, m1-1, da1)) / 86400000);
        }

        async function checkAndApplyDailyDeduction(record) {
            if (!record.dailyConfig || !record.dailyConfig.enabled) return record;
            let today = getTodayStr();
            let diffDays = getDaysDiff(record.dailyConfig.lastDeductDate, today);
            
            if (diffDays > 0) {
                let totalDeduct = diffDays * record.dailyConfig.amount;
                let deductedAmount = Math.min(record.coins, totalDeduct); 
                
                record.coins = Math.max(0, record.coins - totalDeduct);
                record.historicalMaxCoins = Math.max(record.coins, record.historicalMaxCoins || 0);
                record.dailyConfig.lastDeductDate = today;
                
                try {
                    await fetch(BASE_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY }, body: JSON.stringify(record) });
                    record._justAutoDeducted = deductedAmount;
                } catch (e) { console.error(e); }
            }
            return record;
        }

        function startGame() {
            document.getElementById('start-overlay').style.display='none';
            checkDayNight();
            try { bgm.load(); bgm.volume = 0.4; bgm.play().catch(e => {}); sfxLevelUp.load(); sfxExplode.load(); sfxHit.load(); } catch(e){}
            if(ambientInterval) clearInterval(ambientInterval);
            if(syncInterval) clearInterval(syncInterval);

            syncData();
            syncInterval = setInterval(syncData, 60000); 
            setInterval(processCooldowns, 1000); // 1秒更新一次CD动画
            playAmbientScenario();
            ambientInterval = setInterval(playAmbientScenario, 12000);
        }

        function startFloatingChest() {
            if(chestFloatInterval) return; 
            moveChest(); 
            chestFloatInterval = setInterval(moveChest, 3500); 
        }

        function stopFloatingChest() {
            if(chestFloatInterval) { clearInterval(chestFloatInterval); chestFloatInterval = null; }
        }

        function moveChest() {
            if(chest.style.display === 'none') return;
            const randomX = Math.floor(Math.random() * 70) + 10;
            const randomY = Math.floor(Math.random() * 20) + 5;
            chest.style.left = randomX + '%'; chest.style.top = randomY + '%';
        }

        async function syncData() {
            if(isAnimating) return; 
            connStatus.innerText = "正在同步...";
            
            try {
                let res = await fetch(BASE_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                let data = await res.json();
                
                let record = await checkAndApplyDailyDeduction(data.record);
                currentData = record; // 缓存供任务大厅读取
                let cloudCoins = record.coins || 0;
                let event = record.activeEvent;
                
                currentMaxCoins = Math.max(cloudCoins, record.historicalMaxCoins || 0);

                if (record._justAutoDeducted > 0) {
                    playExplodeSequence(record._justAutoDeducted, cloudCoins, `日常消耗结算！自动扣除 ${record._justAutoDeducted} 币`);
                    lastCoins = cloudCoins;
                    localStorage.setItem('andy_last_seen_coins', cloudCoins);
                    updateValue(cloudCoins);
                    connStatus.innerText = "数据已同步";
                    return; 
                }

                if(event && event.expireTime > Date.now()) {
                    activeEventData = event;
                    if(chest.style.display !== 'block') { chest.style.display = 'block'; startFloatingChest(); }
                } else {
                    activeEventData = null;
                    chest.style.display = 'none';
                    stopFloatingChest(); 
                    if(cModal.style.display === 'flex') closeChallengeModal(); 
                }

                let localStr = localStorage.getItem('andy_last_seen_coins');

                if (localStr === null) {
                    lastCoins = cloudCoins;
                    localStorage.setItem('andy_last_seen_coins', cloudCoins);
                    totalDisplay.innerText = cloudCoins;
                    updateRank(cloudCoins);
                    updateHealthBar(cloudCoins, currentMaxCoins);
                    connStatus.innerText = "数据已同步";
                    isFirstRun = false;
                    return; 
                }

                lastCoins = parseInt(localStr);

                if (cloudCoins > lastCoins) {
                    let diff = cloudCoins - lastCoins;
                    playAttackSequence(diff, cloudCoins);
                } else if (cloudCoins < lastCoins) {
                    let diff = lastCoins - cloudCoins;
                    playExplodeSequence(diff, cloudCoins, `遭遇爆炸！损失 ${diff}`);
                } else {
                    connStatus.innerText = "数据已同步";
                    totalDisplay.innerText = cloudCoins;
                    updateRank(cloudCoins);
                    updateHealthBar(cloudCoins, currentMaxCoins);
                }
                
                if(cloudCoins !== lastCoins) localStorage.setItem('andy_last_seen_coins', cloudCoins);

            } catch (error) { console.error(error); connStatus.innerText = "连接中..."; }
        }

        // --- 悬赏宝箱逻辑 ---
        function openChallengeModal() {
            if(!activeEventData) return;
            cModal.style.display = 'flex';
            document.getElementById('c_question').innerText = activeEventData.question;
            document.getElementById('c_reward').innerText = activeEventData.reward;
            document.getElementById('c_input').value = "";
            
            if(timerInterval) clearInterval(timerInterval);
            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function closeChallengeModal() {
            cModal.style.display = 'none';
            if(timerInterval) clearInterval(timerInterval);
        }

        function updateTimer() {
            if(!activeEventData) return;
            let diff = activeEventData.expireTime - Date.now();
            if(diff <= 0) {
                closeChallengeModal();
                chest.style.display = 'none';
                stopFloatingChest();
                return;
            }
            let d = Math.floor(diff / (1000 * 60 * 60 * 24));
            let h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            let s = Math.floor((diff % (1000 * 60)) / 1000);
            
            let hStr = h < 10 ? "0" + h : h; let mStr = m < 10 ? "0" + m : m; let sStr = s < 10 ? "0" + s : s;
            document.getElementById('c_timer').innerText = `剩余时间: ${d}天 ${hStr}小时 ${mStr}分 ${sStr}秒`;
        }

        async function submitAnswer() {
            if(!activeEventData) return;
            const inputVal = document.getElementById('c_input').value.trim();
            const correctVal = activeEventData.answer.trim();

            if(inputVal === correctVal) {
                closeChallengeModal();
                chest.style.display = 'none'; 
                stopFloatingChest();
                
                try {
                    let recordRes = await fetch(BASE_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                    let record = (await recordRes.json()).record;
                    
                    let newCoins = record.coins + activeEventData.reward;
                    currentMaxCoins = Math.max(newCoins, record.historicalMaxCoins || 0); 
                    
                    let payload = { 
                        ...record,
                        coins: newCoins, 
                        activeEvent: null, 
                        historicalMaxCoins: currentMaxCoins
                    };
                    
                    await fetch(BASE_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY }, body: JSON.stringify(payload) });
                    
                    // 触发本地动画
                    lastCoins = newCoins;
                    localStorage.setItem('andy_last_seen_coins', newCoins);
                    playAttackSequence(activeEventData.reward, newCoins);
                } catch(e) { console.error("领奖失败", e); }
            } else {
                playSound('fuse'); 
                alert("❌ 答案不对哦，请再想一想！");
            }
        }

        // --- 任务大厅逻辑 (新增) ---
        function openRewardModal() { rModal.style.display = 'flex'; processCooldowns(); }
        function closeRewardModal() { rModal.style.display = 'none'; }

        async function claimReward(type, actionName, amount) {
            const now = Date.now();
            if(currentData && currentData.cooldowns && currentData.cooldowns[type] > now) return; 

            document.getElementById('connStatus').innerText = "正在向云端申报...";
            
            try {
                let res = await fetch(BASE_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                let record = (await res.json()).record;
                
                if(record.cooldowns && record.cooldowns[type] > now) {
                    alert("⚠️ 规则校验失败：该项目正在恢复中！");
                    return;
                }

                const newCoins = record.coins + amount;
                const newTime = new Date().toLocaleTimeString('zh-CN', {hour12:false, hour:'2-digit', minute:'2-digit'});
                
                let logs = record.childLogs || [];
                logs.unshift({ time: newTime, action: actionName, amount: amount });
                logs = logs.slice(0, 5);

                let cds = record.cooldowns || {};
                cds[type] = now + (CD_HOURS * 60 * 60 * 1000);

                currentMaxCoins = Math.max(newCoins, record.historicalMaxCoins || 0);

                const payload = {
                    ...record,
                    coins: newCoins,
                    historicalMaxCoins: currentMaxCoins,
                    childLogs: logs,
                    cooldowns: cds
                };

                await fetch(BASE_URL, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(payload)
                });

                currentData = payload;
                lastCoins = newCoins;
                localStorage.setItem('andy_last_seen_coins', newCoins);

                // 成功后关闭弹窗，触发主界面动画
                closeRewardModal();
                playAttackSequence(amount, newCoins);

            } catch (e) { alert("申报失败，请检查网络"); }
        }

        function processCooldowns() {
            if(!currentData || !currentData.cooldowns) return;
            const now = Date.now();
            const types = ['sport', 'focus', 'writing', 'extra'];

            types.forEach(type => {
                const btn = document.getElementById(`btn-${type}`);
                const expire = currentData.cooldowns[type] || 0;
                const remain = expire - now;

                if(remain > 0) {
                    btn.classList.add('in-cd');
                    const totalMs = CD_HOURS * 3600000;
                    const deg = (remain / totalMs) * 360;
                    btn.style.setProperty('--progress', deg + 'deg');
                    
                    const h = Math.floor(remain / 3600000);
                    const m = Math.floor((remain % 3600000) / 60000);
                    const s = Math.floor((remain % 60000) / 1000);
                    btn.querySelector('.cd-timer').innerText = `${h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
                } else {
                    btn.classList.remove('in-cd');
                }
            });
        }

        // --- 剧情与特效 ---
        function clearAmbientActors() {
            const ambients = document.querySelectorAll('.ambient-actor');
            ambients.forEach(el => el.remove());
        }

        function playAmbientScenario() {
            if (isAnimating) return; 
            let scenario;
            do { scenario = Math.floor(Math.random() * 3); } while (scenario === lastScenario);
            lastScenario = scenario; 
            
            if (scenario === 0) { spawnActor('skin-villager', 'left', 0, 8); setTimeout(() => { spawnActor('skin-creeper', 'left', 0, 9); }, 1000); }
            else if (scenario === 1) { spawnActor('skin-skeleton', 'right', 0, 8); setTimeout(() => { spawnActor('skin-villager', 'right', 1, 8); }, 800); }
            else {
                const isNight = document.body.classList.contains('night');
                if (isNight) { spawnActor('skin-pig', 'left', 0, 10); setTimeout(() => { spawnActor('skin-zombie', 'left', 0, 11); }, 1500); } 
                else { spawnActor('skin-pig', 'left', 0, 15); }
            }
        }

        function spawnActor(skinClass, direction, hasSword, duration) {
            if (isAnimating) return;
            const el = document.createElement('div');
            el.className = `actor ambient-actor ${skinClass}`;
            el.style.zIndex = 10; 
            const randomOffset = Math.floor(Math.random() * 20);
            el.style.bottom = (55 + randomOffset) + 'px';
            
            let inner = '';
            if(skinClass.includes('creeper')) inner = '<div class="head"><div class="face"></div></div><div class="body"></div><div class="legs"><div class="leg" style="left:0"></div><div class="leg" style="right:0"></div></div>';
            else if(skinClass.includes('villager')) inner = `<div class="head"><div class="nose"></div></div><div class="body"></div><div class="arms"></div>${hasSword?'<div class="sword">🗡️</div>':''}`;
            else if(skinClass.includes('skeleton')) inner = '<div class="head"><div class="face"></div></div><div class="body"></div><div class="legs"><div class="leg" style="left:0"></div><div class="leg" style="right:0"></div></div>';
            else if(skinClass.includes('zombie')) inner = '<div class="head"></div><div class="body"></div><div class="arms"></div><div class="legs"><div class="leg" style="left:0"></div><div class="leg" style="right:0"></div></div>';
            else if(skinClass.includes('pig')) inner = '<div class="head"><div class="nose"></div></div><div class="body"></div><div class="leg" style="left:0"></div><div class="leg" style="left:25px"></div>';
            el.innerHTML = inner;

            if (direction === 'left') { el.style.left = '-100px'; el.style.transform = 'scaleX(1)'; el.style.animation = `runLeftToRight ${duration}s linear forwards`; } 
            else { el.style.right = '-100px'; el.style.transform = 'scaleX(-1)'; el.style.animation = `runRightToLeft ${duration}s linear forwards`; }
            stage.appendChild(el);
            setTimeout(() => { el.remove(); }, duration * 1000);
        }

        function playAttackSequence(amount, finalCoins) {
            isAnimating = true;
            clearAmbientActors(); 
            uiLayer.style.opacity = '0'; 
            
            heroSteve.style.display = 'block'; heroCreeper.style.display = 'block';
            heroSteve.style.left = "35%"; heroSteve.style.bottom = "55px"; heroSteve.style.transform = "scaleX(1)";
            heroCreeper.style.right = "35%"; heroCreeper.style.bottom = "55px"; heroCreeper.style.transform = "scaleX(1)";
            document.querySelector('.skin-steve .sword').style.display = 'block'; 

            setTimeout(() => { document.querySelector('.skin-steve .sword').classList.add('anim-attack'); playSound('hit'); setTimeout(() => { heroCreeper.classList.add('anim-hurt'); }, 150); }, 500);
            setTimeout(() => { heroCreeper.style.display = 'none'; createParticles(100, '💰'); playSound('levelup'); statusMsg.innerText = `奖励入账！+${amount}`; statusMsg.style.color = "#00aa00"; }, 1200);
            setTimeout(() => { updateValue(finalCoins); resetStage(); }, 3000);
        }

        function playExplodeSequence(amount, finalCoins, customMsg) {
            isAnimating = true;
            clearAmbientActors(); 
            uiLayer.style.opacity = '0';
            
            heroCreeper.style.display = 'block'; heroCreeper.classList.remove('anim-hurt');
            heroCreeper.style.right = "45%"; heroCreeper.style.bottom = "55px"; heroCreeper.style.transition = "all 0.5s";

            setTimeout(() => { playSound('fuse'); heroCreeper.classList.add('anim-swell'); }, 500);
            setTimeout(() => {
                heroCreeper.style.opacity = '0'; document.body.classList.add('shake'); 
                createParticles(50, '⬛'); createParticles(50, '🟥'); playSound('explode');
                statusMsg.innerText = customMsg || `遭遇爆炸！损失 ${amount}`;
                statusMsg.style.color = "#8b0000";
            }, 2500);

            setTimeout(() => { document.body.classList.remove('shake'); updateValue(finalCoins); resetStage(); }, 4000);
        }

        function resetStage() {
            uiLayer.style.opacity = '1';
            heroSteve.style.display = 'none'; document.querySelector('.skin-steve .sword').style.display = 'none'; document.querySelector('.skin-steve .sword').classList.remove('anim-attack');
            heroCreeper.style.display = 'none'; heroCreeper.style.opacity = '1'; heroCreeper.classList.remove('anim-hurt'); heroCreeper.classList.remove('anim-swell');
            isAnimating = false;
            lastCoins = parseInt(totalDisplay.innerText);
        }

        function updateValue(coins) { 
            totalDisplay.innerText = coins; 
            updateRank(coins); 
            updateHealthBar(coins, currentMaxCoins);
        }

        function updateHealthBar(current, max) {
            const finalMax = Math.max(current, max || 0);
            document.getElementById('maxCoinsText').innerText = finalMax;
            let percentage = finalMax === 0 ? 0 : (current / finalMax) * 100;
            percentage = Math.max(0, Math.min(100, percentage));
            document.getElementById('healthBarFill').style.width = `${percentage}%`;
        }

        function createParticles(count, char) {
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.classList.add('confetti'); el.innerText = char;
                const angle = Math.random() * 360; const dist = 50 + Math.random() * 100;
                el.style.setProperty('--tx', (Math.cos(angle * Math.PI / 180) * dist) + 'vw'); el.style.setProperty('--ty', (Math.sin(angle * Math.PI / 180) * dist) + 'vh');
                document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
            }
        }
        function checkDayNight() {
            const hour = new Date().getHours();
            if (hour >= 18 || hour < 6) document.body.classList.add('night');
            else document.body.classList.remove('night');
        }
        function updateRank(coins) {
            let currentTitle = RANKS[0].title;
            for (let i = RANKS.length - 1; i >= 0; i--) { if (coins >= RANKS[i].limit) { currentTitle = RANKS[i].title; break; } }
            rankBadge.innerText = currentTitle;
        }
        function clickCoin() { if(!isMuted) { sfxClick.currentTime = 0; sfxClick.play().catch(e=>{}); } if(navigator.vibrate) navigator.vibrate(20); }
        function toggleMute() { isMuted = !isMuted; bgm[isMuted ? 'pause' : 'play'](); document.querySelector('.mute-btn').innerText = isMuted ? '🔇' : '🔊'; }
        function playSound(type) {
            if(isMuted) return;
            try {
                if(type === 'levelup') { sfxLevelUp.currentTime=0; sfxLevelUp.play(); }
                if(type === 'explode') { sfxExplode.currentTime=0; sfxExplode.play(); }
                if(type === 'hit') { sfxHit.currentTime=0; sfxHit.play(); }
                if(type === 'fuse') { sfxFuse.currentTime=0; sfxFuse.play(); }
            } catch(e){}
        }
    </script>
</body>
</html>
