<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andy的学霸之路</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f3f4f6;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .mc-font {
            font-family: 'Press Start 2P', cursive;
        }
        .mc-btn {
            background-color: #5eba35;
            border: 4px solid;
            border-color: #8ce363 #37751c #37751c #8ce363;
            color: white;
            text-shadow: 2px 2px #37751c;
            transition: all 0.1s;
        }
        .mc-btn:active {
            border-color: #37751c #8ce363 #8ce363 #37751c;
        }
        .mc-card {
            border: 4px solid #7a542b;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.2);
            background-color: white;
        }
        .mc-select {
            border: 2px solid #7a542b;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%237a542b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat, repeat;
            background-position: right .7em top 50%, 0 0;
            background-size: .65em auto, 100%;
        }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- 头部 -->
        <div class="text-center space-y-2 mb-8">
            <h1 class="text-2xl md:text-4xl mc-font text-[#5eba35]" style="text-shadow: 2px 2px #37751c;">成绩记录工作台</h1>
            <p class="text-gray-500 font-bold">版本: V2.1 (双层雷达版)</p>
        </div>

        <!-- 学期全局选择器 -->
        <div class="mc-card p-4 flex justify-between items-center bg-[#e5e7eb]">
            <span class="font-bold text-lg">当前数据维度：</span>
            <select id="globalSemester" class="mc-select bg-white px-4 py-2 font-bold focus:outline-none rounded">
                <option value="初一上学期">初一上学期</option>
                <option value="初一下学期">初一下学期</option>
                <option value="初二上学期">初二上学期</option>
                <option value="初二下学期">初二下学期</option>
                <option value="初三上学期">初三上学期</option>
                <option value="初三下学期">初三下学期</option>
            </select>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 左侧：录入与雷达图 -->
            <div class="space-y-6 col-span-1">
                
                <!-- 录入表单 -->
                <div class="p-6 rounded-lg mc-card">
                    <h2 class="text-xl font-bold mb-4 border-b-2 border-gray-200 pb-2">➕ 新增记录</h2>
                    <form id="scoreForm" class="space-y-4">
                        <input type="hidden" id="formSemester" value="初一上学期">
                        <div>
                            <label class="block text-sm font-bold mb-1">考试名称</label>
                            <input type="text" id="examName" placeholder="如: 期中考试" required class="w-full px-3 py-2 border-2 border-gray-300 rounded focus:border-[#5eba35] focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">科目</label>
                            <input type="text" id="subject" list="subjectList" placeholder="点击选择或输入" required class="w-full px-3 py-2 border-2 border-gray-300 rounded focus:border-[#5eba35] focus:outline-none">
                            <datalist id="subjectList"></datalist>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-sm font-bold mb-1">得分</label>
                                <input type="number" id="score" step="0.5" required class="w-full px-3 py-2 border-2 border-gray-300 rounded focus:border-[#5eba35] focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-1">班级最高分</label>
                                <input type="number" id="highestScore" step="0.5" class="w-full px-3 py-2 border-2 border-gray-300 rounded focus:border-[#5eba35] focus:outline-none">
                            </div>
                        </div>
                        <button type="submit" class="w-full mc-btn py-3 font-bold text-lg mt-2">合成数据！</button>
                    </form>
                    <div id="loadingMsg" class="hidden text-center text-sm text-gray-500 mt-2">保存中...</div>
                </div>

                <!-- 雷达图展示区 -->
                <div class="p-6 rounded-lg mc-card">
                    <h2 class="text-xl font-bold mb-2 text-center">🎯 综合能力雷达图</h2>
                    <p class="text-xs text-gray-500 text-center mb-4">(当前学期各项平均分对比)</p>
                    <div class="relative h-64 w-full">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 右侧：单科趋势折线图 -->
            <div class="p-6 rounded-lg mc-card col-span-1 lg:col-span-2 flex flex-col">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 border-b-2 border-gray-200 pb-4">
                    <h2 class="text-xl font-bold mb-2 sm:mb-0">📈 单科成绩走势</h2>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-sm text-gray-600">切换科目:</span>
                        <select id="subjectFilter" class="mc-select bg-gray-100 px-3 py-1 font-bold focus:outline-none rounded">
                            <option value="">(请先录入数据)</option>
                        </select>
                    </div>
                </div>
                
                <div class="relative flex-grow min-h-[400px] w-full">
                    <canvas id="lineChart"></canvas>
                </div>
                <!-- 提示区域 -->
                 <div id="noDataTip" class="hidden text-center text-gray-500 mt-10 font-bold">当前学期该科目暂无数据 🕸️</div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 配置 URL 和 Key
        // ==========================================
        const SUPABASE_URL = 'https://ykbvwvhmvmzdzqrdibct.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zcVIJ86gQsYO3clU-HjAfA_e62kSSqj';
        // ==========================================

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let lineChartObj = null;
        let radarChartObj = null;
        let allData = []; 

        const domGlobalSemester = document.getElementById('globalSemester');
        const domFormSemester = document.getElementById('formSemester');
        const domSubjectFilter = document.getElementById('subjectFilter');
        const domNoDataTip = document.getElementById('noDataTip');
        const canvasLine = document.getElementById('lineChart');
        
        domGlobalSemester.addEventListener('change', (e) => {
            domFormSemester.value = e.target.value; 
            refreshViews(); 
        });

        domSubjectFilter.addEventListener('change', () => {
            renderLineChart();
        });

        async function fetchData() {
            const { data, error } = await db
                .from('exam_scores')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('获取数据失败:', error);
                return;
            }
            allData = data;
            
            updateSubjectLists();
            refreshViews();
        }

        function updateSubjectLists() {
            const subjects = [...new Set(allData.map(item => item.subject))];
            
            const subjectList = document.getElementById('subjectList');
            subjectList.innerHTML = '';
            subjects.forEach(sub => {
                const option = document.createElement('option');
                option.value = sub;
                subjectList.appendChild(option);
            });

            const currentSelected = domSubjectFilter.value;
            domSubjectFilter.innerHTML = '';
            
            if (subjects.length === 0) {
                domSubjectFilter.innerHTML = '<option value="">暂无数据</option>';
            } else {
                subjects.forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub;
                    option.textContent = sub;
                    domSubjectFilter.appendChild(option);
                });
                
                if (subjects.includes(currentSelected)) {
                    domSubjectFilter.value = currentSelected;
                } else {
                    domSubjectFilter.value = subjects[0];
                }
            }
        }

        function refreshViews() {
            renderRadarChart();
            renderLineChart();
        }

        // ============== 雷达图渲染逻辑 (双层多边形) ==============
        function renderRadarChart() {
            const currentSemester = domGlobalSemester.value;
            const semesterData = allData.filter(d => d.semester === currentSemester);
            
            const subjectsInSemester = [...new Set(semesterData.map(item => item.subject))];
            
            const myAverageScores = [];
            const highestAverageScores = [];

            if (subjectsInSemester.length === 0) {
                subjectsInSemester.push('暂无数据');
                myAverageScores.push(0);
                highestAverageScores.push(0);
            } else {
                subjectsInSemester.forEach(sub => {
                    const records = semesterData.filter(d => d.subject === sub);
                    
                    // 1. 计算我的平均分
                    const myScores = records.map(d => d.score);
                    const mySum = myScores.reduce((a, b) => a + b, 0);
                    myAverageScores.push((mySum / records.length).toFixed(1));

                    // 2. 计算班级最高分的平均分 (方案A)
                    // 如果以前有某次没填最高分，默认以满分 100 计算以保证图形边界不塌陷
                    const highestScores = records.map(d => d.highest_score ? d.highest_score : 100);
                    const highestSum = highestScores.reduce((a, b) => a + b, 0);
                    highestAverageScores.push((highestSum / records.length).toFixed(1));
                });
            }

            const ctx = document.getElementById('radarChart').getContext('2d');
            if (radarChartObj) { radarChartObj.destroy(); }

            radarChartObj = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: subjectsInSemester,
                    datasets: [
                        {
                            label: '我的平均分',
                            data: myAverageScores,
                            backgroundColor: 'rgba(94, 186, 53, 0.6)', // 绿色填充
                            borderColor: 'rgba(55, 117, 28, 1)',       // 绿色边框
                            pointBackgroundColor: 'rgba(55, 117, 28, 1)',
                            pointBorderColor: '#fff',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: 'rgba(55, 117, 28, 1)',
                            order: 1 // 保证绘制在上层
                        },
                        {
                            label: '班级最高平均',
                            data: highestAverageScores,
                            backgroundColor: 'rgba(245, 158, 11, 0.15)', // 淡金色填充，透出底部
                            borderColor: '#F59E0B',                      // 金色虚线边框
                            borderDash: [5, 5],
                            pointBackgroundColor: '#F59E0B',
                            pointBorderColor: '#fff',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: '#F59E0B',
                            order: 2 // 绘制在下层作为天花板边界
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(0,0,0,0.1)' },
                            grid: { color: 'rgba(0,0,0,0.1)' },
                            pointLabels: {
                                font: { size: 12, family: "'Press Start 2P', cursive", weight: 'bold' },
                                color: '#374151'
                            },
                            ticks: { min: 40, max: 100, stepSize: 20, display: false }
                        }
                    },
                    plugins: { 
                        legend: { 
                            display: true, 
                            position: 'bottom',
                            labels: {
                                font: { family: "'Press Start 2P', cursive", size: 10 },
                                boxWidth: 12
                            }
                        } 
                    }
                }
            });
        }

        // ============== 折线图渲染逻辑 ==============
        function renderLineChart() {
            const currentSemester = domGlobalSemester.value;
            const currentSubject = domSubjectFilter.value;
            
            const targetData = allData.filter(d => d.semester === currentSemester && d.subject === currentSubject);

            const ctx = canvasLine.getContext('2d');
            if (lineChartObj) { lineChartObj.destroy(); }

            if (targetData.length === 0) {
                canvasLine.style.display = 'none';
                domNoDataTip.classList.remove('hidden');
                return;
            } else {
                canvasLine.style.display = 'block';
                domNoDataTip.classList.add('hidden');
            }

            const examNames = targetData.map(item => item.exam_name);
            const myScores = targetData.map(item => item.score);
            const highestScores = targetData.map(item => item.highest_score ? item.highest_score : null);

            lineChartObj = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: examNames,
                    datasets: [
                        {
                            label: '我的分数',
                            data: myScores,
                            borderColor: '#3B82F6', 
                            backgroundColor: '#3B82F6',
                            tension: 0.3,
                            pointRadius: 6,
                            pointHoverRadius: 8
                        },
                        {
                            label: '班级最高分',
                            data: highestScores,
                            borderColor: '#F59E0B', 
                            backgroundColor: '#F59E0B',
                            borderDash: [5, 5], 
                            tension: 0.3,
                            pointRadius: 5,
                            spanGaps: true 
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: {
                            callbacks: {
                                afterLabel: function(context) {
                                    if (context.datasetIndex === 1) return []; 

                                    const currentScore = context.parsed.y;
                                    let labels = [];
                                    let prevScore = null;
                                    
                                    for (let i = context.dataIndex - 1; i >= 0; i--) {
                                        if (context.dataset.data[i] !== null) {
                                            prevScore = context.dataset.data[i];
                                            break;
                                        }
                                    }

                                    if (prevScore !== null) {
                                        const diff = (currentScore - prevScore).toFixed(1);
                                        if (diff > 0) labels.push(`环比上次: +${diff}分 📈`);
                                        else if (diff < 0) labels.push(`环比上次: ${diff}分 📉`);
                                        else labels.push(`环比上次: 持平 ➖`);
                                    } else {
                                        labels.push(`环比上次: (本学期首次)`);
                                    }
                                    return labels;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            suggestedMin: 60,
                            suggestedMax: 100
                        }
                    }
                }
            });
        }

        // ============== 表单提交逻辑 ==============
        document.getElementById('scoreForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const semester = document.getElementById('formSemester').value; 
            const examName = document.getElementById('examName').value.trim();
            const subject = document.getElementById('subject').value.replace(/\s+/g, '');
            const score = document.getElementById('score').value;
            const highestScore = document.getElementById('highestScore').value;

            document.getElementById('loadingMsg').classList.remove('hidden');

            const { error } = await db
                .from('exam_scores')
                .insert([
                    { 
                        semester: semester,
                        exam_name: examName, 
                        subject: subject, 
                        score: parseFloat(score), 
                        highest_score: highestScore ? parseFloat(highestScore) : null 
                    }
                ]);

            document.getElementById('loadingMsg').classList.add('hidden');

            if (error) {
                alert('保存失败，请检查网络或联系管理员！');
                console.error(error);
            } else {
                document.getElementById('score').value = '';
                document.getElementById('highestScore').value = '';
                
                if (!domSubjectFilter.querySelector(`option[value="${subject}"]`)) {
                    const opt = document.createElement('option');
                    opt.value = subject;
                    opt.textContent = subject;
                    domSubjectFilter.appendChild(opt);
                }
                domSubjectFilter.value = subject;
                
                fetchData(); 
            }
        });

        // 页面启动
        window.onload = fetchData;
    </script>
</body>
</html>
