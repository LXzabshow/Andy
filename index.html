<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Andy的冒险背包</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #76b5fe; font-family: 'VT323', monospace; text-align: center; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; transition: background 1.5s ease; }
        
        .ground { position: absolute; bottom: 0; width: 100%; height: 20px; background: #5D4037; border-top: 6px solid #4CAF50; z-index: 20; }
        .stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 15;}
        .actor { position: absolute; bottom: 20px; transition: transform 0.1s; z-index: 30; }
        
        .ui-container { margin-top: 5vh; width: 90%; max-width: 400px; z-index: 100; position: relative; transition: opacity 0.5s ease, transform 0.2s ease;}
        .card { background-color: var(--card-bg, #c6c6c6); border: 5px solid var(--card-border, #000); box-shadow: inset 4px 4px rgba(255,255,255,0.4), inset -4px -4px rgba(0,0,0,0.4); padding: 15px; position: relative; transition: all 0.5s ease; }
        
        h2 { color: #404040; margin: 0 0 5px 0; font-size: 30px; text-shadow: 2px 2px #fff; letter-spacing: 2px; }
        
        .rank-badge { background: #333; color: var(--card-border, #f1c40f); padding: 4px 12px; border: 2px solid #fff; display: inline-block; margin-bottom: 10px; font-size: 18px; border-radius: 4px; box-shadow: 2px 2px #000; cursor: pointer;}
        .rank-badge:active { transform: scale(0.95); }
        .rank-badge::after { content: ' 🔍'; font-size: 14px; opacity: 0.8; }
        
        .slot { background: #8b8b8b; width: 70px; height: 70px; margin: 0; border: 4px solid #373737; border-right-color: #fff; border-bottom-color: #fff; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; flex-shrink: 0;}
        .slot:active .coin-icon { transform: scale(0.8); }
        .coin-icon { font-size: 40px; filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.5)); z-index: 2; transition: transform 0.1s;}
        .total { font-size: 55px; color: #fff; font-weight: bold; text-shadow: 4px 4px 0px #333; margin: 0; line-height: 1; flex-shrink: 0;}

        #activeBuffsContainer { width: 100%; display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
        .buff-pill { background: rgba(0,0,0,0.7); border: 2px solid #ffb700; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-family: -apple-system, sans-serif; font-weight: bold; text-shadow: 1px 1px #000; display: flex; justify-content: space-between; align-items: center; animation: glow 2s infinite alternate;}
        @keyframes glow { from { box-shadow: 0 0 5px #ffb700; } to { box-shadow: 0 0 15px #ffb700, 0 0 5px #ffb700 inset; } }

        .health-bar-container { width: 100%; margin-top: 10px; padding: 0 5px; box-sizing: border-box; }
        .health-bar-label { font-size: 15px; color: #404040; font-weight: bold; margin-bottom: 5px; text-shadow: 1px 1px #fff; display:flex; justify-content: space-between;}
        .health-bar-bg { width: 100%; height: 20px; background-color: #333; border: 3px solid #000; position: relative; box-shadow: inset 2px 2px #111, inset -2px -2px #555; overflow: hidden;}
        .health-bar-fill { height: 100%; background-color: #e70000; width: 0%; transition: width 0.8s; box-shadow: inset 0px 4px 0px rgba(255,255,255,0.3); }
        .health-bar-fill.safe { background-color: #2ecc71; } .health-bar-fill.warn { background-color: #f1c40f; }

        .btn-upgrade { width: 100%; margin-top: 10px; padding: 10px; font-family: 'VT323', monospace; font-size: 18px; font-weight: bold; color: white; background: #d35400; border: 4px solid #000; cursor: pointer; animation: pulse 2s infinite;}
        .btn-upgrade:disabled { background: #7f8c8d; cursor: not-allowed; animation: none; filter: grayscale(1); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        
        .main-btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .btn-main-action { width: 100%; padding: 12px 0; font-family: inherit; font-size: 16px; font-weight: bold; color: white; background: #27ae60; border: 4px solid #000; cursor: pointer; box-shadow: inset 2px 2px rgba(255,255,255,0.3), inset -2px -2px rgba(0,0,0,0.3); }
        .btn-main-action:active:not(:disabled) { transform: scale(0.95); }
        .btn-shop { background: #e67e22; }
        .btn-game { background: #8e44ad; }
        .btn-log { background: #7f8c8d; }
        .btn-contract { background: #c0392b; }
        .btn-milestone { background: #2980b9; }

        .status-bar { background: #000; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 12px; display: inline-flex; align-items: center; margin-top: 8px; border: 2px solid #555; }
        .light { width: 8px; height: 8px; background: #e74c3c; margin-right: 8px; } .light.online { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .message { color: #004400; margin-top: 5px; font-size: 14px; height: 20px; text-shadow: 1px 1px #fff; font-weight: bold;}
        .mute-btn { position: absolute; top: 10px; right: 10px; font-size: 24px; cursor: pointer; color: #555; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 400; display: none; justify-content: center; align-items: center; padding: 10px;}
        .challenge-card { background: #c6c6c6; border: 4px solid #000; box-shadow: inset 4px 4px #fff, inset -4px -4px #555; padding: 15px; width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; max-height: 90vh;}
        .challenge-title { font-size: 26px; color: #333; margin-bottom: 10px; text-shadow: 1px 1px #fff; flex-shrink: 0;}
        .btn-close-modal { background: #c0392b; color: white; padding: 10px 20px; border: 2px solid #000; font-family: inherit; font-size: 20px; cursor: pointer; margin-top: 10px; width: 100%; flex-shrink: 0;}

        .reward-grid { display: grid; grid-template-columns: 1fr; gap: 10px; width: 100%; overflow-y: auto; padding-right: 5px;}
        .mc-item-btn { position: relative; background: #8b8b8b; border: 3px solid #000; border-right-color: #fff; border-bottom-color: #fff; padding: 10px; cursor: pointer; text-align: left; }
        .mc-item-btn:active:not(.in-cd) { transform: scale(0.98); }
        .mc-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .mc-item-title { font-size: 16px; color: #000; font-weight: bold; text-shadow: 1px 1px #fff; }
        .mc-item-reward { color: #004400; font-weight: bold; font-size: 20px; text-shadow: 1px 1px #fff;}
        .mc-item-desc { font-family: -apple-system, sans-serif; font-size: 13px; color: #222; line-height: 1.3; }
        .badge { background: #8e44ad; color: #fff; font-size: 10px; padding: 2px 4px; border-radius: 4px; margin-left: 5px; font-family: -apple-system, sans-serif;}
        
        .cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; background: conic-gradient(rgba(0,0,0,0.7) var(--progress), transparent 0deg); }
        .cd-timer { position: absolute; bottom: 6px; right: 8px; color: #fff; font-size: 16px; font-weight: bold; text-shadow: 1px 1px #000; display: none; }
        .in-cd { cursor: not-allowed; opacity: 0.8; } .in-cd .cd-overlay, .in-cd .cd-timer { display: block; }

        #schulteGrid { display: grid; width: 100%; aspect-ratio: 1; gap: 4px; background: #373737; padding: 5px; border: 4px solid #000; touch-action: none; }
        .schulte-cell { background: #c6c6c6; border: 3px solid #000; box-shadow: inset 2px 2px #fff, inset -2px -2px #555; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; cursor: pointer; aspect-ratio: 1; transition: transform 0.05s, filter 0.3s; }
        .schulte-cell:active { transform: scale(0.92); }
        .schulte-cell.correct { background: #2ecc71 !important; color: #fff !important; cursor: not-allowed !important; filter: none !important;}
        .schulte-cell.debuff { background: #111 !important; color: #444 !important; filter: blur(1px); }

        .fly-text { position: fixed; z-index: 1000; font-family: 'VT323', monospace; font-size: 40px; font-weight: bold; text-shadow: 2px 2px #000, -2px -2px #000; pointer-events: none; animation: floatUp 1s forwards; }
        @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; } 20% { transform: translate(-50%, -20px) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -60px) scale(1); opacity: 0; } }

        .rank-list-item { background: #fff; border: 2px solid #555; padding: 12px; margin-bottom: 10px; border-radius: 6px; text-align: left; font-family: -apple-system, sans-serif; display: block; }
        .rank-list-item.unlocked { border-left-width: 6px; background: #f0f8ff; }
        .rank-list-item.next-target { border: 3px dashed #e67e22; background: #fffdf5; box-shadow: inset 0 0 15px rgba(230,126,34,0.2); }
        .rank-list-item.locked { background: #d5d5d5; opacity: 0.6; filter: grayscale(1); border: 2px solid #888; }
        .r-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; color: #000; }
        .r-desc { font-size: 13px; color: #333; line-height: 1.4; }
        .r-cost { font-size: 14px; font-weight: bold; color: #c0392b; margin-top: 5px; }

        .log-container { max-height: 250px; overflow-y: auto; text-align: left; background: #fff; border: 2px solid #555; padding: 10px; font-family: -apple-system, sans-serif; font-size: 13px; }
        .log-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #ccc; }
        .log-t { color: #888; font-size: 11px; min-width: 75px;}
        .log-a { font-weight: bold; color: #333; flex: 1; margin: 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        .log-v { font-weight: bold; color: #27ae60; text-align: right; min-width: 30px;} .log-v.sub { color: #e74c3c; } .log-v.milestone { color: #ffb700; }

        .ms-card { background: #e0e0e0; border: 2px solid #555; padding: 10px; margin-bottom: 10px; border-radius: 4px; text-align: left; font-family: -apple-system, sans-serif;}
        .ms-header { display: flex; justify-content: space-between; font-weight: bold; color: #2c3e50; font-size: 15px; margin-bottom: 5px;}
        .ms-tier { color: #e67e22; font-size: 12px; font-weight: bold;}
        .ms-bar-bg { width: 100%; height: 12px; background: #bdc3c7; border-radius: 6px; overflow: hidden; }
        .ms-bar-fill { height: 100%; background: #2980b9; width: 0%; transition: width 0.5s; }

        .mc-input { width: 100%; padding: 10px; font-family: -apple-system, sans-serif; font-size: 15px; border: 2px solid #333; background: #fff; margin-bottom: 10px; box-sizing: border-box;}
        textarea.mc-input { resize: vertical; min-height: 80px; }

        .skin-steve, .skin-creeper, .skin-villager { /* 动画复用 */ }
        .skin-steve { width: 60px; height: 135px; } .skin-steve .head { width: 60px; height: 60px; background: #F8B090; position: absolute; top: 0; z-index: 2; } .skin-steve .hair { width: 60px; height: 15px; background: #452613; position: absolute; top: 0; z-index: 3; } .skin-steve .body { width: 60px; height: 45px; background: #00AAAA; position: absolute; top: 60px; z-index: 1; } .skin-steve .pants { width: 60px; height: 30px; background: #303090; position: absolute; top: 105px; } .skin-steve .sword { position: absolute; top: 35px; right: -40px; font-size: 60px; transform: scaleX(-1) rotate(45deg); transform-origin: 20% 80%; z-index: 4; display: none; filter: drop-shadow(2px 2px 0 #000); }
        .skin-creeper { width: 45px; height: 120px; } .skin-creeper .head { width: 45px; height: 45px; background: #00AA00; position: absolute; top: 0; border: 3px solid #005500; } .skin-creeper .face { position: absolute; top: 10px; left: 8px; width: 29px; height: 25px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8"><path d="M1 1h2v2h2v-2h2v3h-2v1h1v2h-2v-1h-2v1h-2v-2h1v-1h-2z"/></svg>'); opacity: 0.8; } .skin-creeper .body { width: 45px; height: 45px; background: #00AA00; position: absolute; top: 45px; } .skin-creeper .legs { width: 45px; height: 30px; position: absolute; top: 90px; } .skin-creeper .leg { width: 15px; height: 30px; background: #00AA00; position: absolute; bottom:0; }
        .skin-villager { width: 50px; height: 140px; } .skin-villager .head { width: 50px; height: 60px; background: #d09b7c; position: absolute; top: 0; } .skin-villager .nose { width: 10px; height: 18px; background: #d09b7c; position: absolute; top: 30px; left: 20px; border: 1px solid #a3755b; z-index: 5;} .skin-villager .body { width: 50px; height: 80px; background: #684831; position: absolute; top: 60px; } .skin-villager .arms { width: 50px; height: 15px; background: #684831; position: absolute; top: 75px; left: 0; }

        .breathe { animation: breathe 2s ease-in-out infinite; } @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02); } }
        .anim-attack { animation: swordSwing 0.35s ease-out forwards; } @keyframes swordSwing { 0% { transform: scaleX(-1) rotate(45deg); } 50% { transform: scaleX(-1) rotate(-60deg); } 100% { transform: scaleX(-1) rotate(45deg); } }
        .anim-hurt { animation: hurtFlash 0.3s steps(2) infinite; } @keyframes hurtFlash { 0% { filter: sepia(1) hue-rotate(-50deg) saturate(5); } 100% { filter: none; } }
        .anim-swell { animation: swell 2.5s ease-in forwards; } @keyframes swell { 0% { transform: scale(1); filter: brightness(1); } 95% { transform: scale(2.5); filter: brightness(100); opacity: 1;} 100% { transform: scale(3); opacity: 0; } }
        .shake { animation: shake 0.5s infinite; } @keyframes shake { 0% { transform: translate(2px, 2px); } 20% { transform: translate(-4px, 0px); } 40% { transform: translate(2px, -2px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -4px); } }
        .run-l-to-r { animation: runLeftToRight 8s linear forwards; } @keyframes runLeftToRight { 0% { left: -150px; } 100% { left: 120vw; } }
        .run-r-to-l { animation: runRightToLeft 8s linear forwards; } @keyframes runRightToLeft { 0% { right: -150px; } 100% { right: 120vw; } }
        
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .mc-btn { background: #727272; border: 4px solid #fff; padding: 15px 30px; font-size: 24px; color: white; font-family: 'VT323', monospace; cursor: pointer; }
        .confetti { position: fixed; top: 50%; left: 50%; z-index: 999; animation: explode-particle 1s ease-out forwards; pointer-events: none; font-size: 30px;}
        @keyframes explode-particle { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(720deg); opacity: 0; } }
        .level-up-banner { fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0); z-index: 9999; color: #ffb700; font-family: 'VT323', monospace; text-shadow: 4px 4px 0 #000, -2px -2px 0 #000; text-align: center; white-space: nowrap; pointer-events: none; animation: bannerAnim 3.5s forwards; }
        @keyframes bannerAnim { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; filter: blur(5px);} }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div id="start-overlay">
        <h1 style="font-size: 40px; margin-bottom:10px;">Andy的探险世界</h1>
        <button class="mc-btn" onclick="startGame()">开始冒险</button>
    </div>

    <audio id="bgm" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-levelup"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/levelup.ogg" type="audio/ogg"></audio>
    <audio id="sfx-explode"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/explode.ogg" type="audio/ogg"></audio>
    <audio id="sfx-hit"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/damage/hit1.ogg" type="audio/ogg"></audio>
    <audio id="sfx-fuse"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/fuse.ogg" type="audio/ogg"></audio>
    <audio id="sfx-click"><source src="https://raw.githubusercontent.com/kurisubrooks/minecraft-sounds/master/sounds/random/click.ogg" type="audio/ogg"></audio>

    <div id="confirmModal" class="modal-overlay" style="z-index: 1000;">
        <div class="challenge-card" style="max-width: 300px;">
            <div class="challenge-title" style="font-size: 24px;">📋 确认告示</div>
            <div id="confirmText" style="color:#000; font-size:16px; margin: 15px 0; font-weight:bold; line-height:1.5;">...</div>
            <button class="btn-main-action" onclick="executeConfirmedAction()" style="margin-top: 5px;">✅ 确定</button>
            <button class="btn-close-modal" onclick="closeConfirmModal()" style="margin-top: 5px;">❌ 取消</button>
        </div>
    </div>

    <div id="contractModal" class="modal-overlay">
        <div class="challenge-card">
            <div class="challenge-title" style="color: #c0392b;">📜 誓言祭坛</div>
            <div id="contractContent" style="margin-top:10px; text-align:left;">加载中...</div>
            <button class="btn-close-modal" onclick="closeContractModal()">离开祭坛</button>
        </div>
    </div>

    <div id="milestoneModal" class="modal-overlay">
        <div class="challenge-card">
            <div class="challenge-title" style="color: #2980b9;">🏆 进阶图鉴</div>
            <div id="milestoneContent" class="reward-grid" style="max-height: 60vh;">加载中...</div>
            <button class="btn-close-modal" onclick="closeMilestoneModal()">合上图鉴</button>
        </div>
    </div>

    <div id="rankModal" class="modal-overlay" style="z-index: 600;"><div class="challenge-card" style="max-width: 360px; max-height: 85vh;"><div class="challenge-title" style="color: #d35400;">👑 境界图鉴</div><div id="rankListContainer" style="width: 100%; overflow-y: auto; margin-top: 10px; padding-right: 5px;"></div><button class="btn-close-modal" onclick="closeRankModal()" style="margin-top: 15px;">关闭图鉴</button></div></div>
    <div id="rewardModal" class="modal-overlay"><div class="challenge-card"><div class="challenge-title">⚔️ 任务告示牌</div><div class="reward-grid" id="rewardListContainer"><div style="padding:20px; color:#555;">正在同步...</div></div><button class="btn-close-modal" onclick="closeRewardModal()">返回营地</button></div></div>
    <div id="shopModal" class="modal-overlay"><div class="challenge-card"><div class="challenge-title" style="color: #8e44ad;">🛒 神秘商店</div><div class="reward-grid" id="shopListContainer"><div style="padding:20px; color:#555;">正在同步...</div></div><button class="btn-close-modal" onclick="closeShopModal()">离开商店</button></div></div>
    <div id="logModal" class="modal-overlay"><div class="challenge-card"><div class="challenge-title">📜 探险账单</div><div id="logListContent" class="log-container"></div><button class="btn-close-modal" onclick="closeLogModal()">合上账本</button></div></div>

    <div id="gameModal" class="modal-overlay" style="z-index: 600;">
        <div class="challenge-card" style="max-width: 380px; width: 95%;">
            <div class="challenge-title" style="color: #8e44ad;">👁️ 试炼高塔</div>
            <div id="gameMenu">
                <div id="gameRemainingCount" style="color: #000; font-weight: bold; margin-bottom: 20px; font-size: 16px; text-shadow: 1px 1px #fff; background: rgba(255,255,255,0.7); padding: 8px; border: 2px solid #555;">...</div>
                <button class="btn-main-action" onclick="attemptStartGame('normal')" style="background: #27ae60; margin-bottom: 12px; font-size:22px;">🟢 攀登高塔 (6x6)</button>
                <button class="btn-main-action" onclick="attemptStartGame('hard')" style="background: #e67e22; margin-bottom: 12px; font-size:22px;">🔴 极限高塔 (7x7)</button>
                <button class="btn-main-action" onclick="attemptStartGame('survival')" style="background: #8e44ad; margin-bottom: 20px; font-size:22px;">💀 凋零高塔 (生存)</button>
                <button class="btn-close-modal" onclick="closeGameModal()">离开高塔</button>
            </div>
            <div id="gamePlay" style="display: none; flex-direction: column; align-items: center; width: 100%;">
                <div style="display: flex; justify-content: space-between; width: 100%; font-size: 22px; font-weight: bold; margin-bottom: 12px; color: #111; text-shadow:1px 1px #fff;">
                    <span>目标: <span id="gameTargetNum" style="color: #e67e22; font-size: 26px;">1</span></span>
                    <span>⏳ <span id="gameTimerText" style="color: #c0392b;">30</span>s</span>
                </div>
                <div id="schulteGrid"></div>
                <button class="btn-close-modal" onclick="quitGameSession()" style="margin-top: 15px; background:#7f8c8d;">🏳️ 放弃攀登</button>
            </div>
            <div id="gameResult" style="display: none;">
                <div id="gameResultTitle" style="font-size: 28px; font-weight: bold; margin-bottom: 12px;"></div>
                <div id="gameResultDesc" style="font-size: 15px; margin-bottom: 20px; color: #222; font-family: -apple-system, sans-serif; line-height: 1.5; text-align: left; background:#fff; padding:10px; border:2px solid #000;"></div>
                <button class="btn-main-action" id="btnGameRetry" style="background: #27ae60; font-size:22px;">再来一局</button>
                <button class="btn-close-modal" onclick="backToGameMenu()" style="margin-top: 10px; width: 100%;">返回菜单</button>
            </div>
        </div>
    </div>

    <div class="ui-container" id="uiLayer">
        <div class="card" id="ui-card">
            <div class="mute-btn" onclick="toggleMute()">🔊</div>

        function getFormattedTime() {
            const now = new Date(); return `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        }
        function getTodayStr() { 
            const parts = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
            let y, m, d; parts.forEach(p => { if(p.type==='year') y=p.value; if(p.type==='month') m=p.value; if(p.type==='day') d=p.value; }); return `${y}-${m}-${d}`;
        }

        // 💡 修复补全：BUFF 实时渲染核心逻辑
        function renderBuffs() {
            if (!currentData || !currentData.activeBuffs) return;
            const container = document.getElementById('activeBuffsContainer');
            if (!container) return;
            
            const now = Date.now();
            let hasActive = false;
            let html = '';

            for (const [id, buff] of Object.entries(currentData.activeBuffs)) {
                const remain = buff.endTime - now;
                if (remain > 0) {
                    hasActive = true;
                    let days = Math.floor(remain / (24 * 3600000));
                    let hours = Math.floor((remain % (24 * 3600000)) / 3600000);
                    let mins = Math.floor((remain % 3600000) / 60000);
                    let secs = Math.floor((remain % 60000) / 1000);
                    let timeStr = days >= 1 ? `${days}天 ${hours}小时` : `${hours}:${mins<10?'0'+mins:mins}:${secs<10?'0'+secs:secs}`;
                    html += `<div class="buff-pill"><span>${buff.icon} ${buff.name}</span><span style="color:#ffb700;">⏳ ${timeStr}</span></div>`;
                }
            }
            container.innerHTML = hasActive ? html : '';
        }

        async function checkAndApplyDailyDeduction(record) {
            if (!record.dailyConfig || !record.dailyConfig.enabled) return record;
            let today = getTodayStr(); if(record.dailyConfig.lastDeductDate === today) return record;
            
            let deductedAmount = Math.min(record.coins, record.dailyConfig.amount); 
            if(deductedAmount === 0) { await dbClient.from('gamedata').update({ dailyConfig: { ...record.dailyConfig, lastDeductDate: today } }).eq('id', ROW_ID); return record; }

            record.coins -= deductedAmount; record.dailyConfig.lastDeductDate = today;
            let logs = record.childLogs || []; logs.unshift({ time: getFormattedTime(), action: "系统自动饥饿消耗", amount: -deductedAmount });
            try { await dbClient.from('gamedata').update({ coins: record.coins, dailyConfig: record.dailyConfig, childLogs: logs.slice(0, 10) }).eq('id', ROW_ID); record._justAutoDeducted = deductedAmount; } catch (e) {} return record;
        }

        async function startGame() {
            document.getElementById('start-overlay').style.display='none';
            await syncData(); syncInterval = setInterval(syncData, 5000); 
            setInterval(processCooldowns, 1000); setInterval(renderBuffs, 1000); 
            playAmbientScenario(); ambientInterval = setInterval(playAmbientScenario, 12000);
        }

        async function syncData() {
            if(isAnimating || isGameRunning) return;
            try {
                const { data } = await dbClient.from('gamedata').select('*').eq('id', ROW_ID);
                if (!data || data.length === 0) return;
                
                let record = data[0];
                record.currentRank = record.currentRank || 1; record.shopItems = record.shopItems || [];
                record.activeBuffs = record.activeBuffs || {}; record.taskItems = record.taskItems || [];
                record.schulteDaily = record.schulteDaily || { lastDate: "", playCount: 0, winCount: 0 };
                
                record.milestones = record.milestones || {};
                Object.keys(MS_NAMES).forEach(k => record.milestones[k] = record.milestones[k] || 0);
                
                record.milestoneClaimed = record.milestoneClaimed || {};
                Object.keys(MS_NAMES).forEach(k => record.milestoneClaimed[k] = record.milestoneClaimed[k] || []);
                
                record.towerConfig = record.towerConfig || { freePlays: 5, maxRewards: 5, normal: { ticket: 1, reward: 2 }, hard: { ticket: 1, reward: 4 }, survival: { ticket: 2, reward: 6 } };
                
                record = await checkAndApplyDailyDeduction(record);
                currentData = record; let cloudCoins = record.coins || 0;
                
                renderLogs(record.childLogs); updateRankUI(cloudCoins, record.currentRank);

                if (record._justAutoDeducted > 0) {
                    playExplodeSequence(record._justAutoDeducted, cloudCoins, `饥饿值消耗！扣除 ${record._justAutoDeducted} 币`);
                    localStorage.setItem('andy_last_seen_coins', cloudCoins); return; 
                }

                let localStr = localStorage.getItem('andy_last_seen_coins');
                if (localStr === null) { if(totalDisplay) totalDisplay.innerText = cloudCoins; localStorage.setItem('andy_last_seen_coins', cloudCoins); return; }
                lastCoins = parseInt(localStr);

                if (cloudCoins > lastCoins) playAttackSequence(cloudCoins - lastCoins, cloudCoins);
                else if (cloudCoins < lastCoins) playExplodeSequence(lastCoins - cloudCoins, cloudCoins, `遭遇劫掠！扣减 ${lastCoins - cloudCoins}`);
                else if(totalDisplay) totalDisplay.innerText = cloudCoins;
                
                localStorage.setItem('andy_last_seen_coins', cloudCoins);
                if(connStatus) connStatus.innerText = "信号良好";
            } catch (error) { if(connStatus) connStatus.innerText = "失去连接..."; }
        }

        function updateRankUI(coins, rank) {
            const rData = RANK_DATA[rank - 1] || RANK_DATA[0];

            if (rankBadge) rankBadge.innerText = rData.title;

            document.body.style.background = (rank >= 9) ? rData.pageBg : (isNight ? rData.nightBg : rData.pageBg);

            let maxCap = rData.cap, ratio = maxCap === Infinity ? 0 : (coins / maxCap) * 100;
            const capText = document.getElementById('capacityText'); if (capText) capText.innerText = `${coins} / ${maxCap === Infinity ? '∞' : maxCap}`;
            const fill = document.getElementById('healthBarFill');
            if (fill) { fill.style.width = ratio + '%'; fill.className = ratio > 85 ? 'health-bar-fill warn' : (ratio < 40 ? 'health-bar-fill safe' : 'health-bar-fill'); }
            if (btnUpgrade) { btnUpgrade.innerText = rank >= RANK_DATA.length ? "已达最高境界 👑" : `🆙 突破界限 (需花费 ${rData.cost} 币)`; btnUpgrade.disabled = rank >= RANK_DATA.length || coins < rData.cost; }
        }

        // 📜 誓言祭坛逻辑
        function openContractModal() {

                        <div style="margin-bottom:8px; color:#2ecc71;">🎁 成功返还+赏金: <b>${contract.wager + contract.reward}</b> 币</div>
                        <hr style="border-color:#555;">
                        <div style="color:#555; font-size:12px;">注: 结算由家长端进行裁决判定。请专注完成目标！</div>

        }

        async function submitContract() {
            let desc = document.getElementById('contract_desc').value.trim(); let wager = parseInt(document.getElementById('contract_wager').value);
            if (!desc || !wager || wager <= 0) return alert("请完整填写誓言与质押金额！");
            if (currentData.coins < wager) { playSound('fuse'); return alert("🎒 背包硬币不足以支付质押金！"); }
            
            let newCoins = currentData.coins - wager; let logs = currentData.childLogs || [];
            logs.unshift({ time: getFormattedTime(), action: `📜 发起契约质押`, amount: -wager });
            let contract = { desc: desc, wager: wager, reward: wager, status: 'pending', time: Date.now() };
            
            await dbClient.from('gamedata').update({ coins: newCoins, activeContract: contract, childLogs: logs.slice(0,10) }).eq('id', ROW_ID);
            localStorage.setItem('andy_last_seen_coins', newCoins); currentData.activeContract = contract;
            updateValue(newCoins); openContractModal(); playSound('fuse');
        }

        // 🏆 里程碑图鉴逻辑
        function openMilestoneModal() {
            if (!currentData) return; clickCoin(); msModal.style.display = 'flex';
            const container = document.getElementById('milestoneContent');
            let ms = currentData.milestones || {};
            
            let html = '';
            for (let [key, name] of Object.entries(MS_NAMES)) {
                let count = ms[key] || 0;
                let nextTier = MILESTONES.find(t => t.count > count) || MILESTONES[MILESTONES.length - 1];
                let isMax = count >= MILESTONES[MILESTONES.length - 1].count;
                let ratio = isMax ? 100 : (count / nextTier.count) * 100;
                
                html += `
                    <div class="ms-card">
                        <div class="ms-header">
                            <span>${name}</span>
                            <span class="ms-tier">${isMax ? '已满级' : `下一阶: ${nextTier.name} (${count}/${nextTier.count}) | 🎁 悬赏: ${nextTier.reward} 币`}</span>
                        </div>
                        <div class="ms-bar-bg"><div class="ms-bar-fill" style="width:${ratio}%;"></div></div>
                    </div>`;
            }
            container.innerHTML = html;
        }
        function closeMilestoneModal() { msModal.style.display = 'none'; }

        function checkMilestoneProgress(type, record, logs) {
            record.milestones[type]++;
            let count = record.milestones[type];
            let extraCoins = 0;
            for (let tier of MILESTONES) {
                if (count === tier.count && !record.milestoneClaimed[type].includes(tier.count)) {
                    extraCoins += tier.reward;
                    record.milestoneClaimed[type].push(tier.count);
                    logs.unshift({ time: getFormattedTime(), action: `🏆 达成里程碑 [${MS_NAMES[type]}]: ${tier.name}`, amount: tier.reward });
                }
            }
            return extraCoins;
        }

        // --- 悬赏与日常任务 ---
        function openRewardModal() { if(rModal) { rModal.style.display = 'flex'; renderDynamicTasks(); processCooldowns(); } }
        function closeRewardModal() { if(rModal) rModal.style.display = 'none'; }

            const container = document.getElementById('rewardListContainer');

                    <div class="mc-item-header">
                        <span class="mc-item-title">${task.icon || '⚔️'} ${task.name} ${task.milestone ? `<span class="badge">属性: ${MS_NAMES[task.milestone]}</span>` : ''}</span>
                        <span class="mc-item-reward">+${task.price} 🪙</span>
                    </div>
                    <div class="mc-item-desc">${task.desc}</div>
                    <span class="cd-timer">--:--</span>
                </div>`).join('');
        }
        function triggerTaskClick(taskId) { const task = currentData.taskItems.find(t => t.id === taskId); if(task) requestAction('reward', task); }

        function openShopModal() { 
            if(!sModal) return; sModal.style.display = 'flex'; 
            const container = document.getElementById('shopListContainer');
            if(!currentData || !currentData.shopItems || currentData.shopItems.length === 0) { container.innerHTML = '<div style="padding:20px; color:#555;">货架空空如也</div>'; return; }
            container.innerHTML = currentData.shopItems.map(item => `
                <div class="mc-item-btn" onclick="triggerBuy('${item.id}')" style="border-color:#8e44ad;">
                    <div class="mc-item-header"><span class="mc-item-title">${item.icon} ${item.name}</span><span class="mc-item-reward" style="color:#c0392b;">-${item.price} 🪙</span></div>
                    <div class="mc-item-desc">${item.desc} <br><span style="color:#555;">(时效 ${item.hours >= 24 ? (item.hours/24 + ' 天') : (item.hours + ' 小时')})</span></div>
                </div>`).join('');
        }
        function closeShopModal() { if(sModal) sModal.style.display = 'none'; }
        function triggerBuy(itemId) { const item = currentData.shopItems.find(i => i.id === itemId); if(item) requestAction('buy', item); }

        function requestAction(actionType, data) {
            clickCoin();
            if (actionType === 'reward') {
                const now = Date.now(); if(currentData.cooldowns && currentData.cooldowns[data.id] > now) return; 
                document.getElementById('confirmText').innerHTML = `确认已达标并领取<br><span style="color:#27ae60; font-size:20px;">【${data.name}】</span><br>的悬赏奖励吗？`;
            } 
            else if (actionType === 'buy') {
                if (currentData.coins < data.price) { playSound('fuse'); return alert("❌ 行囊硬币不足，无法兑换！"); }
                document.getElementById('confirmText').innerHTML = `确认花费 <span style="color:#c0392b;">${data.price}币</span> 兑换<br><span style="color:#8e44ad; font-size:20px;">【${data.name}】</span> 吗？`;
            }
            pendingAction = { actionType, data }; cfModal.style.display = 'flex';
        }

        function closeConfirmModal() { if(cfModal) cfModal.style.display = 'none'; pendingAction = null; }

        async function executeConfirmedAction() {
            if (!pendingAction) return;
            const action = pendingAction; closeConfirmModal();
            if (action.actionType === 'reward') await proceedWithReward(action.data);
            else if (action.actionType === 'buy') await proceedWithBuy(action.data);
            else if (action.actionType === 'schulteTicket') await executeStartGame(action.data.mode, true);
        }

        async function proceedWithBuy(item) {
            try {
                let record = currentData; const newCoins = record.coins - item.price;
                let logs = record.childLogs || []; logs.unshift({ time: getFormattedTime(), action: `兑换法宝: ${item.name}`, amount: -item.price });
                let buffs = record.activeBuffs || {}; let currentEndTime = buffs[item.id] ? buffs[item.id].endTime : 0;
                if (currentEndTime < Date.now()) currentEndTime = Date.now();
                buffs[item.id] = { name: item.name, icon: item.icon, endTime: currentEndTime + (item.hours * 3600000) };

                await dbClient.from('gamedata').update({ coins: newCoins, childLogs: logs.slice(0, 10), activeBuffs: buffs }).eq('id', ROW_ID);
                currentData.coins = newCoins; currentData.childLogs = logs; currentData.activeBuffs = buffs;
                localStorage.setItem('andy_last_seen_coins', newCoins); closeShopModal(); playSound('levelup');
                createParticles(50, ['✨', item.icon, '🔮']); updateValue(newCoins); renderBuffs();
            } catch (e) { alert("兑换受阻，请重试！"); }
        }

        async function proceedWithReward(taskData) {
            try {
                let record = currentData; 
                let logs = record.childLogs || []; 
                let baseWin = taskData.price;
                logs.unshift({ time: getFormattedTime(), action: `完成挑战: ${taskData.name}`, amount: baseWin });
                
                let extraMilestoneReward = 0;
                if (taskData.milestone) {
                    extraMilestoneReward = checkMilestoneProgress(taskData.milestone, record, logs);
                }
                
                let totalWin = baseWin + extraMilestoneReward;
                let targetCoins = record.coins + totalWin;
                let maxCap = RANK_DATA[(record.currentRank || 1) - 1].cap;
                let newCoins = Math.min(targetCoins, maxCap);

                let cds = record.cooldowns || {}; cds[taskData.id] = Date.now() + (taskData.hours * 3600000); 

                await dbClient.from('gamedata').update({ coins: newCoins, childLogs: logs.slice(0, 10), cooldowns: cds, milestones: record.milestones, milestoneClaimed: record.milestoneClaimed }).eq('id', ROW_ID);
                currentData.coins = newCoins; currentData.childLogs = logs; currentData.cooldowns = cds;
                localStorage.setItem('andy_last_seen_coins', newCoins); closeRewardModal(); playAttackSequence(totalWin, newCoins);
            } catch (e) { alert("申报异常，请重试"); }
        }

        // 🏰 试炼高塔
        function openGameModal() {
            if (!currentData || !currentData.towerConfig) return;
            [sModal, rModal, lModal, cfModal, rankModal, ctModal, msModal].forEach(m => { if(m) m.style.display = 'none'; });
            gModal.style.display = 'flex'; backToGameMenu();
        }
        function closeGameModal() { quitGameSession(); gModal.style.display = 'none'; }
        
        function backToGameMenu() {
            clearInterval(gameClockTimer); clearInterval(potionTimer); isGameRunning = false;
            document.getElementById('gameMenu').style.display = 'block'; document.getElementById('gamePlay').style.display = 'none'; document.getElementById('gameResult').style.display = 'none';
            
            let schulte = currentData.schulteDaily || { lastDate: "", playCount: 0, winCount: 0 };
            let today = getTodayStr(); let pCount = (schulte.lastDate === today) ? schulte.playCount : 0; let wCount = (schulte.lastDate === today) ? schulte.winCount : 0;
            let cfg = currentData.towerConfig; let freeLeft = Math.max(0, cfg.freePlays - pCount); let rewardLeft = Math.max(0, cfg.maxRewards - wCount);
            
            document.getElementById('gameRemainingCount').innerHTML = `<div style="margin-bottom:8px;">🎫 免费进入剩余: <span style="color:${freeLeft > 0 ? '#27ae60' : '#c0392b'};">${freeLeft}</span> / ${cfg.freePlays}</div><div>🎁 有效领奖剩余: <span style="color:${rewardLeft > 0 ? '#e67e22' : '#c0392b'};">${rewardLeft}</span> / ${cfg.maxRewards}</div>`;
        }

        function attemptStartGame(mode) {
            let schulte = currentData.schulteDaily || { lastDate: "", playCount: 0, winCount: 0 };
            let today = getTodayStr(); let pCount = (schulte.lastDate === today) ? schulte.playCount : 0;
            let cfg = currentData.towerConfig; let requiredTicket = cfg[mode].ticket;
            
            if (pCount >= cfg.freePlays) {
                if (currentData.coins < requiredTicket) { playSound('fuse'); alert("❌ 门票不足！"); return; }
                document.getElementById('confirmText').innerHTML = `🎫 免费次数已用完。<br>开启本次秘境将<span style="color:#c0392b;">消耗 ${requiredTicket} 🪙</span> 门票，确定支付吗？`;
                pendingAction = { actionType: 'schulteTicket', data: { mode: mode } }; cfModal.style.display = 'flex';
            } else { executeStartGame(mode, false); }
        }

        async function executeStartGame(mode, isPaidLocally) {
            try {
                let record = currentData; let today = getTodayStr();
                let schulte = record.schulteDaily; if (schulte.lastDate !== today) { schulte.lastDate = today; schulte.playCount = 0; schulte.winCount = 0; }
                let cfg = record.towerConfig; let requiredTicket = cfg[mode].ticket;
                let newCoins = record.coins; let logs = record.childLogs || [];
                
                let needsPayment = schulte.playCount >= cfg.freePlays;
                if (needsPayment && !isPaidLocally) { alert("⚠️ 数据已刷新，请重新点击进入高塔！"); syncData(); return; }
                if (needsPayment && newCoins < requiredTicket) { alert("❌ 云端校验拦截：余额不足以支付门票！"); syncData(); return; }
                
                if (needsPayment) { newCoins -= requiredTicket; logs.unshift({ time: getFormattedTime(), action: `支付高塔门票 (${mode})`, amount: -requiredTicket }); }
                schulte.playCount += 1;
                
                await dbClient.from('gamedata').update({ coins: newCoins, childLogs: logs.slice(0, 10), schulteDaily: schulte }).eq('id', ROW_ID);
                currentData.coins = newCoins; currentData.childLogs = logs; currentData.schulteDaily = schulte;
                localStorage.setItem('andy_last_seen_coins', newCoins); updateValue(newCoins);
                
                startGameSession(mode);
            } catch(e) { alert("网络异常，无法开启高塔秘境"); }
        }

        function startGameSession(mode) {
            currentTowerMode = mode; currentGameSize = (mode === 'normal') ? 6 : 7;
            nextTargetNum = 1; gameStartTime = Date.now(); comboCount = 0; maxCombo = 0; lastHitTime = gameStartTime; gameTimeRemaining = (mode === 'normal') ? 40 : 75; isGameRunning = true;
            
            document.getElementById('gameModal').style.display = 'flex';
            document.getElementById('gameMenu').style.display = 'none'; document.getElementById('gameResult').style.display = 'none'; document.getElementById('gamePlay').style.display = 'flex';
            document.getElementById('gameTargetNum').innerText = nextTargetNum; document.getElementById('gameTimerText').innerText = gameTimeRemaining;

            let totalCells = currentGameSize * currentGameSize; let numberPool = [];
            for(let i = 1; i <= totalCells; i++) numberPool.push(i);
            for(let i = numberPool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [numberPool[i], numberPool[j]] = [numberPool[j], numberPool[i]]; }

            const gridContainer = document.getElementById('schulteGrid'); gridContainer.style.gridTemplateColumns = `repeat(${currentGameSize}, 1fr)`; gridContainer.innerHTML = '';
            numberPool.forEach(num => { 
                const cell = document.createElement('div'); cell.className = 'schulte-cell'; cell.innerText = num; cell.style.fontSize = currentGameSize === 7 ? '20px' : '24px';
                cell.onclick = () => handleCellClick(cell, num); gridContainer.appendChild(cell); 
            });

            gridContainer.addEventListener('touchstart', function(e) { if (e.touches.length > 1) { e.preventDefault(); triggerAntiCheat(); } }, {passive: false});
            clearInterval(gameClockTimer); clearInterval(potionTimer);
            
            if (mode === 'survival') {
                potionTimer = setInterval(() => {
                    if(!isGameRunning) { clearInterval(potionTimer); return; }
                    let cells = Array.from(document.querySelectorAll('.schulte-cell:not(.correct)'));
                    if(cells.length > 5) {
                        for(let i=0; i<3; i++) {
                            let target = cells[Math.floor(Math.random() * cells.length)];
                            if(!target.classList.contains('debuff')) { target.classList.add('debuff'); setTimeout(() => { target.classList.remove('debuff'); }, 1500); }
                        }
                    }
                }, 2500);
            }

            gameClockTimer = setInterval(() => { gameTimeRemaining--; document.getElementById('gameTimerText').innerText = gameTimeRemaining; if(gameTimeRemaining <= 0) endGameSession(false); }, 1000);
        }

        function showComboText(text) { let el = document.createElement('div'); el.className = 'fly-text'; el.style.color = '#ffb700'; el.style.left = '50%'; el.style.top = '40%'; el.innerText = text; document.body.appendChild(el); setTimeout(() => el.remove(), 1000); }

        function triggerAntiCheat() {
            if(!isGameRunning) return; clearInterval(gameClockTimer); clearInterval(potionTimer); isGameRunning = false;
            document.getElementById('gamePlay').style.display = 'none'; const resultBox = document.getElementById('gameResult'); resultBox.style.display = 'block';
            document.getElementById('gameResultTitle').innerText = "🚨 时空坍塌！"; document.getElementById('gameResultTitle').style.color = "#c0392b";
            document.getElementById('gameResultDesc').innerText = "检测到多指触控作弊！末影人已将高塔封锁，本次门票不予退还！"; document.getElementById('btnGameRetry').innerText = "重新接受试炼"; playSound('explode');
        }

        function handleCellClick(cell, num) {
            if(!isGameRunning || cell.classList.contains('correct')) return;
            if(num === nextTargetNum) {
                cell.classList.add('correct'); clickCoin(); nextTargetNum++;
                let now = Date.now();
                if (now - lastHitTime <= 1500) { comboCount++; if (comboCount > maxCombo) maxCombo = comboCount; if ([5, 10, 15, 20, 30].includes(comboCount)) showComboText("Combo x" + comboCount + "!"); } else comboCount = 1;
                lastHitTime = now;
                if(nextTargetNum > currentGameSize * currentGameSize) endGameSession(true); else document.getElementById('gameTargetNum').innerText = nextTargetNum;
            } else { 
                playSound('fuse'); comboCount = 0; cell.style.backgroundColor = '#c0392b'; cell.style.color = '#fff';
                if(cell.wrongTimeout) clearTimeout(cell.wrongTimeout); cell.wrongTimeout = setTimeout(() => { cell.style.backgroundColor = ''; cell.style.color = ''; }, 200);
            }
        }

        function quitGameSession() { clearInterval(gameClockTimer); clearInterval(potionTimer); isGameRunning = false; backToGameMenu(); }

        async function endGameSession(isWin) {
            clearInterval(gameClockTimer); clearInterval(potionTimer); isGameRunning = false; document.getElementById('gamePlay').style.display = 'none';
            const resultBox = document.getElementById('gameResult'); const rTitle = document.getElementById('gameResultTitle'); const rDesc = document.getElementById('gameResultDesc'); const rBtn = document.getElementById('btnGameRetry');
            resultBox.style.display = 'block'; rBtn.onclick = () => attemptStartGame(currentTowerMode);

            if(!isWin) { playSound('explode'); rTitle.innerText = "⏳ 攀塔超时 (失败)"; rTitle.style.color = "#c0392b"; rDesc.innerHTML = "沙漏空了！你的眼睛搜寻速度慢了一步，潜能未能完全激发。"; rBtn.innerText = "重新尝试攀登"; return; }

            let elapsed = ((Date.now() - gameStartTime) / 1000).toFixed(1); rTitle.innerText = "🎉 挑战成功！"; rTitle.style.color = "#27ae60"; playSound('levelup');

            let schulte = currentData.schulteDaily || { lastDate: "", playCount: 0, winCount: 0 }; let today = getTodayStr();
            if(schulte.lastDate !== today) { schulte.lastDate = today; schulte.playCount = 0; schulte.winCount = 0; }

            let cfg = currentData.towerConfig; let rewardAmt = cfg[currentTowerMode].reward;
            let comboBadge = maxCombo >= 10 ? `<br><br>✨ <span style="color:#8e44ad; font-weight:bold;">隐藏成就：你达到了惊人的最高连击数 [Combo x${maxCombo}]！</span>` : "";

            if(schulte.winCount < cfg.maxRewards) {
                rDesc.innerHTML = `你用时 <span style="color:#e67e22;font-weight:bold;">${elapsed}秒</span> 彻底攻克了高塔层！<br><br>🎁 战利品：<span style="color:#27ae60;font-weight:bold;">+${rewardAmt} 硬币</span> 已注入背包。<br>(今日领奖: ${schulte.winCount + 1}/${cfg.maxRewards}) ${comboBadge}`;
                rBtn.innerText = "继续向上攀登"; await uploadSchulteWin(rewardAmt, currentTowerMode);
            } else {
                rDesc.innerHTML = `你用时 <span style="color:#e67e22;font-weight:bold;">${elapsed}秒</span> 顺利通过高塔试炼！<br><br>⚠️ 提示：今日高塔战利品上限已满。本次攀登不再产出硬币。 ${comboBadge}`;
                rBtn.innerText = "纯粹攀塔模式";
            }
        }

        async function uploadSchulteWin(rewardAmt, mode) {
            try {
                let record = currentData; let today = getTodayStr(); let schulte = record.schulteDaily; 
                if (schulte.lastDate !== today) { schulte.lastDate = today; schulte.playCount = 0; schulte.winCount = 0; }
                schulte.winCount += 1; 
                let newCoins = record.coins + rewardAmt; const maxCap = RANK_DATA[(record.currentRank || 1) - 1].cap; if(newCoins > maxCap) newCoins = maxCap;
                let logs = record.childLogs || []; logs.unshift({ time: getFormattedTime(), action: `高塔试炼通关 (${mode})`, amount: rewardAmt });

                await dbClient.from('gamedata').update({ coins: newCoins, childLogs: logs.slice(0, 10), schulteDaily: schulte }).eq('id', ROW_ID);
                currentData.coins = newCoins; currentData.childLogs = logs; currentData.schulteDaily = schulte; localStorage.setItem('andy_last_seen_coins', newCoins); updateValue(newCoins);
            } catch (e) {}
        }

        // --- 杂项与工具 ---
        async function upgradeRank() {
            if (!currentData || isAnimating) return;
            const rank = currentData.currentRank || 1; const rData = RANK_DATA[rank - 1]; if (currentData.coins < rData.cost) return; 
            const nextRank = rank + 1; const nextRData = RANK_DATA[nextRank - 1]; const newCoins = currentData.coins - rData.cost;
            let logs = currentData.childLogs || []; logs.unshift({ time: getFormattedTime(), action: `突破境界: ${nextRData.title}`, amount: -rData.cost });
            
            try {
                isAnimating = true; playSound('fuse'); document.body.classList.add('shake'); if(uiLayer) uiLayer.style.transform = 'scale(0.95)';
                const dbUpdatePromise = dbClient.from('gamedata').update({ coins: newCoins, currentRank: nextRank, childLogs: logs.slice(0, 10) }).eq('id', ROW_ID);
                setTimeout(async () => {
                    document.body.classList.remove('shake'); playSound('explode'); setTimeout(() => playSound('levelup'), 400); 
                    let flash = document.createElement('div'); flash.className = 'flash-overlay'; document.body.appendChild(flash); setTimeout(() => flash.remove(), 1200);
                    createParticles(80, ['✨', '💎', '💠', '🔥', '⚡', '❇️']); if(uiLayer) { uiLayer.style.opacity = '0'; uiLayer.style.transform = 'scale(1)'; }
                    await dbUpdatePromise; 
                    setTimeout(() => {
                        localStorage.setItem('andy_last_seen_coins', newCoins); currentData.coins = newCoins; currentData.currentRank = nextRank; updateValue(newCoins);
                        let banner = document.createElement('div'); banner.className = 'level-up-banner'; banner.innerHTML = `<div style="font-size:40px; color:#fff;">境界突破</div><div style="font-size:75px; color:${nextRData.color};">${nextRData.title}</div>`; document.body.appendChild(banner); setTimeout(() => banner.remove(), 3500);
                        if(uiLayer) uiLayer.style.opacity = '1'; isAnimating = false;
                    }, 500); 
                }, 1000); 
            } catch (e) { alert("突破受阻！"); isAnimating = false; if(uiLayer) { uiLayer.style.opacity = '1'; uiLayer.style.transform = 'scale(1)'; } document.body.classList.remove('shake'); }
        }

        function openLogModal() { if(lModal) lModal.style.display = 'flex'; } function closeLogModal() { if(lModal) lModal.style.display = 'none'; }
        function renderLogs(logs) {
            const container = document.getElementById('logListContent'); if(!container) return;
            if(logs && logs.length > 0) {
                container.innerHTML = logs.map(log => {
                    let amountClass = log.amount > 0 ? "log-v" : "log-v sub"; if (log.action.includes('🏆')) amountClass = "log-v milestone";
                    const amountText = log.amount > 0 ? '+' + log.amount : log.amount;
                    return `<div class="log-row"><span class="log-t">[${log.time}]</span><span class="log-a">${log.action}</span><span class="${amountClass}">${amountText}</span></div>`;
                }).join('');
            } else container.innerHTML = '<div style="text-align:center; color:#888; padding: 20px 0;">行囊里还没有记录哦~</div>';
        }

        function processCooldowns() {
            if(!currentData || !currentData.cooldowns || !currentData.taskItems) return; const now = Date.now();
            currentData.taskItems.forEach(task => {
                const btn = document.getElementById(`btn-${task.id}`); if (!btn) return;
                const remain = (currentData.cooldowns[task.id] || 0) - now;
                if(remain > 0) {
                    btn.classList.add('in-cd'); const totalMs = (task.hours || 3) * 3600000; btn.style.setProperty('--progress', (remain / totalMs) * 360 + 'deg');
                    const h = Math.floor(remain / 3600000), m = Math.floor((remain % 3600000) / 60000), s = Math.floor((remain % 60000) / 1000);
                    let timerEl = btn.querySelector('.cd-timer'); if(timerEl) timerEl.innerText = `${h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
                } else btn.classList.remove('in-cd');
            });
        }

        function playAttackSequence(amount, finalCoins) {
            isAnimating = true; clearAmbientActors(); if(uiLayer) uiLayer.style.opacity = '0'; 
            if(heroSteve) { heroSteve.style.display = 'block'; heroSteve.style.left = "35%"; } if(heroCreeper) { heroCreeper.style.display = 'block'; heroCreeper.style.right = "35%"; }
            let sword = document.querySelector('.skin-steve .sword'); if(sword) sword.style.display = 'block'; 
            setTimeout(() => { if(sword) sword.classList.add('anim-attack'); playSound('hit'); setTimeout(() => { if(heroCreeper) heroCreeper.classList.add('anim-hurt'); }, 150); }, 500);
            setTimeout(() => { if(heroCreeper) heroCreeper.style.display = 'none'; createParticles(60, '💰'); playSound('levelup'); if(statusMsg) { statusMsg.innerText = `战利品入账！+${amount}`; statusMsg.style.color="#004400"; } }, 1200);
            setTimeout(() => { updateValue(finalCoins); resetStage(); }, 3000);
        }

        function playExplodeSequence(amount, finalCoins, customMsg) {
            isAnimating = true; clearAmbientActors(); if(uiLayer) uiLayer.style.opacity = '0';
            if(heroCreeper) { heroCreeper.style.display = 'block'; heroCreeper.style.right = "45%"; }
            setTimeout(() => { playSound('fuse'); if(heroCreeper) heroCreeper.classList.add('anim-swell'); }, 500);
            setTimeout(() => { if(heroCreeper) heroCreeper.style.opacity = '0'; document.body.classList.add('shake'); createParticles(40, '🟥'); playSound('explode'); if(statusMsg) { statusMsg.innerText = customMsg; statusMsg.style.color = "#8b0000"; } }, 2500);
            setTimeout(() => { document.body.classList.remove('shake'); updateValue(finalCoins); resetStage(); }, 4000);
        }

        function resetStage() { if(uiLayer) uiLayer.style.opacity = '1'; if(heroSteve) heroSteve.style.display = 'none'; if(heroCreeper) { heroCreeper.style.display = 'none'; heroCreeper.style.opacity = '1'; heroCreeper.className='actor skin-creeper'; } isAnimating = false; }
        function updateValue(coins) { if(totalDisplay) totalDisplay.innerText = coins; updateRankUI(coins, currentData ? (currentData.currentRank || 1) : 1); }
        
        function playAmbientScenario() { 
            if (isAnimating || isGameRunning) return; let scenario; do { scenario = Math.floor(Math.random() * 2); } while (scenario === lastScenario); 
            lastScenario = scenario; if (scenario === 0) { spawnActor('skin-villager', 'left', 12); } else { spawnActor('skin-creeper', 'right', 12); } 
        }
        function spawnActor(skinClass, direction, duration) { 
            if (isAnimating || isGameRunning || !stage) return; 
            const el = document.createElement('div'); el.className = `actor ambient-actor ${skinClass}`; el.style.bottom = (22 + Math.floor(Math.random() * 8)) + 'px'; 
            let inner = ''; if(skinClass.includes('creeper')) inner = '<div class="head"><div class="face"></div></div><div class="body"></div><div class="legs"><div class="leg" style="left:0"></div><div class="leg" style="right:0"></div></div>'; else if(skinClass.includes('villager')) inner = '<div class="head"><div class="nose"></div></div><div class="body"></div><div class="arms"></div>';
            el.innerHTML = inner; if (direction === 'left') { el.style.left = '-100px'; el.style.animation = `runLeftToRight ${duration}s linear forwards`; } else { el.style.right = '-100px'; el.style.transform = 'scaleX(-1)'; el.style.animation = `runRightToLeft ${duration}s linear forwards`; } 
            stage.appendChild(el); setTimeout(() => el.remove(), duration * 1000); 
        }
        function clearAmbientActors() { document.querySelectorAll('.ambient-actor').forEach(el => el.remove()); }
        function createParticles(c, chars) { 
            const isArray = Array.isArray(chars);
            for (let i = 0; i < c; i++) { 
                const el = document.createElement('div'); el.classList.add('confetti'); el.innerText = isArray ? chars[Math.floor(Math.random() * chars.length)] : chars; 
                const angle = Math.random() * 360, dist = 50 + Math.random() * 100; el.style.setProperty('--tx', (Math.cos(angle * Math.PI / 180) * dist) + 'vw'); el.style.setProperty('--ty', (Math.sin(angle * Math.PI / 180) * dist) + 'vh'); 
                document.body.appendChild(el); setTimeout(() => el.remove(), 1000); 
            } 
        }
        function clickCoin() { if(!isMuted) { sfxClick.currentTime = 0; sfxClick.play().catch(e=>{}); } }
        function toggleMute() { isMuted = !isMuted; bgm[isMuted ? 'pause' : 'play'](); document.querySelector('.mute-btn').innerText = isMuted ? '🔇' : '🔊'; }
        function playSound(type) { if(isMuted) return; try { if(type === 'levelup') sfxLevelUp.play(); if(type === 'explode') sfxExplode.play(); if(type === 'hit') sfxHit.play(); if(type === 'fuse') sfxFuse.play(); } catch(e){} }
    </script>
</body>
