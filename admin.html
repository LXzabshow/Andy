<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家长控制面板</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px 10px; background: #121212; color: #eee; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 40px;}
        
        /* 卡片折叠引擎样式 */
        .card { background: #1e1e1e; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #333; overflow: hidden; transition: all 0.3s ease; }
        .card-header { padding: 15px 20px; background: #252525; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; border-bottom: 1px solid transparent; transition: background 0.2s; }
        .card-header:active { background: #2a2a2a; }
        .card-header h3 { margin: 0; color: #888; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;}
        .toggle-icon { font-size: 12px; color: #666; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-content { padding: 20px; transition: opacity 0.3s ease; }
        
        /* 💡 修复核心：增加 !important 绝对镇压内联样式 */
        .card.collapsed .toggle-icon { transform: rotate(-90deg); }
        .card.collapsed .card-content { display: none !important; } 
        .card:not(.collapsed) .card-header { border-bottom-color: #333; }

        .rank-info { font-size: 12px; color: #ffb700; background: #333; padding: 3px 8px; border-radius: 4px; font-weight: normal; text-transform: none; letter-spacing: 0;}
        .big-num { font-size: 60px; font-weight: bold; margin: 10px 0 20px 0; color: #ffb700; text-align: center; font-family: 'Courier New', monospace;}
        .cap-text { font-size: 12px; color: #888; text-align: center; margin-top: -15px; margin-bottom: 15px; }
        
        .log-item { background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; border-left: 4px solid #007aff; display: flex; justify-content: space-between; align-items: center;}
        .log-time { color: #888; font-family: monospace; font-size: 11px; margin-right: 8px; min-width: 80px;}
        .log-action { color: #ddd; font-weight: bold; flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .log-amount { color: #27ae60; font-weight: bold; min-width: 30px; text-align: right; }
        .log-amount.sub { color: #e74c3c; }
        .log-amount.milestone { color: #ffb700; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;}
        button { padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-add { background: #1c7a44; color: white; }
        .btn-sub { background: #962d22; color: white; }
        .btn-primary { background: #007aff; color: white; width: 100%; }
        .btn-danger { background: #c0392b; color: white; padding: 8px; font-size: 12px; }
        .btn-edit { background: #f39c12; color: white; padding: 8px; font-size: 12px; }
        .input-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #121212; color: white; font-size: 15px; box-sizing: border-box; }
        
        .flex-row { display: flex; justify-content: space-between; align-items: center; }
        .switch { position: relative; width: 44px; height: 24px; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #34c759; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        #log-status { color: #888; font-size: 12px; text-align: center; padding: 10px; position: fixed; bottom: 0; width: 100%; background: rgba(18,18,18,0.9); backdrop-filter: blur(5px); z-index: 1000;}

        .shop-item { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #444;}
        
        .config-input { width: 60px; padding: 5px; text-align: center; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff;}
        .badge-milestone { background: #8e44ad; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; border: 1px solid #9b59b6;}
        .badge-stamina { background: #2980b9; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; border: 1px solid #3498db;}

        .contract-box { background: #2c3e50; border: 2px dashed #e67e22; border-radius: 8px; padding: 15px; margin-top: 5px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="card" id="card-assets">
            <div class="card-header" onclick="toggleCard('card-assets')">
                <h3>💰 资产余额 <span id="rankBadge" class="rank-info">读取中...</span></h3>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="card-content">
                <div id="currentCoins" class="big-num">...</div>
                <div id="capText" class="cap-text">背包容量上限: ---</div>
                <div>
                    <div style="display:flex; gap:10px; margin-bottom:10px;">
                        <input type="number" id="manualInput" class="input-box" style="flex:1;" placeholder="数额">
                        <input type="text" id="manualReason" class="input-box" style="flex:2;" placeholder="输入增减理由 (选填)">
                    </div>
                    <div class="grid">
                        <button class="btn-add" onclick="manualMod(1)">奖励 (+)</button>
                        <button class="btn-sub" onclick="manualMod(-1)">扣减 (-)</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card" id="card-vitality">
            <div class="card-header" onclick="toggleCard('card-vitality')">
                <h3 style="color:#3498db;">⚡ 体能引擎控制台</h3>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="card-content">
                <div class="flex-row">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span>🚑 医疗伤病冻结</span>
                        <span style="font-size:11px; color:#888;">(开启后每日不扣体力)</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="freezeToggle" onchange="saveVitalityConfig()">
                        <span class="slider"></span>
                    </label>
                </div>
                <div id="vitalityStatusText" style="margin-top:12px; font-size:13px; color:#aaa; text-align:center; background: #2a2a2a; padding: 10px; border-radius: 6px;">当前体力值: 同步中...</div>
            </div>
        </div>

        <div class="card" id="card-contract">
            <div class="card-header" onclick="toggleCard('card-contract')">
                <h3 style="color:#e67e22;">📜 对赌契约审批</h3>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="card-content" id="adminContractArea"></div>
        </div>

        <div class="card" id="card-tasks">
            <div class="card-header" onclick="toggleCard('card-tasks')">
                <h3 style="color:#2ecc71;">⚔️ 任务告示牌管理</h3>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="card-content">
                <div style="display:flex; flex-direction: column; gap: 10px; background: #2a2a2a; padding: 15px; border-radius: 10px; border: 1px solid #444;">
                    <div style="display:flex; gap:10px;">
                        <select id="t_icon" class="input-box" style="flex:1; padding: 12px 5px; text-align: center;">
                            <option value="🏃">🏃</option><option value="🧪">🧪</option><option value="📝">📝</option><option value="🌋">🌋</option><option value="⚡">⚡</option><option value="🪶">🪶</option><option value="📖">📖</option><option value="📚">📚</option><option value="⚔️">⚔️</option><option value="🛡️">🛡️</option><option value="⛏️">⛏️</option><option value="🧹">🧹</option><option value="🧠">🧠</option><option value="🎹">🎹</option>
                        </select>
                        <input type="text" id="t_name" class="input-box" style="flex:3;" placeholder="任务名称">
                    </div>
                    <input type="text" id="t_desc" class="input-box" placeholder="任务规则描述">
                    
                    <select id="t_milestone" class="input-box" style="color: #ffb700; border-color: #8e44ad; background: #1a1a1a;">
                        <option value="">(无进阶属性绑定)</option>
                        <option value="strength">⚔️ 挂载属性: 力量</option>
                        <option value="agility">🪶 挂载属性: 敏捷</option>
                        <option value="endurance">🛡️ 挂载属性: 耐力</option>
                        <option value="intelligence">🧠 挂载属性: 智力</option>
                        <option value="spirit">✨ 挂载属性: 精神</option>
                        <option value="stamina">🌋 挂载属性: 体力</option>
                    </select>

                    <div style="display:flex; gap:10px;">
                        <input type="number" id="t_price" class="input-box" style="flex:1;" placeholder="硬币(+)">
                        <input type="number" id="t_stamina" class="input-box" style="flex:1; border-color:#3498db; background: #1a1a1a;" placeholder="体力(+)" step="0.5">
                        <input type="number" id="t_hours" class="input-box" style="flex:1;" placeholder="冷却(时)">
                    </div>
                    <button id="btn_add_task" class="btn-primary" onclick="addTaskItem()" style="background:#27ae60;">➕ 上架新任务</button>
                </div>
                <div id="adminTaskList" style="margin-top: 15px;"></div>
            </div>
        </div>

        <div class="card collapsed" id="card-shop">
            <div class="card-header" onclick="toggleCard('card-shop')">
                <h3 style="color:#9b59b6;">🛒 神秘商店管理</h3>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="card-content">
                <div style="display:flex; flex-direction: column; gap: 10px; background: #2a2a2a; padding: 15px; border-radius: 10px; border: 1px solid #444;">
                    <div style="display:flex; gap:10px;">
                        <select id="s_icon" class="input-box" style="flex:1; padding: 12px 5px; text-align: center;">
                            <option value="🎫">🎫</option><option value="⚔️">⚔️</option><option value="🛡️">🛡️</option><option value="💎">💎</option><option value="🥇">🥇</option><option value="🔮">🔮</option><option value="⚡">⚡</option><option value="✨">✨</option><option value="📜">📜</option><option value="🍎">🍎</option><option value="🍖">🍖</option><option value="👑">👑</option>
                        </select>
                        <input type="text" id="s_name" class="input-box" style="flex:3;" placeholder="商品名称">
                    </div>
                    <input type="text" id="s_desc" class="input-box" placeholder="兑换权益描述">
                    <div style="display:flex; gap:10px;">
                        <input type="number" id="s_price" class="input-box" style="flex:1;" placeholder="售价(币)">
                        <input type="number" id="s_hours" class="input-box" style="flex:1;" placeholder="时效(小时)">
                    </div>
                    <button class="btn-primary" onclick="addShopItem()">➕ 部署商品</button>
                </div>
                <div id="shopList" style="margin-top: 15px;"></div>
            </div>
        </div>

        <div class="card collapsed" id="card-tower">
            <div class="card-header" onclick="toggleCard('card-tower')">
                <h3 style="color:#d35400;">🏰 高塔法则配置</h3>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="card-content">
                <div style="display:flex; flex-direction:column; gap:12px; font-size: 14px;">
                    <div class="flex-row"><span style="color:#aaa;">每日免费次数:</span><input type="number" id="tc_free" class="config-input"></div>
                    <div class="flex-row"><span style="color:#aaa;">每日领奖上限:</span><input type="number" id="tc_max" class="config-input"></div>
                    <button class="btn-primary" onclick="saveTowerConfig()" style="background:#d35400; margin-top:5px;">💾 覆写高塔法则</button>
                </div>
            </div>
        </div>

        <div class="card collapsed" id="card-logs">
            <div class="card-header" onclick="toggleCard('card-logs')">
                <h3>🕒 全局增减记录</h3>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="card-content" id="childLogList" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>
    <div id="log-status">数据建立握手...</div>

    <script>
        const SUPABASE_URL = 'https://ollnjvnytqmurqxvqtrp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kifp-3_BCphodjxVLIQyow_2cf0WhbB';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentData = null; let editingTaskId = null; const ROW_ID = 1; 

        // 💡 面板本地记忆初始化
        const CARD_IDS = ['card-assets', 'card-vitality', 'card-contract', 'card-tasks', 'card-shop', 'card-tower', 'card-logs'];
        function initCardStates() {
            CARD_IDS.forEach(id => {
                const card = document.getElementById(id);
                const isCollapsed = localStorage.getItem('admin_collapse_' + id);
                if (isCollapsed === 'true') card.classList.add('collapsed');
                else if (isCollapsed === 'false') card.classList.remove('collapsed');
            });
        }
        function toggleCard(cardId) {
            const card = document.getElementById(cardId);
            card.classList.toggle('collapsed');
            localStorage.setItem('admin_collapse_' + cardId, card.classList.contains('collapsed'));
        }
        initCardStates(); // 立即执行防闪烁

        const RANK_DATA = [
            { rank: 1, cap: 200, title: "🪵 新手伐木工" }, { rank: 2, cap: 350, title: "🪨 洞穴探索者" }, { rank: 3, cap: 600, title: "🛡️ 铁甲护卫" },
            { rank: 4, cap: 1000, title: "🥇 寻金探险家" }, { rank: 5, cap: 1500, title: "⚡ 红石工程师" }, { rank: 6, cap: 2500, title: "💎 钻石先锋" },
            { rank: 7, cap: 4000, title: "🔮 黑曜石行者" }, { rank: 8, cap: 6000, title: "🟢 绿宝石领主" }, { rank: 9, cap: 10000, title: "🔥 合金战神" }, { rank: 10, cap: Infinity, title: "🐲 末影屠龙者" }
        ];
        const MILESTONES = [ { count: 5, reward: 50, name: "铁阶" }, { count: 10, reward: 100, name: "金阶" }, { count: 20, reward: 200, name: "钻石" }, { count: 30, reward: 300, name: "绿宝石" }, { count: 50, reward: 500, name: "下界之星" }, { count: 75, reward: 800, name: "龙蛋" }, { count: 100, reward: 1200, name: "终界信标" }, { count: 250, reward: 3000, name: "不死图腾" }, { count: 500, reward: 6000, name: "基岩之心" } ];
        const MS_NAMES = { strength: '力量', agility: '敏捷', endurance: '耐力', intelligence: '智力', spirit: '精神', stamina: '体力' };

        function getFormattedTime() { const now = new Date(); return `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`; }

        async function getCoins() {
            try {
                const { data, error } = await dbClient.from('gamedata').select('*').eq('id', ROW_ID);
                if (error) throw error; if(!data || data.length === 0) return;
                
                currentData = data[0];
                currentData.currentRank = currentData.currentRank || 1;
                currentData.shopItems = currentData.shopItems || [];
                currentData.taskItems = currentData.taskItems || [];
                currentData.vitality = currentData.vitality || { current: 10.0, freeze: false };
                if(!currentData.towerConfig) currentData.towerConfig = { freePlays: 5, maxRewards: 5, normal: { ticket: 1, reward: 2 }, hard: { ticket: 1, reward: 4 }, survival: { ticket: 2, reward: 6 } };
                
                document.getElementById('tc_free').value = currentData.towerConfig.freePlays; 
                document.getElementById('tc_max').value = currentData.towerConfig.maxRewards;
                
                let rData = RANK_DATA[currentData.currentRank - 1];
                document.getElementById('currentCoins').innerText = currentData.coins;
                document.getElementById('rankBadge').innerText = `${rData.title} (Lv.${currentData.currentRank})`;
                document.getElementById('capText').innerText = `当前背包容量上限: ${rData.cap === Infinity ? '无限' : rData.cap}`;
                
                document.getElementById('freezeToggle').checked = currentData.vitality.freeze;
                let displayVit = Number.isInteger(currentData.vitality.current) ? currentData.vitality.current : currentData.vitality.current.toFixed(1);
                document.getElementById('vitalityStatusText').innerText = currentData.vitality.freeze ? `❄️ 医疗冻结中 (体力维持 ${displayVit})` : `当前体力值: ${displayVit} / 10`;

                renderLogs(currentData.childLogs); renderShopItems(currentData.shopItems); renderTaskItems(currentData.taskItems); renderContract(currentData.activeContract);
                document.getElementById('log-status').innerText = "✅ 数据同步良好 - " + new Date().toLocaleTimeString();
            } catch (e) { document.getElementById('log-status').innerText = "❌ 刷新失败: " + e.message; }
        }

        async function saveVitalityConfig() {
            if(!currentData) return;
            currentData.vitality.freeze = document.getElementById('freezeToggle').checked;
            await dbClient.from('gamedata').update({ vitality: currentData.vitality }).eq('id', ROW_ID);
            document.getElementById('log-status').innerText = "✅ 医疗冻结状态已保存";
        }

        function renderContract(contract) {
            const container = document.getElementById('adminContractArea');
            if(!contract) { container.innerHTML = '<div style="text-align:center; color:#555; padding:15px;">暂无进行中的契约</div>'; return; }
            if(contract.status === 'pending') {
                container.innerHTML = `
                    <div class="contract-box">
                        <div style="color:#f1c40f; font-weight:bold; margin-bottom:10px;">⚠️ 收到新契约申请</div>
                        <div style="margin-bottom:8px;">🎯 目标: <span style="color:#fff;">${contract.desc}</span></div>
                        <div style="margin-bottom:15px;">💰 已扣除质押: <span style="color:#e74c3c;">-${contract.wager} 币</span></div>
                        <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
                            <span style="color:#2ecc71;">修改胜利奖金:</span>
                            <input type="number" id="contract_reward_mod" class="input-box" style="width:80px; padding:5px; text-align:center;" value="${contract.wager}">
                        </div>
                        <div style="display:flex; gap:10px;"><button class="btn-primary" style="flex:1; background:#e74c3c;" onclick="processContract(false)">驳回(退钱)</button><button class="btn-primary" style="flex:1; background:#27ae60;" onclick="processContract(true)">批准</button></div>
                    </div>`;
            } else if (contract.status === 'active') {
                container.innerHTML = `
                    <div class="contract-box" style="border-color:#27ae60;">
                        <div style="color:#27ae60; font-weight:bold; margin-bottom:10px;">🔥 契约执行中</div>
                        <div style="margin-bottom:8px;">🎯 目标: <span style="color:#fff;">${contract.desc}</span></div>
                        <div style="margin-bottom:8px;">💰 已质押: <span style="color:#aaa;">${contract.wager} 币</span></div>
                        <div style="margin-bottom:15px;">🎁 成功奖金: <span style="color:#2ecc71; font-weight:bold;">${contract.reward} 币</span></div>
                        <div style="display:flex; gap:10px;"><button class="btn-primary" style="flex:1; background:#c0392b;" onclick="settleContract(false)">失败吞没</button><button class="btn-primary" style="flex:1; background:#27ae60;" onclick="settleContract(true)">判定成功</button></div>
                    </div>`;
            }
        }

        async function processContract(isApprove) {
            let record = currentData; let logs = record.childLogs || []; let payload = {};
            if(isApprove) {
                let rAmt = parseInt(document.getElementById('contract_reward_mod').value);
                record.activeContract.status = 'active'; record.activeContract.reward = rAmt; payload.activeContract = record.activeContract;
                logs.unshift({ time: getFormattedTime(), action: `⚖️ 契约生效 (定额奖金 ${rAmt})`, amount: 0 });
            } else {
                let wager = record.activeContract.wager; let newCoins = record.coins + wager; payload.activeContract = null; payload.coins = Math.min(newCoins, RANK_DATA[(record.currentRank||1)-1].cap);
                logs.unshift({ time: getFormattedTime(), action: `⚖️ 契约遭驳回 (退还质押)`, amount: wager });
            }
            payload.childLogs = logs.slice(0, 10); await dbClient.from('gamedata').update(payload).eq('id', ROW_ID); getCoins();
        }

        async function settleContract(isSuccess) {
            let record = currentData; let contract = record.activeContract; let logs = record.childLogs || []; let payload = { activeContract: null }; let newCoins = record.coins;
            if (isSuccess) {
                let winAmount = contract.wager + contract.reward; newCoins += winAmount;
                logs.unshift({ time: getFormattedTime(), action: `✅ 契约完成: ${contract.desc}`, amount: winAmount });
                record.milestones.endurance++; let count = record.milestones.endurance;
                for (let tier of MILESTONES) { if (count === tier.count && !record.milestoneClaimed.endurance.includes(tier.count)) { newCoins += tier.reward; record.milestoneClaimed.endurance.push(tier.count); logs.unshift({ time: getFormattedTime(), action: `🏆 达成里程碑 [耐力]: ${tier.name}`, amount: tier.reward }); } }
                payload.milestones = record.milestones; payload.milestoneClaimed = record.milestoneClaimed;
            } else { logs.unshift({ time: getFormattedTime(), action: `❌ 契约违约 (质押被深渊吞噬)`, amount: 0 }); }
            payload.coins = Math.min(newCoins, RANK_DATA[(record.currentRank||1)-1].cap); payload.childLogs = logs.slice(0, 10);
            await dbClient.from('gamedata').update(payload).eq('id', ROW_ID); getCoins();
        }

        async function saveTowerConfig() {
            const conf = currentData.towerConfig;
            conf.freePlays = parseInt(document.getElementById('tc_free').value) || 0; conf.maxRewards = parseInt(document.getElementById('tc_max').value) || 0;
            await dbClient.from('gamedata').update({ towerConfig: conf }).eq('id', ROW_ID); alert("✅ 高塔法则保存成功！"); getCoins();
        }

        function renderLogs(logs) {
            const container = document.getElementById('childLogList');
            if(logs && logs.length > 0) {
                container.innerHTML = logs.map(log => {
                    let amountClass = log.amount > 0 ? "log-amount" : "log-amount sub"; if (log.action.includes('🏆')) amountClass = "log-amount milestone";
                    let txt = typeof log.amount === 'string' ? log.amount : (log.amount > 0 ? '+' + log.amount : log.amount);
                    return `<div class="log-item"><span class="log-time">[${log.time}]</span><span class="log-action">${log.action}</span><span class="${amountClass}">${txt}</span></div>`;
                }).join('');
            } else { container.innerHTML = '<div style="text-align:center; color:#555; padding:20px;">暂无记录</div>'; }
        }

        function renderTaskItems(items) {
            const container = document.getElementById('adminTaskList');
            if(items.length === 0) { container.innerHTML = '<div style="text-align:center; color:#555; padding:10px;">告示牌空空如也</div>'; return; }
            container.innerHTML = items.map((item, index) => `
                <div class="shop-item" style="border-color: #27ae60;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                        <div style="flex:1;">
                            <div style="font-weight:bold; font-size:15px; color:#2ecc71;">${item.icon} ${item.name} 
                                ${item.milestone ? `<span class="badge-milestone">属性: ${MS_NAMES[item.milestone]}</span>` : ''}
                                ${item.stamina_val ? `<span class="badge-stamina">⚡ +${item.stamina_val}</span>` : ''}
                            </div>
                            <div style="font-size:12px; color:#aaa; margin:4px 0;">${item.desc}</div>
                            <div style="font-size:12px; color:#27ae60;">🪙 +${item.price} 币 | ⏳ 冷却: ${item.hours} 小时</div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 6px; justify-content: flex-end; border-top: 1px dashed #444; padding-top: 8px;">
                        <button class="btn-primary" style="background: #2980b9; padding: 6px; font-size: 13px; flex: 1;" onclick="moveTaskItem(${index}, -1)">🔼</button>
                        <button class="btn-primary" style="background: #2980b9; padding: 6px; font-size: 13px; flex: 1;" onclick="moveTaskItem(${index}, 1)">🔽</button>
                        <button class="btn-edit" style="padding: 6px 12px; font-size: 13px; flex: 2;" onclick="prepareEditTask('${item.id}')">✏️ 修改</button>
                        <button class="btn-danger" style="padding: 6px 12px; font-size: 13px; flex: 2;" onclick="deleteTaskItem('${item.id}')">🗑️ 删</button>
                    </div>
                </div>`).join('');
        }

        async function moveTaskItem(index, direction) {
            let items = currentData.taskItems; let t = index + direction; if (t < 0 || t >= items.length) return;
            [items[index], items[t]] = [items[t], items[index]]; renderTaskItems(items);
            await dbClient.from('gamedata').update({ taskItems: items }).eq('id', ROW_ID);
        }

        function prepareEditTask(id) {
            const task = currentData.taskItems.find(t => t.id === id); if(!task) return;
            editingTaskId = id;
            document.getElementById('t_icon').value = task.icon; document.getElementById('t_name').value = task.name; document.getElementById('t_desc').value = task.desc;
            document.getElementById('t_milestone').value = task.milestone || ''; document.getElementById('t_price').value = task.price; document.getElementById('t_hours').value = task.hours;
            document.getElementById('t_stamina').value = task.stamina_val || 0;
            const btn = document.getElementById('btn_add_task'); btn.innerHTML = '💾 保存修改'; btn.style.background = '#8e44ad';
            btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function addTaskItem() {
            const icon = document.getElementById('t_icon').value; const name = document.getElementById('t_name').value.trim(); const desc = document.getElementById('t_desc').value.trim();
            const milestone = document.getElementById('t_milestone').value; const price = parseInt(document.getElementById('t_price').value); const hours = parseFloat(document.getElementById('t_hours').value);
            const stamina_val = parseFloat(document.getElementById('t_stamina').value) || 0;
            if(!name || !desc || !price || !hours) return alert("请完整填写任务信息！");

            let items = currentData.taskItems || [];
            if (editingTaskId) {
                let idx = items.findIndex(t => t.id === editingTaskId);
                if(idx > -1) items[idx] = { id: editingTaskId, icon, name, desc, milestone, price, hours, stamina_val };
                editingTaskId = null;
                const btn = document.getElementById('btn_add_task'); btn.innerHTML = '➕ 上架新任务'; btn.style.background = '#27ae60';
            } else {
                items.push({ id: 'task_' + Date.now(), icon, name, desc, milestone, price, hours, stamina_val });
            }

            document.getElementById('t_name').value = ''; document.getElementById('t_desc').value = ''; document.getElementById('t_stamina').value = '';
            document.getElementById('log-status').innerText = "上架/更新中...";
            await dbClient.from('gamedata').update({ taskItems: items }).eq('id', ROW_ID); getCoins();
        }

        async function deleteTaskItem(id) { if(!confirm("确定下架此项任务吗？")) return; let items = currentData.taskItems.filter(i => i.id !== id); await dbClient.from('gamedata').update({ taskItems: items }).eq('id', ROW_ID); getCoins(); }

        function renderShopItems(items) {
            const container = document.getElementById('shopList');
            if(items.length === 0) { container.innerHTML = '<div style="text-align:center; color:#555; padding:10px;">货架空空如也</div>'; return; }
            container.innerHTML = items.map(item => `<div class="shop-item" style="flex-direction: row; align-items: center;"><div style="flex:1;"><div style="font-weight:bold; font-size:15px; color:#ffb700;">${item.icon} ${item.name}</div><div style="font-size:12px; color:#aaa; margin:4px 0;">${item.desc}</div><div style="font-size:12px; color:#27ae60;">💰 ${item.price} 币 | ⏳ ${item.hours} 小时</div></div><button class="btn-danger" onclick="deleteShopItem('${item.id}')">下架</button></div>`).join('');
        }
        async function addShopItem() {
            const icon = document.getElementById('s_icon').value; const name = document.getElementById('s_name').value.trim(); const desc = document.getElementById('s_desc').value.trim(); const price = parseInt(document.getElementById('s_price').value); const hours = parseFloat(document.getElementById('s_hours').value);
            if(!name || !desc || !price || !hours) return alert("请完整填写！");
            let items = currentData.shopItems || []; items.push({ id: 'shop_' + Date.now(), icon, name, desc, price, hours });
            await dbClient.from('gamedata').update({ shopItems: items }).eq('id', ROW_ID); getCoins();
        }
        async function deleteShopItem(id) { let items = currentData.shopItems.filter(i => i.id !== id); await dbClient.from('gamedata').update({ shopItems: items }).eq('id', ROW_ID); getCoins(); }

        async function modifyCoins(amount, reason) {
            if (amount === 0) return; let maxCap = RANK_DATA[(currentData.currentRank || 1) - 1].cap; let targetCoins = currentData.coins + amount; let finalCoins = Math.max(0, Math.min(targetCoins, maxCap)); let actualDelta = finalCoins - currentData.coins;
            if (actualDelta === 0) return; let logs = currentData.childLogs || []; logs.unshift({ time: getFormattedTime(), action: reason || (amount > 0 ? "手动奖励" : "手动扣减"), amount: actualDelta });
            await dbClient.from('gamedata').update({ coins: finalCoins, childLogs: logs.slice(0, 10) }).eq('id', ROW_ID); getCoins();
        }
        function manualMod(sign) { let val = parseInt(document.getElementById('manualInput').value); if(val > 0) { modifyCoins(val * sign, document.getElementById('manualReason').value.trim()); document.getElementById('manualInput').value = ""; document.getElementById('manualReason').value = ""; } }

        window.onload = () => { getCoins(); setInterval(getCoins, 5000); };
    </script>
</body>
</html>
