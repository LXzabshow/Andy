jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -X GET "https://ykbvwvhmvmzdzqrdibct.supabase.co/rest/v1/exam_scores?select=id&limit=1" \
          -H "apikey: sb_publishable_zcVIJ86gQsYO3clU-HjAfA_e62kSSqj" \
          -H "Authorization: Bearer sb_publishable_zcVIJ86gQsYO3clU-HjAfA_e62kSSqj"
