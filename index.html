<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Andy的冒险背包</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'VT323', monospace; text-align: center; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; transition: background 1.5s ease; image-rendering: pixelated; background-size: 64px 64px; }
        
        /* 💡 视差滚动地面引擎 */
        .ground {
            position: absolute; bottom: 0; width: 100%; height: 26px; z-index: 20;
            background-color: #5D4037;
            background-image: 
                linear-gradient(90deg, #4CAF50 50%, #388E3C 50%),
                repeating-linear-gradient(90deg, #5D4037 0px, #5D4037 16px, #4E342E 16px, #4E342E 32px);
            background-size: 32px 6px, 32px 20px;
            background-position: 0 0, 0 6px;
            background-repeat: repeat-x;
            border-top: 2px solid #2E7D32;
            animation: groundScroll 0.8s linear infinite;
        }
        .ground.paused { animation-play-state: paused !important; }
        @keyframes groundScroll {
            from { background-position: 0 0, 0 6px; }
            to { background-position: -32px 0, -32px 6px; }
        }

        .stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 15;}
        .actor { position: absolute; bottom: 26px; transition: transform 0.1s; z-index: 30; }
        
        .ui-container { margin-top: 3.5vh; width: 92%; max-width: 400px; z-index: 100; position: relative; transition: opacity 0.5s ease, transform 0.2s ease;}
        
        .card { background-color: var(--card-bg, #c6c6c6); border: 5px solid var(--card-border, #000); box-shadow: var(--card-glow, inset 4px 4px rgba(255,255,255,0.4), inset -4px -4px rgba(0,0,0,0.4)); padding: 14px; position: relative; transition: all 0.8s ease; }
        
        @keyframes pulse-redstone { 0% { box-shadow: 0 0 10px #ff0000, inset 0 0 10px #ff0000, inset 4px 4px rgba(255,255,255,0.2), inset -4px -4px rgba(0,0,0,0.4); } 50% { box-shadow: 0 0 30px #ff0000, inset 0 0 20px #ff0000, inset 4px 4px rgba(255,255,255,0.2), inset -4px -4px rgba(0,0,0,0.4); } 100% { box-shadow: 0 0 10px #ff0000, inset 0 0 10px #ff0000, inset 4px 4px rgba(255,255,255,0.2), inset -4px -4px rgba(0,0,0,0.4); } }
        @keyframes pulse-end { 0% { box-shadow: 0 0 20px #8e44ad, inset 0 0 20px #8e44ad; border-color: #2c3e50; } 50% { box-shadow: 0 0 50px #ff00ff, inset 0 0 40px #ff00ff; border-color: #8e44ad; } 100% { box-shadow: 0 0 20px #8e44ad, inset 0 0 20px #8e44ad; border-color: #2c3e50; } }
        .glow-redstone { animation: pulse-redstone 2s infinite; }
        .glow-end { animation: pulse-end 3s infinite; }

        h2 { color: #ffffff; margin: 0 0 5px 0; font-size: 28px; text-shadow: 3px 3px #000; letter-spacing: 2px; }
        
        .rank-badge { background: #222; color: #ffb700; padding: 4px 12px; border: 2px solid #fff; display: inline-block; margin-bottom: 8px; font-size: 18px; border-radius: 4px; box-shadow: 2px 2px #000; cursor: pointer; text-shadow: 1px 1px 0px #000; font-weight: bold;}
        .rank-badge:active { transform: scale(0.95); }
        .rank-badge::after { content: ' 🔍'; font-size: 14px; opacity: 0.8; }
        
        .slot { background: #8b8b8b; width: 66px; height: 66px; margin: 0; border: 4px solid #373737; border-right-color: #fff; border-bottom-color: #fff; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; flex-shrink: 0;}
        .slot:active .coin-icon { transform: scale(0.8); }
        .coin-icon { font-size: 38px; filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.5)); z-index: 2; transition: transform 0.1s;}
        .total { font-size: 52px; color: #fff; font-weight: bold; text-shadow: 4px 4px 0px #333; margin: 0; line-height: 1; flex-shrink: 0;}

        #activeBuffsContainer { width: 100%; display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
        .buff-pill { background: rgba(0,0,0,0.75); border: 2px solid #ffb700; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-family: -apple-system, sans-serif; font-weight: bold; text-shadow: 1px 1px #000; display: flex; justify-content: space-between; align-items: center; animation: glow 2s infinite alternate;}
        @keyframes glow { from { box-shadow: 0 0 5px #ffb700; } to { box-shadow: 0 0 15px #ffb700, 0 0 5px #ffb700 inset; } }

        .health-bar-container { width: 100%; margin-top: 8px; padding: 0 5px; box-sizing: border-box; }
        .health-bar-label { font-size: 14px; color: #fff; font-weight: bold; margin-bottom: 4px; text-shadow: 2px 2px #000; display:flex; justify-content: space-between; align-items: flex-end;}
        .health-bar-bg { width: 100%; height: 15px; background-color: #333; border: 3px solid #000; position: relative; box-shadow: inset 2px 2px #111, inset -2px -2px #555; overflow: hidden;}
        .health-bar-fill { height: 100%; background-color: #e70000; width: 0%; transition: width 0.8s; box-shadow: inset 0px 4px 0px rgba(255,255,255,0.3); }
        .health-bar-fill.safe { background-color: #2ecc71; } .health-bar-fill.warn { background-color: #f1c40f; }

        .vitality-container { display:flex; width:100%; height:16px; border:3px solid #000; background:#222; padding:2px; box-sizing:border-box; box-shadow: inset 2px 2px #111, inset -2px -2px #555;}
        @keyframes flash-danger { 0% { opacity: 1; } 50% { opacity: 0.5; filter: brightness(2); } 100% { opacity: 1; } }

        .vitality-clickable { cursor: pointer; transition: transform 0.1s; }
        .vitality-clickable:active { transform: scale(0.98); }

        .btn-upgrade { width: 100%; margin-top: 8px; padding: 9px; font-family: 'VT323', monospace; font-size: 18px; font-weight: bold; color: white; background: #d35400; border: 4px solid #000; cursor: pointer; animation: pulse 2s infinite;}
        .btn-upgrade:disabled { background: #7f8c8d; cursor: not-allowed; animation: none; filter: grayscale(1); border-color:#555;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        
        .main-btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .btn-main-action { position: relative; width: 100%; padding: 10px 0; font-family: inherit; font-size: 16px; font-weight: bold; color: white; background: #27ae60; border: 4px solid #000; cursor: pointer; box-shadow: inset 2px 2px rgba(255,255,255,0.3), inset -2px -2px rgba(0,0,0,0.3); }
        .btn-main-action:active:not(:disabled) { transform: scale(0.95); }
        .btn-shop { background: #e67e22; }
        .btn-game { background: #8e44ad; }
        .btn-log { background: #7f8c8d; }
        .btn-contract { background: #c0392b; }
        .btn-contract.contract-active { border-color: #ffb700; box-shadow: 0 0 12px #ffb700, inset 2px 2px rgba(255,255,255,0.4); }
        .btn-milestone { background: #2980b9; }

        .status-bar { background: rgba(0,0,0,0.8); color: #fff; padding: 3px 10px; border-radius: 4px; font-size: 12px; display: inline-flex; align-items: center; margin-top: 6px; border: 2px solid #555; }
        .light { width: 8px; height: 8px; background: #e74c3c; margin-right: 8px; } .light.online { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .message { color: #fff; margin-top: 4px; font-size: 14px; height: 18px; text-shadow: 2px 2px #000; font-weight: bold;}
        .mute-btn { position: absolute; top: 10px; right: 10px; font-size: 24px; cursor: pointer; color: #fff; text-shadow: 2px 2px #000;}

        /* 🎁 飘浮空投宝箱样式 */
        #treasure-chest { position: fixed; top: 12%; left: 50%; font-size: 52px; z-index: 250; cursor: pointer; display: none; filter: drop-shadow(0 0 12px #ffb700); transition: left 2.5s ease-in-out, top 2.5s ease-in-out; }
        .chest-float-anim { animation: bobbing 1s infinite alternate; }
        @keyframes bobbing { from { transform: translateY(0) scale(1); } to { transform: translateY(-8px) scale(1.08); } }
        .challenge-q { font-size: 15px; color: #000; margin: 12px 0; font-weight: bold; background: #fff; padding: 10px; border: 2px solid #555; white-space: pre-wrap; text-align: left; max-height: 200px; overflow-y: auto; font-family: -apple-system, sans-serif;}
        .challenge-input { font-family: 'VT323', monospace; font-size: 24px; padding: 6px; width: 85%; text-align: center; border: 3px solid #000; margin-bottom: 12px; background: #fff;}
        .btn-submit { background: #27ae60; color: white; padding: 10px 20px; border: 3px solid #000; font-family: inherit; font-size: 20px; cursor: pointer; width: 100%; font-weight: bold;}

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 400; display: none; justify-content: center; align-items: center; padding: 10px;}
        .challenge-card { background: #c6c6c6; border: 4px solid #000; box-shadow: inset 4px 4px #fff, inset -4px -4px #555; padding: 15px; width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; max-height: 90vh;}
        .challenge-title { font-size: 26px; color: #333; margin-bottom: 10px; text-shadow: 1px 1px #fff; flex-shrink: 0;}
        .btn-close-modal { background: #c0392b; color: white; padding: 10px 20px; border: 2px solid #000; font-family: inherit; font-size: 20px; cursor: pointer; margin-top: 10px; width: 100%; flex-shrink: 0;}

        .reward-grid { display: grid; grid-template-columns: 1fr; gap: 10px; width: 100%; overflow-y: auto; padding-right: 5px;}
        .mc-item-btn { position: relative; background: #8b8b8b; border: 3px solid #000; border-right-color: #fff; border-bottom-color: #fff; padding: 10px; cursor: pointer; text-align: left; }
        .mc-item-btn:active:not(.in-cd) { transform: scale(0.98); }
        .mc-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; gap: 5px;}
        .mc-item-title { font-size: 16px; color: #000; font-weight: bold; text-shadow: 1px 1px #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; line-height: 1.2;}
        .mc-item-reward { color: #004400; font-weight: bold; font-size: 20px; text-shadow: 1px 1px #fff; white-space: nowrap;}
        .mc-item-desc { font-family: -apple-system, sans-serif; font-size: 13px; color: #222; line-height: 1.3; }
        .badge { background: #8e44ad; color: #fff; font-size: 10px; padding: 2px 4px; border-radius: 4px; font-family: -apple-system, sans-serif;}
        
        .cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; background: conic-gradient(rgba(0,0,0,0.7) var(--progress), transparent 0deg); }
        .cd-timer { position: absolute; bottom: 6px; right: 8px; color: #fff; font-size: 16px; font-weight: bold; text-shadow: 1px 1px #000; display: none; }
        .in-cd { cursor: not-allowed; opacity: 0.8; } .in-cd .cd-overlay, .in-cd .cd-timer { display: block; }

        .rank-list-item { background: #fff; border: 2px solid #555; padding: 12px; margin-bottom: 10px; border-radius: 6px; text-align: left; font-family: -apple-system, sans-serif; display: block; box-shadow: 2px 2px 0px rgba(0,0,0,0.2); }
        .rank-list-item.unlocked { border-left-width: 6px; border-left-style: solid; background: #f0f8ff; }
        .rank-list-item.next-target { border: 3px dashed #e67e22; background: #fffdf5; box-shadow: inset 0 0 15px rgba(230,126,34,0.2); }
        .rank-list-item.locked { background: #d5d5d5; opacity: 0.6; filter: grayscale(1); border: 2px solid #888; }
        .r-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; color: #000; text-shadow: none;}
        .r-desc { font-size: 13px; color: #333; line-height: 1.4; text-shadow: none;}
        .r-cost { font-size: 14px; font-weight: bold; color: #c0392b; margin-top: 5px; text-shadow: none;}

        .log-container { max-height: 250px; overflow-y: auto; text-align: left; background: #fff; border: 2px solid #555; padding: 10px; font-family: -apple-system, sans-serif; font-size: 13px; }
        .log-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #ccc; }
        .log-t { color: #888; font-size: 11px; min-width: 75px;}
        .log-a { font-weight: bold; color: #333; flex: 1; margin: 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        .log-v { font-weight: bold; color: #27ae60; text-align: right; min-width: 30px;} .log-v.sub { color: #e74c3c; } .log-v.milestone { color: #ffb700; }

        .ms-card { background: #e0e0e0; border: 2px solid #555; padding: 10px; margin-bottom: 10px; border-radius: 4px; text-align: left; font-family: -apple-system, sans-serif;}
        .ms-header { display: flex; justify-content: space-between; font-weight: bold; color: #2c3e50; font-size: 15px; margin-bottom: 5px;}
        .ms-tier { color: #e67e22; font-size: 12px; font-weight: bold;}
        .ms-bar-bg { width: 100%; height: 12px; background: #bdc3c7; border-radius: 6px; overflow: hidden; }
        .ms-bar-fill { height: 100%; background: #2980b9; width: 0%; transition: width 0.5s; }

        .mc-input { width: 100%; padding: 10px; font-family: -apple-system, sans-serif; font-size: 15px; border: 2px solid #333; background: #fff; margin-bottom: 10px; box-sizing: border-box;}
        textarea.mc-input { resize: vertical; min-height: 80px; }
        
        #schulteGrid { display: grid; width: 100%; aspect-ratio: 1; gap: 4px; background: #373737; padding: 5px; border: 4px solid #000; touch-action: none; }
        .schulte-cell { background: #c6c6c6; border: 3px solid #000; box-shadow: inset 2px 2px #fff, inset -2px -2px #555; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; cursor: pointer; aspect-ratio: 1; transition: transform 0.05s, filter 0.3s; }
        .schulte-cell:active { transform: scale(0.92); }
        .schulte-cell.correct { background: #2ecc71 !important; color: #fff !important; cursor: not-allowed !important; filter: none !important;}
        .schulte-cell.debuff { background: #111 !important; color: #444 !important; filter: blur(1px); }

        .fly-text { position: fixed; z-index: 1000; font-family: 'VT323', monospace; font-size: 40px; font-weight: bold; text-shadow: 2px 2px #000, -2px -2px #000; pointer-events: none; animation: floatUp 1s forwards; }
        @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; } 20% { transform: translate(-50%, -20px) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -60px) scale(1); opacity: 0; } }

        /* ========================================================
           ⚔️ 横版挂机 RPG 引擎：史蒂夫单手持武与怪物单手持武模型
           ======================================================== */
        .skin-steve { width: 44px; height: 100px; left: 28%; bottom: 26px; z-index: 40; transition: left 0.3s ease; }
        .skin-steve .head { width: 36px; height: 36px; background: #F8B090; position: absolute; top: 0; left: 4px; z-index: 3; border: 2px solid #222; }
        .skin-steve .hair { width: 36px; height: 10px; background: #452613; position: absolute; top: 0; left: 0; z-index: 4; }
        .skin-steve .eyes { position: absolute; top: 16px; right: 4px; width: 14px; height: 5px; background: linear-gradient(90deg, #fff 50%, #303090 50%); z-index: 4; }
        /* 动态头盔 */
        .skin-steve .helmet { position: absolute; top: -3px; left: 2px; width: 40px; height: 18px; z-index: 5; border: 2px solid #000; display: none; box-shadow: inset 0 3px rgba(255,255,255,0.4); }
        /* 身体与胸甲 */
        .skin-steve .body { width: 30px; height: 36px; background: #00AAAA; position: absolute; top: 36px; left: 7px; z-index: 2; border: 2px solid #222; box-shadow: inset 0 4px rgba(255,255,255,0.25); }
        /* 💡 前置手臂：单手武器直接绑定在手臂末端手部位置 */
        .skin-steve .arm { width: 12px; height: 30px; background: #00AAAA; position: absolute; top: 38px; left: 16px; z-index: 6; border: 2px solid #222; transform-origin: 6px 4px; transform: rotate(-28deg); box-shadow: inset 0 -6px #F8B090; }
        .skin-steve .weapon-hand { position: absolute; bottom: -6px; left: 2px; width: 34px; height: 34px; transform-origin: 6px 28px; transform: rotate(22deg); pointer-events: none; z-index: 8; }
        .skin-steve .weapon-hand svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }

        /* 双腿与迈步动画 */
        .skin-steve .leg-l, .skin-steve .leg-r { width: 13px; height: 28px; background: #303090; position: absolute; top: 72px; left: 15px; border: 2px solid #111; transform-origin: 50% 0%; }
        .skin-steve .leg-l { z-index: 1; filter: brightness(0.78); }
        .skin-steve .leg-r { z-index: 3; }
        
        .skin-steve.walking .leg-l { animation: walkLegL 0.45s ease-in-out infinite alternate; }
        .skin-steve.walking .leg-r { animation: walkLegR 0.45s ease-in-out infinite alternate; }
        .skin-steve.walking .arm { animation: walkArm 0.45s ease-in-out infinite alternate; }
        .skin-steve.walking { animation: walkBob 0.22s ease-in-out infinite alternate; }

        @keyframes walkLegL { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
        @keyframes walkLegR { from { transform: rotate(28deg); } to { transform: rotate(-28deg); } }
        @keyframes walkArm { from { transform: rotate(-12deg); } to { transform: rotate(-42deg); } }
        @keyframes walkBob { from { transform: translateY(0); } to { transform: translateY(-3px); } }

        /* 💡 手臂带动单手武器劈砍与刀光动画 */
        .skin-steve .slash-fx { position: absolute; top: 18px; right: -46px; width: 42px; height: 60px; border-right: 6px solid #fff; border-radius: 50%; opacity: 0; z-index: 9; pointer-events: none; filter: drop-shadow(0 0 8px #00ffff); }
        .anim-arm-attack { animation: armChop 0.32s cubic-bezier(0.2, 0.8, 0.4, 1) forwards !important; }
        .anim-slash { animation: slashArc 0.32s ease-out forwards; }
        @keyframes armChop {
            0% { transform: rotate(-28deg); }
            30% { transform: rotate(-95deg); }
            65% { transform: rotate(22deg); }
            100% { transform: rotate(-28deg); }
        }
        @keyframes slashArc { 0% { opacity: 0; transform: scale(0.5) rotate(-30deg); } 40% { opacity: 1; transform: scale(1.1) rotate(10deg); } 100% { opacity: 0; transform: scale(1.3) rotate(35deg); } }

        /* 👾 巡逻怪物通用像素模型与单手武器绑定 */
        .patrol-mob { position: absolute; bottom: 26px; z-index: 35; display: flex; flex-direction: column; align-items: center; transition: filter 0.1s; }
        .patrol-mob.flying { bottom: 68px; animation: mobHover 0.8s ease-in-out infinite alternate; }
        @keyframes mobHover { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        
        .mob-tag { background: rgba(0,0,0,0.75); color: #fff; font-size: 13px; padding: 1px 6px; border-radius: 3px; border: 1px solid #555; white-space: nowrap; margin-bottom: 3px; text-shadow: 1px 1px #000; }
        .mob-hp-bar { display: flex; gap: 2px; background: #111; padding: 2px; border: 2px solid #000; margin-bottom: 5px; }
        .mob-hp-seg { width: 12px; height: 6px; background: #e74c3c; transition: background 0.15s; }
        .mob-hp-seg.empty { background: #333; }

        .mob-sprite { position: relative; display: flex; flex-direction: column; align-items: center; transform-origin: bottom center; }
        .mob-walking .mob-sprite { animation: mobBounce 0.32s ease-in-out infinite alternate; }
        @keyframes mobBounce { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-4px) rotate(2deg); } }

        .mob-head { width: 34px; height: 34px; border: 2px solid #111; position: relative; box-shadow: inset -3px -3px rgba(0,0,0,0.35); z-index: 3; }
        .mob-eye-l, .mob-eye-r { position: absolute; top: 14px; width: 6px; height: 6px; }
        .mob-eye-l { left: 4px; } .mob-eye-r { left: 16px; }
        .mob-mouth { position: absolute; bottom: 5px; left: 7px; width: 12px; height: 5px; background: #111; }
        .mob-body { width: 28px; height: 34px; border: 2px solid #111; border-top: none; position: relative; box-shadow: inset -3px -3px rgba(0,0,0,0.35); z-index: 2; }
        .mob-legs { display: flex; gap: 4px; justify-content: center; z-index: 1; }
        .mob-leg { width: 11px; height: 22px; border: 2px solid #111; border-top: none; }
        
        /* 💡 怪物前置手臂与单手武器槽（朝左指向史蒂夫） */
        .mob-arm { position: absolute; top: 36px; left: 8px; width: 11px; height: 26px; border: 2px solid #111; transform-origin: 5px 4px; transform: rotate(28deg); z-index: 5; }
        .mob-walking .mob-arm { animation: mobArmWalk 0.4s ease-in-out infinite alternate; }
        @keyframes mobArmWalk { from { transform: rotate(15deg); } to { transform: rotate(40deg); } }
        .mob-weapon-hand { position: absolute; bottom: -6px; right: 2px; width: 30px; height: 30px; transform-origin: 24px 24px; transform: scaleX(-1) rotate(18deg); pointer-events: none; }
        .mob-weapon-hand svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }

        .mob-wing { position: absolute; top: -8px; right: -24px; width: 36px; height: 22px; border: 2px solid #000; transform-origin: left center; animation: wingFlap 0.35s infinite alternate; opacity: 0.9; z-index: 1; }
        @keyframes wingFlap { from { transform: rotate(-20deg) scaleY(1); } to { transform: rotate(25deg) scaleY(0.6); } }

        /* 怪物受击与死亡特效 */
        .mob-hurt { filter: sepia(1) hue-rotate(-50deg) saturate(6) brightness(1.3) !important; transform: translateX(12px); }
        .mob-dead { transition: all 0.45s ease-in !important; transform: translateX(20px) rotate(90deg) scale(0.8) !important; opacity: 0 !important; filter: sepia(1) hue-rotate(-50deg) saturate(8) !important; }

        .anim-swell { animation: swell 2.5s ease-in forwards; } @keyframes swell { 0% { transform: scale(1); filter: brightness(1); } 95% { transform: scale(2.5); filter: brightness(100); opacity: 1;} 100% { transform: scale(3); opacity: 0; } }

        function getTodayStr() { const parts = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()); let y, m, d; parts.forEach(p => { if(p.type==='year') y=p.value; if(p.type==='month') m=p.value; if(p.type==='day') d=p.value; }); return `${y}-${m}-${d}`; }

        function sanitizeVitality(v) {
            if (!v || typeof v !== 'object') v = {};
            v.current = typeof v.current === 'number' ? round1(v.current) : 10.0;
            v.freeze = !!v.freeze;
            if (!v.lastDecayDate) v.lastDecayDate = getTodayStr();
            if (!v.dailyAbsorbed || typeof v.dailyAbsorbed !== 'object') v.dailyAbsorbed = { date: getTodayStr(), amount: 0 };
            if (!v.dailyAbsorbed.date) v.dailyAbsorbed.date = getTodayStr();
            v.dailyAbsorbed.amount = typeof v.dailyAbsorbed.amount === 'number' ? round1(v.dailyAbsorbed.amount) : 0;
            if (typeof v.inactiveDays !== 'number') v.inactiveDays = 0;
            return v;

        async function checkAndApplyDailyVitality(record) {
            record.vitality = sanitizeVitality(record.vitality);
            let iterDate = record.vitality.lastDecayDate;
            let today = getTodayStr();
            let matrix = record.vitalityConfig || [0.2, 0.5, 1.0, 1.5, 2.0, 2.3, 2.5];
            let logs = record.childLogs || [];
            let updated = false;
            let loopCount = 0;
            
            record.coins = record.coins || 0;
            let currentRank = record.currentRank || 1;

            while (iterDate < today && loopCount < 30) {
                loopCount++;
                let parts = iterDate.split('-');
                let d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                d.setDate(d.getDate() + 1);
                iterDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                
                if (!record.vitality.freeze && record.vitality.current > 0) {
                    record.vitality.inactiveDays = (record.vitality.inactiveDays || 0) + 1;
                    let decayIdx = Math.min(record.vitality.inactiveDays - 1, 6);
                    let decay = Number(matrix[decayIdx]) || 0;
                    record.vitality.current = Math.max(0, round1(record.vitality.current - decay));
                    logs.unshift({ time: iterDate + ' 00:00', action: `⚡ 衰减 (-${decay.toFixed(1)}/停训${record.vitality.inactiveDays}天)`, amount: 0 });
                }
                record.vitality.dailyAbsorbed = { date: iterDate, amount: 0 };
                
                let dailyTax = 5;
                if (currentRank >= 9) dailyTax = 15;
                else if (currentRank >= 7) dailyTax = 10;
                else if (currentRank >= 4) dailyTax = 8;
                
                let actualDeducted = Math.min(record.coins, dailyTax);
                if (actualDeducted > 0) {
                    record.coins -= actualDeducted;
                    logs.unshift({ time: iterDate + ' 00:00', action: `⛺ 营地日常消耗`, amount: -actualDeducted });
                }

        function performPatrolStrike() {
            if (!currentMob || !currentMob.el) return;
            const arm = document.getElementById('steve-arm');
            const slash = document.getElementById('steve-slash');
            if (arm) { arm.classList.remove('anim-arm-attack'); void arm.offsetWidth; arm.classList.add('anim-arm-attack'); }
            if (slash) { slash.classList.remove('anim-slash'); void slash.offsetWidth; slash.classList.add('anim-slash'); }

            setTimeout(() => {
                if (!currentMob || !currentMob.el) return;
                currentMob.hp -= 1;
                currentMob.el.classList.add('mob-hurt');

                const segs = currentMob.el.querySelectorAll('.mob-hp-seg');
                segs.forEach((s, idx) => {
                    if (idx >= currentMob.hp) s.classList.add('empty');
                });

                const dmg = document.createElement('div');
                dmg.className = 'dmg-popup';
                dmg.innerText = currentMob.hp === 0 ? '💥 斩杀!' : '-1';
                currentMob.el.appendChild(dmg);

                if (currentMob.hp <= 0) {
                    const deadEl = currentMob.el;
                    const dropX = currentMob.x;
                    currentMob = null;
                    patrolState = 'WALKING';
                    nextMobSpawnTime = Date.now() + 5000 + Math.random() * 5000;

                    setTimeout(() => {
                        deadEl.classList.remove('mob-hurt');
                        deadEl.classList.add('mob-dead');
                        spawnLootDrops(dropX);
                    }, 80);

                    setTimeout(() => {
                        deadEl.remove();

                    }, 520);
                } else {
                    setTimeout(() => {
                        if (currentMob && currentMob.el) currentMob.el.classList.remove('mob-hurt');
                    }, 180);
                }
            }, 140);
        }

        function spawnLootDrops(xPos) {
            const icons = ['✨', '🟢', '🪙'];
            for (let i = 0; i < 4; i++) {
                const p = document.createElement('div');
                p.style.position = 'absolute';
                p.style.left = (xPos + 10) + 'px';

                p.style.fontSize = '18px';

                p.style.transition = 'all 0.55s cubic-bezier(0.2, 0.8, 0.4, 1)';

        function patrolTick() {
            patrolLoopId = requestAnimationFrame(patrolTick);
            if (isAnimating || isGameRunning) return;

            const now = Date.now();
            const steveRightX = window.innerWidth * 0.28 + 68;

            if (patrolState === 'WALKING') {
                if (now >= nextMobSpawnTime) {
                    spawnPatrolMob();
                }
            } else if (patrolState === 'APPROACHING') {
                if (!currentMob) { patrolState = 'WALKING'; return; }
                currentMob.x -= 2.2;
                currentMob.el.style.left = currentMob.x + 'px';

                if (currentMob.x <= steveRightX) {
                    currentMob.x = steveRightX;
                    currentMob.el.style.left = currentMob.x + 'px';
                    currentMob.el.classList.remove('mob-walking');
                    patrolState = 'FIGHTING';
                    setSteveWalking(false);
                    nextSwingTime = now + 200;
                }
            } else if (patrolState === 'FIGHTING') {
                if (!currentMob) { patrolState = 'WALKING'; setSteveWalking(true); return; }
                if (now >= nextSwingTime) {
                    nextSwingTime = now + 680;
                    performPatrolStrike();
                }
            }
        }

            if(isAnimating || isGameRunning) return;

                record = await checkAndApplyDailyVitality(record);
                currentData = record;

                    activeEventData = record.activeEvent;
                    if (chest && chest.style.display !== 'block') {

            record.milestones[type] = round1((record.milestones[type] || 0) + Number(addVal || 1.0));

            let extraCoins = 0;
            for (let tier of MILESTONES) {

                    extraCoins += tier.reward; 
                    record.milestoneClaimed[type].push(tier.count); 
                    logs.unshift({ time: getFormattedTime(), action: `🏆 达成里程碑 [${MS_NAMES[type]}]: ${tier.name}`, amount: tier.reward });

                const dbUpdatePromise = dbClient.from('gamedata').update({ coins: newCoins, currentRank: nextRank, childLogs: logs.slice(0, 10) }).eq('id', ROW_ID);
                setTimeout(async () => {
                    document.body.classList.remove('shake'); playSound('explode'); setTimeout(() => playSound('levelup'), 400);
                    let flash = document.createElement('div'); flash.className = 'flash-overlay'; document.body.appendChild(flash); setTimeout(() => flash.remove(), 1200);
                    createParticles(80, ['✨', '💎', '💠', '🔥', '⚡', '❇️']); if(uiLayer) { uiLayer.style.opacity = '0'; uiLayer.style.transform = 'scale(1)'; }
                    await dbUpdatePromise;
                    setTimeout(() => {
                        localStorage.setItem('andy_last_seen_coins', newCoins); currentData.coins = newCoins; currentData.currentRank = nextRank; updateValue(newCoins);
                        let banner = document.createElement('div'); banner.className = 'level-up-banner';
                        banner.innerHTML = `<div style="font-size:40px; color:#fff;">境界突破</div><div style="font-size:70px; color:#ffb700;">${nextRData.title}</div>`;
                        document.body.appendChild(banner); setTimeout(() => banner.remove(), 3500);
                        if(uiLayer) uiLayer.style.opacity = '1'; isAnimating = false; setSteveWalking(true);
                    }, 500);
                }, 1000); 
            } catch (e) { alert("突破受阻！"); isAnimating = false; setSteveWalking(true); if(uiLayer) { uiLayer.style.opacity = '1'; uiLayer.style.transform = 'scale(1)'; } document.body.classList.remove('shake'); }
        }

        function openLogModal() { if(lModal) lModal.style.display = 'flex'; } function closeLogModal() { if(lModal) lModal.style.display = 'none'; }
        function renderLogs(logs) { const container = document.getElementById('logListContent'); if(!container) return; if(logs && logs.length > 0) { container.innerHTML = logs.map(log => { let amountClass = log.amount > 0 ? "log-v" : "log-v sub"; if (log.action.includes('🏆')) amountClass = "log-v milestone"; let txt = typeof log.amount === 'string' ? log.amount : (log.amount > 0 ? '+' + log.amount : log.amount); return `<div class="log-row"><span class="log-t">[${log.time}]</span><span class="log-a">${log.action}</span><span class="${amountClass}">${txt === '0' || txt === 0 ? '' : txt}</span></div>`; }).join(''); } else container.innerHTML = '<div style="text-align:center; color:#888; padding: 20px 0;">行囊里还没有记录哦~</div>'; }
        function renderBuffs() { if (!currentData || !currentData.activeBuffs) return; const container = document.getElementById('activeBuffsContainer'); if (!container) return; const now = Date.now(); let hasActive = false; let html = ''; for (const [id, buff] of Object.entries(currentData.activeBuffs)) { const remain = buff.endTime - now; if (remain > 0) { hasActive = true; let days = Math.floor(remain / (24 * 3600000)), hours = Math.floor((remain % (24 * 3600000)) / 3600000), mins = Math.floor((remain % 3600000) / 60000), secs = Math.floor((remain % 60000) / 1000); let timeStr = days >= 1 ? `${days}天 ${hours}小时` : `${hours}:${mins<10?'0'+mins:mins}:${secs<10?'0'+secs:secs}`; html += `<div class="buff-pill"><span>${buff.icon} ${buff.name}</span><span style="color:#ffb700;">⏳ ${timeStr}</span></div>`; } } container.innerHTML = hasActive ? html : ''; }
        function processCooldowns() { if(!currentData || !currentData.cooldowns || !currentData.taskItems) return; const now = Date.now(); currentData.taskItems.forEach(task => { const btn = document.getElementById(`btn-${task.id}`); if (!btn) return; const remain = (currentData.cooldowns[task.id] || 0) - now; if(remain > 0) { btn.classList.add('in-cd'); const totalMs = (task.hours || 3) * 3600000; btn.style.setProperty('--progress', (remain / totalMs) * 360 + 'deg'); const h = Math.floor(remain / 3600000), m = Math.floor((remain % 3600000) / 60000), s = Math.floor((remain % 60000) / 1000); let timerEl = btn.querySelector('.cd-timer'); if(timerEl) timerEl.innerText = `${h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`; } else btn.classList.remove('in-cd'); }); }
        
        // 🎉 大场面领奖与受袭演出（单手挥砍联动）
        function playAttackSequence(amount, finalCoins) {
            isAnimating = true; clearPatrolMob(); setSteveWalking(false);
            if(uiLayer) uiLayer.style.opacity = '0.15';
            if(heroCreeper) { heroCreeper.style.display = 'block'; heroCreeper.style.right = "35%"; }
            let arm = document.getElementById('steve-arm');
            let slash = document.getElementById('steve-slash');
            setTimeout(() => {
                if(arm) { arm.classList.remove('anim-arm-attack'); void arm.offsetWidth; arm.classList.add('anim-arm-attack'); }
                if(slash) { slash.classList.remove('anim-slash'); void slash.offsetWidth; slash.classList.add('anim-slash'); }
                playSound('hit');
                setTimeout(() => { if(heroCreeper) heroCreeper.classList.add('anim-hurt'); }, 150);
            }, 400);
            setTimeout(() => { if(heroCreeper) heroCreeper.style.display = 'none'; createParticles(60, '💰'); playSound('levelup'); if(statusMsg) { statusMsg.innerText = `战利品入账！+${amount}`; statusMsg.style.color="#2ecc71"; } }, 1100);
            setTimeout(() => { updateValue(finalCoins); resetStage(); }, 2800);
        }

        function playExplodeSequence(amount, finalCoins, customMsg) {
            isAnimating = true; clearPatrolMob(); setSteveWalking(false);
            if(uiLayer) uiLayer.style.opacity = '0.15';
            if(heroCreeper) { heroCreeper.style.display = 'block'; heroCreeper.style.right = "45%"; }
            setTimeout(() => { playSound('fuse'); if(heroCreeper) heroCreeper.classList.add('anim-swell'); }, 400);
            setTimeout(() => { if(heroCreeper) heroCreeper.style.opacity = '0'; document.body.classList.add('shake'); createParticles(40, '🟥'); playSound('explode'); if(statusMsg) { statusMsg.innerText = customMsg; statusMsg.style.color = "#ff4444"; } }, 2300);
            setTimeout(() => { document.body.classList.remove('shake'); updateValue(finalCoins); resetStage(); }, 3600);
        }

        function resetStage() {
            if(uiLayer) uiLayer.style.opacity = '1';
            if(heroCreeper) { heroCreeper.style.display = 'none'; heroCreeper.style.opacity = '1'; heroCreeper.className='actor skin-creeper'; }
            isAnimating = false;
            patrolState = 'WALKING';
            setSteveWalking(true);
            nextMobSpawnTime = Date.now() + 4000;
        }

        function updateValue(coins) { if(totalDisplay) totalDisplay.innerText = coins; updateRankUI(coins, currentData ? (currentData.currentRank || 1) : 1); }
        function createParticles(c, chars) { const isArray = Array.isArray(chars); for (let i = 0; i < c; i++) { const el = document.createElement('div'); el.classList.add('confetti'); el.innerText = isArray ? chars[Math.floor(Math.random() * chars.length)] : chars; const angle = Math.random() * 360, dist = 50 + Math.random() * 100; el.style.setProperty('--tx', (Math.cos(angle * Math.PI / 180) * dist) + 'vw'); el.style.setProperty('--ty', (Math.sin(angle * Math.PI / 180) * dist) + 'vh'); document.body.appendChild(el); setTimeout(() => el.remove(), 1000); } }
        function clickCoin() { if(!isMuted) { sfxClick.currentTime = 0; sfxClick.play().catch(e=>{}); } }
        function toggleMute() { isMuted = !isMuted; bgm[isMuted ? 'pause' : 'play'](); document.querySelector('.mute-btn').innerText = isMuted ? '🔇' : '🔊'; }
        function playSound(type) { if(isMuted) return; try { if(type === 'levelup') sfxLevelUp.play(); if(type === 'explode') sfxExplode.play(); if(type === 'hit') sfxHit.play(); if(type === 'fuse') sfxFuse.play(); } catch(e){} }
    </script>
</body>
</html>
