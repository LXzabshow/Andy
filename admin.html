<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家长控制面板</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px 10px; background: #121212; color: #eee; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #1e1e1e; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #333; }
        .card-header h3 { margin: 0; color: #888; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center;}
        .rank-info { font-size: 12px; color: #ffb700; background: #333; padding: 3px 8px; border-radius: 4px;}
        .big-num { font-size: 60px; font-weight: bold; margin: 10px 0 20px 0; color: #ffb700; text-align: center; font-family: 'Courier New', monospace;}
        .cap-text { font-size: 12px; color: #888; text-align: center; margin-top: -15px; margin-bottom: 15px; }
        
        .log-item { background: #252525; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; border-left: 4px solid #007aff; display: flex; justify-content: space-between; }
        .log-time { color: #888; font-family: monospace; font-size: 11px; margin-right: 8px; min-width: 80px;}
        .log-action { color: #ddd; font-weight: bold; flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .log-amount { color: #27ae60; font-weight: bold; min-width: 30px; text-align: right; }
        .log-amount.sub { color: #e74c3c; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;}
        button { padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-add { background: #1c7a44; color: white; }
        .btn-sub { background: #962d22; color: white; }
        .btn-primary { background: #007aff; color: white; width: 100%; }
        .btn-danger { background: #c0392b; color: white; padding: 8px; font-size: 12px; }
        .input-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #121212; color: white; font-size: 15px; box-sizing: border-box; }
        textarea.input-box { resize: vertical; min-height: 80px; font-family: inherit; line-height: 1.5; }
        
        .flex-row { display: flex; justify-content: space-between; align-items: center; }
        .switch { position: relative; width: 44px; height: 24px; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #34c759; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        #log-status { color: #888; font-size: 12px; text-align: center; padding: 10px; }

        .shop-item { background: #252525; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #444;}
        .buff-item { background: rgba(139,0,0,0.2); border-left: 4px solid #ffb700; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        #taskModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; display: none; justify-content: center; align-items: center; }
        .modal-content { background: #2c2c2e; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; }
        .modal-content h3 { margin-top: 0; text-align: center; color: white; font-size: 20px; margin-bottom: 20px;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: #a1a1aa; font-size: 14px;}
        .modal-btns { display: flex; gap: 10px; margin-top: 25px; }
        .btn-cancel { background: #444; color: white; flex: 1; }
        .btn-confirm { background: #34c759; color: white; flex: 1; }
        
        /* 针对配置面板的小型输入框调整 */
        .config-input { width: 60px; padding: 5px; text-align: center; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff;}
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h3>💰 资产余额</h3>
                <span id="rankBadge" class="rank-info">读取中...</span>
            </div>
            <div id="currentCoins" class="big-num">...</div>
            <div id="capText" class="cap-text">背包容量上限: ---</div>
            
            <div style="margin-top: 5px;">
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <input type="number" id="manualInput" class="input-box" style="flex:1;" placeholder="数额">
                    <input type="text" id="manualReason" class="input-box" style="flex:2;" placeholder="输入增减理由 (选填)">
                </div>
                <div class="grid">
                    <button class="btn-add" onclick="manualMod(1)">奖励 (+)</button>
                    <button class="btn-sub" onclick="manualMod(-1)">扣减 (-)</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h3 id="buffCardTitle">✨ 生效中的特权 (BUFF)</h3></div>
            <div id="adminBuffList" style="margin-top: 10px;">
                <div style="text-align:center; color:#555; padding:10px;">暂无生效状态</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h3 style="color:#d35400;">🏰 高塔经济学配置</h3></div>
            <div style="display:flex; flex-direction:column; gap:12px; margin-top:15px; font-size: 14px;">
                <div class="flex-row">
                    <span style="color:#aaa;">每日免费次数:</span>
                    <input type="number" id="tc_free" class="config-input">
                </div>
                <div class="flex-row">
                    <span style="color:#aaa;">每日领奖上限:</span>
                    <input type="number" id="tc_max" class="config-input">
                </div>
                <hr style="border-color:#333; margin:0;">
                <div class="flex-row">
                    <span style="color:#2ecc71; font-weight:bold;">🟢 普通(6x6)</span>
                    <div>门票: <input type="number" id="tc_n_t" class="config-input" style="width:45px;"> | 奖: <input type="number" id="tc_n_r" class="config-input" style="width:45px;"></div>
                </div>
                <div class="flex-row">
                    <span style="color:#e74c3c; font-weight:bold;">🔴 困难(7x7)</span>
                    <div>门票: <input type="number" id="tc_h_t" class="config-input" style="width:45px;"> | 奖: <input type="number" id="tc_h_r" class="config-input" style="width:45px;"></div>
                </div>
                <div class="flex-row">
                    <span style="color:#9b59b6; font-weight:bold;">💀 生存(7x7)</span>
                    <div>门票: <input type="number" id="tc_s_t" class="config-input" style="width:45px;"> | 奖: <input type="number" id="tc_s_r" class="config-input" style="width:45px;"></div>
                </div>
                <button class="btn-primary" onclick="saveTowerConfig()" style="background:#d35400; margin-top:5px;">💾 覆写高塔法则</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h3>🕒 增减记录</h3></div>
            <div id="childLogList" style="margin-top:10px;">
                <div style="text-align:center; color:#555; padding:20px;">暂无记录</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h3>⚔️ 任务告示牌管理</h3></div>
            <div style="margin-top: 15px; display:flex; flex-direction: column; gap: 10px;">
                <div style="display:flex; gap:10px;">
                    <select id="t_icon" class="input-box" style="flex:1; padding: 12px 5px; text-align: center;">
                        <option value="🏃">🏃 运动</option>
                        <option value="🧪">🧪 专注</option>
                        <option value="📝">📝 书写</option>
                        <option value="🌋">🌋 探索</option>
                        <option value="⚡">⚡ 极速</option>
                        <option value="🪶">🪶 轻盈</option>
                        <option value="📖">📖 深度</option>
                        <option value="📚">📚 阅读</option>
                        <option value="⚔️">⚔️ 战斗</option>
                        <option value="🛡️">🛡️ 防御</option>
                        <option value="⛏️">⛏️ 采掘</option>
                        <option value="🧹">🧹 家务</option>
                        <option value="🧠">🧠 思考</option>
                    </select>
                    <input type="text" id="t_name" class="input-box" style="flex:3;" placeholder="任务名称">
                </div>
                <input type="text" id="t_desc" class="input-box" placeholder="给孩子的底线规则描述">
                <div style="display:flex; gap:10px;">
                    <input type="number" id="t_price" class="input-box" style="flex:1;" placeholder="奖励(币)">
                    <input type="number" id="t_hours" class="input-box" style="flex:1;" placeholder="冷却(小时)">
                </div>
                <button class="btn-primary" onclick="addTaskItem()" style="background:#27ae60;">➕ 上架新任务</button>
            </div>
            <div id="adminTaskList" style="margin-top: 15px;"></div>
        </div>

        <div class="card">
            <div class="card-header"><h3>🛒 神秘商店管理</h3></div>
            <div style="margin-top: 15px; display:flex; flex-direction: column; gap: 10px;">
                <div style="display:flex; gap:10px;">
                    <select id="s_icon" class="input-box" style="flex:1; padding: 12px 5px; text-align: center;">
                        <option value="🎫">🎫 凭证</option>
                        <option value="⚔️">⚔️ 铁剑</option>
                        <option value="🛡️">🛡️ 盾牌</option>
                        <option value="⛏️">⛏️ 镐子</option>
                        <option value="🪓">🪓 斧头</option>
                        <option value="💎">💎 钻石</option>
                        <option value="🥇">🥇 金锭</option>
                        <option value="🟢">🟢 绿宝石</option>
                        <option value="🔮">🔮 末影珍珠</option>
                        <option value="🪵">🪵 原木</option>
                        <option value="🪨">🪨 圆石</option>
                        <option value="🧪">🧪 药水</option>
                        <option value="⚡">⚡ 红石粉</option>
                        <option value="✨">✨ 经验球</option>
                        <option value="📜">📜 附魔书</option>
                        <option value="🍎">🍎 苹果</option>
                        <option value="🍖">🍖 熟肉</option>
                        <option value="🍞">🍞 面包</option>
                        <option value="🗝️">🗝️ 钥匙</option>
                        <option value="👑">👑 王冠</option>
                        <option value="🪟">🪟 窗台</option>
                    </select>
                    <input type="text" id="s_name" class="input-box" style="flex:3;" placeholder="商品名称">
                </div>
                <input type="text" id="s_desc" class="input-box" placeholder="兑换权益描述">
                <div style="display:flex; gap:10px;">
                    <input type="number" id="s_price" class="input-box" style="flex:1;" placeholder="售价(币)">
                    <input type="number" id="s_hours" class="input-box" style="flex:1;" placeholder="时效(小时)">
                </div>
                <button class="btn-primary" onclick="addShopItem()">➕ 部署上架</button>
            </div>
            <div id="shopList" style="margin-top: 15px;"></div>
        </div>

        <div class="card">
            <div class="card-header"><h3>📜 临时空投悬赏</h3></div>
            <button class="btn-primary" style="margin-top:10px;" onclick="openTaskModal()">✨ 投放随机悬赏宝箱</button>
        </div>

        <div class="card">
            <div class="card-header"><h3>⚙️ 自动化扣除规则</h3></div>
            <div class="flex-row" style="margin-top:15px;">
                <span>每日自动消耗:</span>
                <label class="switch">
                    <input type="checkbox" id="dailyToggle" onchange="saveDaily()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="flex-row" style="margin-top:10px;">
                <span>每日数额:</span>
                <input type="number" id="dailyAmount" class="input-box" style="width:70px; padding:5px; text-align:center;" onchange="saveDaily()">
            </div>
        </div>
        <div id="log-status">数据建立握手...</div>
    </div>

    <div id="taskModal">
        <div class="modal-content">
            <h3>发布临时悬赏挑战</h3>
            <div class="form-group"><label>问题描述 (可回车换行)</label><textarea id="t_question" class="input-box"></textarea></div>
            <div class="form-group"><label>标准答案</label><input type="text" id="t_answer" class="input-box"></div>
            <div class="grid">
                <div class="form-group"><label>奖励币数</label><input type="number" id="t_reward" class="input-box"></div>
                <div class="form-group"><label>有效时间 (小时)</label><input type="number" id="t_hours" class="input-box"></div>
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeTaskModal()">取消</button>
                <button class="btn-confirm" onclick="saveTask()">发布至云端</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ollnjvnytqmurqxvqtrp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kifp-3_BCphodjxVLIQyow_2cf0WhbB';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentData = null;
        let timerInterval = null;
        const ROW_ID = 1; 

        const RANK_DATA = [
            { rank: 1, cap: 200, title: "🪵 新手伐木工" },
            { rank: 2, cap: 350, title: "🪨 洞穴探索者" },
            { rank: 3, cap: 600, title: "🛡️ 铁甲护卫" },
            { rank: 4, cap: 1000, title: "🥇 寻金探险家" },
            { rank: 5, cap: 1500, title: "⚡ 红石工程师" },
            { rank: 6, cap: 2500, title: "💎 钻石先锋" },
            { rank: 7, cap: 4000, title: "🔮 黑曜石行者" },
            { rank: 8, cap: 6000, title: "🟢 绿宝石领主" },
            { rank: 9, cap: 10000, title: "🔥 合金战神" },
            { rank: 10, cap: Infinity, title: "🐲 末影屠龙者" }
        ];

        function getTodayStr() { 
            const parts = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
            let y, m, d; parts.forEach(p => { if(p.type==='year') y=p.value; if(p.type==='month') m=p.value; if(p.type==='day') d=p.value; });
            return `${y}-${m}-${d}`;
        }

        function getFormattedTime() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            return `${month}-${day} ${hours}:${mins}`;
        }

        async function getCoins() {
            try {
                const { data, error } = await dbClient.from('gamedata').select('*').eq('id', ROW_ID);
                if (error) throw error;
                if(!data || data.length === 0) return;
                
                currentData = data[0];
                currentData.currentRank = currentData.currentRank || 1;
                currentData.shopItems = currentData.shopItems || [];
                currentData.activeBuffs = currentData.activeBuffs || {};
                currentData.taskItems = currentData.taskItems || [];
                
                // 数据平滑过渡
                currentData.schulteDaily = currentData.schulteDaily || { lastDate: "", playCount: 0, winCount: 0 };
                
                // 💡 高塔默认配置初始化与绑定
                if(!currentData.towerConfig) {
                    currentData.towerConfig = {
                        freePlays: 5, maxRewards: 5,
                        normal: { ticket: 1, reward: 2 },
                        hard: { ticket: 1, reward: 4 },
                        survival: { ticket: 2, reward: 6 }
                    };
                    // 仅首次缺失时静默注入，防打断
                    dbClient.from('gamedata').update({ towerConfig: currentData.towerConfig }).eq('id', ROW_ID);
                }
                bindTowerConfigUI(currentData.towerConfig);
                
                let rData = RANK_DATA[currentData.currentRank - 1];
                document.getElementById('currentCoins').innerText = currentData.coins;
                document.getElementById('rankBadge').innerText = `${rData.title} (Lv.${currentData.currentRank})`;
                document.getElementById('capText').innerText = `当前背包容量上限: ${rData.cap === Infinity ? '无限' : rData.cap}`;
                
                let sWin = (currentData.schulteDaily.lastDate === getTodayStr()) ? currentData.schulteDaily.winCount : 0;
                let sPlay = (currentData.schulteDaily.lastDate === getTodayStr()) ? currentData.schulteDaily.playCount : 0;
                let tMax = currentData.towerConfig.maxRewards;
                document.getElementById('buffCardTitle').innerText = `✨ 特权监控 (今日高塔 - 开局:${sPlay}次 | 领奖:${sWin}/${tMax})`;

                renderLogs(currentData.childLogs);
                renderShopItems(currentData.shopItems);
                renderTaskItems(currentData.taskItems);
                
                if(currentData.dailyConfig) {
                    document.getElementById('dailyToggle').checked = currentData.dailyConfig.enabled;
                    document.getElementById('dailyAmount').value = currentData.dailyConfig.amount;
                }
                document.getElementById('log-status').innerText = "✅ 数据同步良好 - " + new Date().toLocaleTimeString();
            } catch (e) { 
                document.getElementById('log-status').innerText = "❌ 刷新失败: " + e.message; 
            }
        }

        // --- 高塔配置管理区 ---
        function bindTowerConfigUI(conf) {
            document.getElementById('tc_free').value = conf.freePlays;
            document.getElementById('tc_max').value = conf.maxRewards;
            document.getElementById('tc_n_t').value = conf.normal.ticket;
            document.getElementById('tc_n_r').value = conf.normal.reward;
            document.getElementById('tc_h_t').value = conf.hard.ticket;
            document.getElementById('tc_h_r').value = conf.hard.reward;
            document.getElementById('tc_s_t').value = conf.survival.ticket;
            document.getElementById('tc_s_r').value = conf.survival.reward;
        }

        async function saveTowerConfig() {
            const conf = {
                freePlays: parseInt(document.getElementById('tc_free').value),
                maxRewards: parseInt(document.getElementById('tc_max').value),
                normal: { ticket: parseInt(document.getElementById('tc_n_t').value), reward: parseInt(document.getElementById('tc_n_r').value) },
                hard: { ticket: parseInt(document.getElementById('tc_h_t').value), reward: parseInt(document.getElementById('tc_h_r').value) },
                survival: { ticket: parseInt(document.getElementById('tc_s_t').value), reward: parseInt(document.getElementById('tc_s_r').value) }
            };
            document.getElementById('log-status').innerText = "正在覆写高塔法则...";
            const { error } = await dbClient.from('gamedata').update({ towerConfig: conf }).eq('id', ROW_ID);
            if(!error) { alert("高塔法则覆写成功！孩子端已同步。"); getCoins(); }
            else { alert("保存失败，请检查网络！"); }
        }
        // --- 高塔配置结束 ---

        function renderLogs(logs) {
            const logContainer = document.getElementById('childLogList');
            if(logs && logs.length > 0) {
                logContainer.innerHTML = logs.map(log => {
                    const amountClass = log.amount > 0 ? "log-amount" : "log-amount sub";
                    const amountText = log.amount > 0 ? '+' + log.amount : log.amount;
                    return `<div class="log-item"><span class="log-time">[${log.time}]</span><span class="log-action">${log.action}</span><span class="${amountClass}">${amountText}</span></div>`;
                }).join('');
            } else {
                logContainer.innerHTML = '<div style="text-align:center; color:#555; padding:20px;">暂无记录</div>';
            }
        }

        function renderShopItems(items) {
            const container = document.getElementById('shopList');
            if(items.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#555; padding:10px;">货架空空如也</div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="shop-item">
                    <div style="flex:1;">
                        <div style="font-weight:bold; font-size:15px; color:#ffb700;">${item.icon} ${item.name}</div>
                        <div style="font-size:12px; color:#aaa; margin:4px 0;">${item.desc}</div>
                        <div style="font-size:12px; color:#27ae60;">💰 ${item.price} 币 | ⏳ ${item.hours} 小时</div>
                    </div>
                    <button class="btn-danger" onclick="deleteShopItem('${item.id}')">下架</button>
                </div>
            `).join('');
        }

        function renderTaskItems(items) {
            const container = document.getElementById('adminTaskList');
            if(!container) return;
            if(items.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#555; padding:10px;">告示牌空空如也</div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="shop-item" style="border-color: #27ae60;">
                    <div style="flex:1;">
                        <div style="font-weight:bold; font-size:15px; color:#2ecc71;">${item.icon} ${item.name}</div>
                        <div style="font-size:12px; color:#aaa; margin:4px 0;">${item.desc}</div>
                        <div style="font-size:12px; color:#27ae60;">🪙 +${item.price} 币 | ⏳ 冷却: ${item.hours} 小时</div>
                    </div>
                    <button class="btn-danger" onclick="deleteTaskItem('${item.id}')">下架</button>
                </div>
            `).join('');
        }

        async function addTaskItem() {
            const icon = document.getElementById('t_icon').value;
            const name = document.getElementById('t_name').value.trim();
            const desc = document.getElementById('t_desc').value.trim();
            const price = parseInt(document.getElementById('t_price').value);
            const hours = parseFloat(document.getElementById('t_hours').value);

            if(!name || !desc || !price || !hours) return alert("请完整填写任务信息！");

            let items = currentData.taskItems || [];
            items.push({ id: 'task_' + Date.now(), icon, name, desc, price, hours });

            document.getElementById('log-status').innerText = "挑战上架中...";
            const { error } = await dbClient.from('gamedata').update({ taskItems: items }).eq('id', ROW_ID);
            if(!error) {
                document.getElementById('t_name').value = '';
                document.getElementById('t_desc').value = '';
                document.getElementById('t_price').value = '';
                document.getElementById('t_hours').value = '';
                getCoins();
            }
        }

        async function deleteTaskItem(id) {
            if(!confirm("确定下架此项任务挑战吗？")) return;
            let items = currentData.taskItems.filter(i => i.id !== id);
            document.getElementById('log-status').innerText = "挑战下架中...";
            const { error } = await dbClient.from('gamedata').update({ taskItems: items }).eq('id', ROW_ID);
            if(!error) getCoins();
        }

        function updateBuffTimers() {
            if (!currentData || !currentData.activeBuffs) return;
            const container = document.getElementById('adminBuffList');
            const now = Date.now();
            let hasActive = false;
            let html = '';

            for (const [id, buff] of Object.entries(currentData.activeBuffs)) {
                const remain = buff.endTime - now;
                if (remain > 0) {
                    hasActive = true;
                    let days = Math.floor(remain / (24 * 3600000));
                    let hours = Math.floor((remain % (24 * 3600000)) / 3600000);
                    let mins = Math.floor((remain % 3600000) / 60000);
                    
                    let timeStr = days >= 1 ? `${days}天 ${hours}小时` : `${hours}小时 ${mins}分`;

                    html += `
                        <div class="buff-item">
                            <div style="font-weight:bold; color:#fff;">${buff.icon} ${buff.name}</div>
                            <div style="color:#ffb700; font-size:14px; font-weight:bold;">${timeStr}</div>
                        </div>
                    `;
                }
            }
            container.innerHTML = hasActive ? html : '<div style="text-align:center; color:#555; padding:10px;">暂无生效状态</div>';
        }

        async function modifyCoins(amount, reason) {
            if (amount === 0) return;
            document.getElementById('log-status').innerText = "写入云端...";
            
            let maxCap = RANK_DATA[(currentData.currentRank || 1) - 1].cap;
            let targetCoins = currentData.coins + amount;
            let finalCoins = Math.max(0, Math.min(targetCoins, maxCap));
            let actualDelta = finalCoins - currentData.coins;

            if (actualDelta === 0) {
                alert("操作无效：已达容量上限或余额已为 0！");
                document.getElementById('log-status').innerText = "✅ 数据同步良好";
                return;
            }

            let logs = currentData.childLogs || [];
            logs.unshift({ time: getFormattedTime(), action: reason, amount: actualDelta });
            logs = logs.slice(0, 10); 

            let payload = { coins: finalCoins, childLogs: logs };
            const { error } = await dbClient.from('gamedata').update(payload).eq('id', ROW_ID);
            if(!error) getCoins();
        }

        function manualMod(sign) {
            let val = parseInt(document.getElementById('manualInput').value);
            let reason = document.getElementById('manualReason').value.trim();
            if(val > 0) {
                if (!reason) reason = sign > 0 ? "手动奖励" : "手动扣减";
                modifyCoins(val * sign, reason);
                document.getElementById('manualInput').value = ""; 
                document.getElementById('manualReason').value = ""; 
            }
        }

        async function saveDaily() {
            document.getElementById('log-status').innerText = "保存设置中...";
            let dailyConfig = { enabled: document.getElementById('dailyToggle').checked, amount: parseInt(document.getElementById('dailyAmount').value) || 0, lastDeductDate: getTodayStr() };
            const { error } = await dbClient.from('gamedata').update({ dailyConfig }).eq('id', ROW_ID);
            if(!error) getCoins();
        }

        async function openTaskModal() {
            document.getElementById('taskModal').style.display = 'flex';
            const now = Date.now();
            if(currentData.activeEvent && currentData.activeEvent.expireTime > now) {
                document.getElementById('t_question').value = currentData.activeEvent.question;
                document.getElementById('t_answer').value = currentData.activeEvent.answer;
                document.getElementById('t_reward').value = currentData.activeEvent.reward;
                document.getElementById('t_hours').value = Math.ceil((currentData.activeEvent.expireTime - now) / 3600000);
            } else {
                ['t_question','t_answer','t_reward','t_hours'].forEach(id => document.getElementById(id).value = "");
            }
        }
        function closeTaskModal() { document.getElementById('taskModal').style.display = 'none'; }

        async function saveTask() {
            const q = document.getElementById('t_question').value.trim();
            const a = document.getElementById('t_answer').value.trim();
            const r = parseInt(document.getElementById('t_reward').value);
            const h = parseFloat(document.getElementById('t_hours').value);
            if(!q || !a || !r || !h) return alert("请完整填写表单！");

            const { error } = await dbClient.from('gamedata').update({ activeEvent: { question: q, answer: a, reward: r, expireTime: Date.now() + (h * 3600000) } }).eq('id', ROW_ID);
            if(!error) { closeTaskModal(); getCoins(); }
        }

        window.onload = () => { 
            getCoins(); 
            setInterval(getCoins, 5000); 
            setInterval(updateBuffTimers, 1000);
        };
    </script>
</body>
</html>
