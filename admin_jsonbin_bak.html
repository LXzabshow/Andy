<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家长控制面板</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px 10px; background: #121212; color: #eee; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #1e1e1e; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #333; }
        .card-header h3 { margin: 0; color: #888; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .big-num { font-size: 60px; font-weight: bold; margin: 10px 0; color: #ffb700; text-align: center; font-family: 'Courier New', monospace;}
        
        /* 日志样式 */
        .log-item { background: #252525; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; border-left: 4px solid #007aff; display: flex; justify-content: space-between; }
        .log-time { color: #666; font-family: monospace; }
        .log-action { color: #ddd; font-weight: bold; }
        .log-amount { color: #27ae60; font-weight: bold; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;}
        button { padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-add { background: #1c7a44; color: white; }
        .btn-sub { background: #962d22; color: white; }
        .btn-primary { background: #007aff; color: white; width: 100%; }
        .input-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #121212; color: white; font-size: 16px; box-sizing: border-box; }
        
        .flex-row { display: flex; justify-content: space-between; align-items: center; }
        .switch { position: relative; width: 44px; height: 24px; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #34c759; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        #log-status { color: #888; font-size: 12px; text-align: center; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header"><h3>💰 资产余额</h3></div>
            <div id="currentCoins" class="big-num">...</div>
            
            <div class="grid">
                <button class="btn-add" onclick="modifyCoins(50, '额外大奖')">+50 大奖</button>
                <button class="btn-sub" onclick="modifyCoins(-50, '兑换奖励')">-50 兑换</button>
            </div>
            
            <div style="margin-top: 15px; border-top: 1px solid #333; padding-top: 15px;">
                <input type="number" id="manualInput" class="input-box" placeholder="输入自定义数额 (如: 20)">
                <div class="grid">
                    <button class="btn-add" onclick="manualMod(1)">奖励 (+)</button>
                    <button class="btn-sub" onclick="manualMod(-1)">惩罚 (-)</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h3>🕒 最近申报记录 (审计)</h3></div>
            <div id="childLogList" style="margin-top:10px;">
                <div style="text-align:center; color:#555; padding:20px;">暂无申报记录</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h3>📜 挑战任务</h3></div>
            <button class="btn-primary" style="margin-top:10px;" onclick="location.href='https://andy-world.top/index.html'">前往发布任务</button>
        </div>

        <div class="card">
            <div class="card-header"><h3>⚙️ 规则设置</h3></div>
            <div class="flex-row" style="margin-top:15px;">
                <span>每日自动扣除:</span>
                <label class="switch">
                    <input type="checkbox" id="dailyToggle" onchange="saveDaily()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="flex-row" style="margin-top:10px;">
                <span>每日数额:</span>
                <input type="number" id="dailyAmount" class="input-box" style="width:70px; padding:5px; text-align:center;" onchange="saveDaily()">
            </div>
        </div>
        
        <div id="log-status">数据同步中...</div>
    </div>

    <script>
        const BIN_ID = '695f1cbed0ea881f405c1aab'; 
        const API_KEY = '$2a$10$pSEOl/63AtvEMUqQopzGeuhVgcRcfXSz5L8lyQdZZHZM66zdYKI0O'; 
        const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        
        let currentData = null;

        async function getCoins() {
            try {
                let res = await fetch(BASE_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                let json = await res.json();
                currentData = json.record;
                document.getElementById('currentCoins').innerText = currentData.coins;
                
                // 渲染日志
                const logContainer = document.getElementById('childLogList');
                if(currentData.childLogs && currentData.childLogs.length > 0) {
                    logContainer.innerHTML = currentData.childLogs.map(log => `
                        <div class="log-item">
                            <span class="log-time">[${log.time}]</span>
                            <span class="log-action">${log.action}</span>
                            <span class="log-amount">${log.amount > 0 ? '+'+log.amount : log.amount}</span>
                        </div>
                    `).join('');
                }

                // 渲染自动配置
                if(currentData.dailyConfig) {
                    document.getElementById('dailyToggle').checked = currentData.dailyConfig.enabled;
                    document.getElementById('dailyAmount').value = currentData.dailyConfig.amount;
                }
                document.getElementById('log-status').innerText = "✅ 同步成功 - " + new Date().toLocaleTimeString();
            } catch (e) { document.getElementById('log-status').innerText = "❌ 刷新失败"; }
        }

        async function modifyCoins(amount, reason) {
            document.getElementById('log-status').innerText = "写入云端...";
            let record = currentData;
            let newCoins = Math.max(0, record.coins + amount);
            let payload = { ...record, coins: newCoins, historicalMaxCoins: Math.max(newCoins, record.historicalMaxCoins || 0) };
            
            await fetch(BASE_URL, {
                method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(payload)
            });
            getCoins();
        }

        // 修正后的自定义输入逻辑
        function manualMod(sign) {
            let val = parseInt(document.getElementById('manualInput').value);
            if(val > 0) {
                // val 取绝对值计算，sign 决定加减
                modifyCoins(val * sign, sign > 0 ? "手动奖励" : "手动惩罚");
                document.getElementById('manualInput').value = ""; // 执行后清空输入框
            }
        }

        async function saveDaily() {
            let record = currentData;
            record.dailyConfig = {
                enabled: document.getElementById('dailyToggle').checked,
                amount: parseInt(document.getElementById('dailyAmount').value) || 0,
                lastDeductDate: new Date().toISOString().split('T')[0]
            };
            await fetch(BASE_URL, {
                method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(record)
            });
            getCoins();
        }

        window.onload = () => { getCoins(); setInterval(getCoins, 10000); };
    </script>
</body>
</html>
